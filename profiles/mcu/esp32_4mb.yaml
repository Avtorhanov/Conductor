# ESP32 (классический) с флешем 4 МБ — самый частый модуль (ESP32-WROOM-32 и др.).

id: esp32_4mb
name: ESP32 с флешем 4 МБ (ESP32-WROOM-32 и др.)
class: mcu.esp
match:
  name: "ESP32"
  size: 4194304
priority: 10
voltage: 3.3
size: 4194304
allow_write: true

tool:                  # модель esptool узнаёт сам; chip ускоряет подключение
  esptool: {chip: esp32}

# Разделы — по таблице разделов самой прошивки (0x8000, core/layout_detect.py): nvs и phy_init
# сохраняются с чипа при любом ремонте; app и otadata — по типам. Таблица испорчена — находка.
layout_auto: [esp_partitions]

checks:
  - stable_read
  - not_zero
  - not_blank
  - size_matches
  - type: magic        # у классического ESP32 загрузчик лежит с адреса 0x1000, первый байт образа 0xE9
    offset: 0x1000
    hex: "E9"
    title: заголовок загрузчика ESP32 (0x1000)
  - type: magic        # таблица разделов по умолчанию с 0x8000, запись начинается с AA 50
    offset: 0x8000
    hex: "AA50"
    title: таблица разделов (0x8000)
  - compare_reference

recipes:
  - id: restore_reference
    title: Записать эталонную прошивку
    action: write_reference
  - id: restore_image
    title: Записать полный образ флеша 4 МБ (--image)
    action: write_image
  - id: restore_regions
    title: Восстановить только повреждённые разделы (по таблице разделов)
    action: write_reference_regions

notes: |
  Смещения загрузчика (0x1000) и таблицы разделов (0x8000) — для классического ESP32
  (у ESP32-S3/C3 загрузчик с 0x0 — для них свой профиль).
  Уникальные данные (NVS, phy_init) Дирижёр находит сам — по таблице разделов в дампе (layout_auto);
  они сохраняются с чипа. Нестандартное смещение таблицы (не 0x8000) — опишите layout в профиле платы.
  Если включено шифрование флеша, дамп — шифротекст: восстанавливайте только копией с ЭТОЙ ЖЕ платы.
