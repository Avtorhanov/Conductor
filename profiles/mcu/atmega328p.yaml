# ATmega328P (Arduino Uno/Nano и множество устройств). Узнаётся по подписи 1E950F.
# Образ плагина avrdude: [flash 32 КБ][EEPROM 1 КБ] = 33792 байта
# (настройки avrdude: memories: [flash, eeprom], flash_size: 32768, eeprom_size: 1024).

id: atmega328p
name: Microchip ATmega328P (32 КБ flash + 1 КБ EEPROM)
class: mcu.avr
match:
  signature: "1E950F"
priority: 10
voltage: null          # чип работает от 1.8 до 5.5 В: подтвердите напряжение платы и адаптера
size: 33792
allow_write: true

tool:                  # настройки avrdude для этой модели: образ flash + EEPROM = size
  avrdude: {part: m328p, memories: [flash, eeprom], flash_size: 32768, eeprom_size: 1024}

# Расшифровка фьюзов и lock-битов (только чтение: avrdude -n -U lfuse:r:-:h …; core/fuses.py).
# Бит фьюза «запрограммирован» = 0. По даташиту ATmega328P, разделы 28.2–28.3 (ПРОВЕРИТЬ НА ЖЕЛЕЗЕ:
# значения, которые avrdude печатает для efuse: неиспользуемые биты бывают 1 или 0 — маска их не учитывает).
fuses:
  lfuse:
    - name: Источник тактирования (CKSEL)
      mask: 0x0F
      values:
        0x00: внешний тактовый сигнал на XTAL1 — без генератора МК не запустится
        0x02: внутренний RC-генератор 8 МГц
        0x03: внутренний RC-генератор 128 кГц — программатору нужен медленный такт (bitclock)
        0x04: часовой кварц 32 кГц
        0x05: часовой кварц 32 кГц
        0x06: кварц, полный размах (full swing)
        0x07: кварц, полный размах (full swing)
        0x08: керамический резонатор 0,4–0,9 МГц
        0x09: керамический резонатор 0,4–0,9 МГц
        0x0A: кварц/резонатор 0,9–3 МГц
        0x0B: кварц/резонатор 0,9–3 МГц
        0x0C: кварц/резонатор 3–8 МГц
        0x0D: кварц/резонатор 3–8 МГц
        0x0E: внешний кварц 8–16 МГц
        0x0F: внешний кварц 8–16 МГц
      status: {0x00: warn, 0x03: warn}
      why: Если МК перестал отвечать программатору, причина часто в источнике тактирования.
    - name: Делитель частоты на 8 (CKDIV8)
      mask: 0x80
      values: {0x00: "включён — МК работает в 8 раз медленнее кварца", 0x80: выключен}
    - name: Вывод такта на PB0 (CKOUT)
      mask: 0x40
      values: {0x00: включён, 0x40: выключен}
  hfuse:
    - name: Вывод RESET (RSTDISBL)
      mask: 0x80
      values: {0x00: "отключён — программирование по ISP невозможно", 0x80: "работает как сброс"}
      status: {0x00: warn}
    - name: debugWIRE (DWEN)
      mask: 0x40
      values: {0x00: "включён — ISP не работает, пока его не выключить", 0x40: выключен}
      status: {0x00: warn}
    - name: Программирование по SPI/ISP (SPIEN)
      mask: 0x20
      values: {0x00: разрешено, 0x20: запрещено}
    - name: Сторожевой таймер (WDTON)
      mask: 0x10
      values: {0x00: "включён всегда", 0x10: "управляется программой"}
    - name: Сохранение EEPROM при стирании (EESAVE)
      mask: 0x08
      values: {0x00: "EEPROM сохраняется", 0x08: "EEPROM стирается (Дирижёр всё равно копирует её в образ)"}
    - name: Размер загрузчика (BOOTSZ)
      mask: 0x06
      values: {0x06: 256 слов (512 байт), 0x04: 512 слов (1 КБ), 0x02: 1024 слова (2 КБ), 0x00: 2048 слов (4 КБ)}
    - name: Старт после сброса (BOOTRST)
      mask: 0x01
      values: {0x00: с загрузчика, 0x01: с адреса 0}
  efuse:
    - name: Контроль питания (BOD)
      mask: 0x07
      values: {0x07: выключен, 0x06: "1,8 В", 0x05: "2,7 В", 0x04: "4,3 В"}
  lock:
    - name: Защита памяти (LB)
      mask: 0x03
      values:
        0x03: нет защиты
        0x02: запрещена запись по ISP (снимается только стиранием всего чипа)
        0x00: запрещены запись и чтение — копия «до» будет недостоверной
      status: {0x02: warn, 0x00: block}
      why: Дирижёр защиту не снимает (стирание всего чипа уничтожит прошивку).
    - name: Защита загрузчика (BLB1)
      mask: 0x30
      values: {0x30: нет, 0x20: "программа не может писать в загрузчик", 0x00: "загрузчик закрыт для записи и чтения программой", 0x10: "загрузчик закрыт для чтения программой"}

preserve:              # EEPROM — настройки и калибровки конкретного устройства
  - offset: 0x8000
    length: 0x400
    why: EEPROM (настройки, калибровки, счётчики устройства)

checks:
  - stable_read
  - not_zero
  - not_blank
  - size_matches
  - compare_reference

recipes:
  - id: restore_reference
    title: Записать эталонную прошивку (EEPROM этого устройства сохраняется)
    action: write_reference
  - id: restore_image
    title: Записать официальный образ (--image, образ flash+eeprom 33792 байта)
    action: write_image

notes: |
  При записи flash avrdude стирает весь чип, включая EEPROM, — поэтому EEPROM входит в образ
  и восстанавливается той же командой. Если EEPROM на чипе пустая (0xFF), она будет взята из
  источника — система предупредит. Фьюзы не трогаются.
  ATmega328 (без P) имеет подпись 1E9514 — для него нужен отдельный профиль.
