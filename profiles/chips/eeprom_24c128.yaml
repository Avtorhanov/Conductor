# Создан по общему образцу eeprom_24c02 (0.7.0, S5): отличаются модель, объём и страница.
id: eeprom_24c128
name: I2C EEPROM 24C128 (16 КБ)
class: memory.i2c_eeprom
match:
  name: ["24C128", "AT24C128", "24LC128", "24LC128B", "24AA128", "M24C128", "BR24C128", "CAT24C128", "FM24C128"]
priority: 10
voltage: null          # зависит от производителя (1.7–5.5 / 2.5–5.5 В) — подтвердите
size: 16384
allow_write: true

tool:                  # у 24Cxx нет ID: модель выбирается перед сеансом
  bp5_i2c: {eeprom: 24C128}
  pi_i2c: {eeprom: 24C128}
  minipro: {device: AT24C128}   # ПРОВЕРИТЬ НА ЖЕЛЕЗЕ: имя в `minipro -L 24C128` вашей версии

checks:
  - stable_read
  - not_zero
  - size_matches
  - compare_reference

recipes:
  - id: restore_reference
    title: Записать эталонное содержимое
    action: write_reference
  - id: restore_image
    title: Записать образ (--image, 16384 байт)
    action: write_image

notes: |
  Адрес по умолчанию 0x50 (A0–A2 на GND); два байта адреса памяти.
  Страница записи у распространённых производителей — 64 байт и больше; pi_i2c пишет по 64.
  При записи вывод WP (7) — на GND.
