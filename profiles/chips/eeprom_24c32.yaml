# Создан по общему образцу eeprom_24c02 (0.7.0, S5): отличаются модель, объём и страница.
id: eeprom_24c32
name: I2C EEPROM 24C32 (4 КБ)
class: memory.i2c_eeprom
match:
  name: ["24C32", "AT24C32", "24LC32", "24LC32B", "24AA32", "M24C32", "BR24C32", "CAT24C32", "FM24C32"]
priority: 10
voltage: null          # зависит от производителя (1.7–5.5 / 2.5–5.5 В) — подтвердите
size: 4096
allow_write: true

tool:                  # у 24Cxx нет ID: модель выбирается перед сеансом
  bp5_i2c: {eeprom: 24C32}
  pi_i2c: {eeprom: 24C32}
  minipro: {device: AT24C32}   # ПРОВЕРИТЬ НА ЖЕЛЕЗЕ: имя в `minipro -L 24C32` вашей версии

checks:
  - stable_read
  - not_zero
  - size_matches
  - compare_reference

recipes:
  - id: restore_reference
    title: Записать эталонное содержимое
    action: write_reference
  - id: restore_image
    title: Записать образ (--image, 4096 байт)
    action: write_image

notes: |
  Адрес по умолчанию 0x50 (A0–A2 на GND); два байта адреса памяти.
  Страница записи у распространённых производителей — 32 байт и больше; pi_i2c пишет по 32.
  При записи вывод WP (7) — на GND.
