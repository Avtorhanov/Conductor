# Создан по общему образцу eeprom_24c02 (0.7.0, S5): отличаются модель, объём и страница.
id: eeprom_24c08
name: I2C EEPROM 24C08 (1 КБ)
class: memory.i2c_eeprom
match:
  name: ["24C08", "AT24C08", "24LC08", "24LC08B", "24AA08", "M24C08", "BR24C08", "CAT24C08", "FM24C08"]
priority: 10
voltage: null          # зависит от производителя (1.7–5.5 / 2.5–5.5 В) — подтвердите
size: 1024
allow_write: true

tool:                  # у 24Cxx нет ID: модель выбирается перед сеансом
  bp5_i2c: {eeprom: 24C08}
  pi_i2c: {eeprom: 24C08}
  minipro: {device: AT24C08}   # ПРОВЕРИТЬ НА ЖЕЛЕЗЕ: имя в `minipro -L 24C08` вашей версии

checks:
  - stable_read
  - not_zero
  - size_matches
  - compare_reference

recipes:
  - id: restore_reference
    title: Записать эталонное содержимое
    action: write_reference
  - id: restore_image
    title: Записать образ (--image, 1024 байт)
    action: write_image

notes: |
  Занимает 4 адреса на шине (0x50–0x53): выводы A0–A1 не используются.
  Страница записи у распространённых производителей — 16 байт и больше; pi_i2c пишет по 16.
  При записи вывод WP (7) — на GND.
