# Создан по общему образцу eeprom_24c02 (0.7.0, S5): отличаются модель, объём и страница.
id: eeprom_24c512
name: I2C EEPROM 24C512 (64 КБ)
class: memory.i2c_eeprom
match:
  name: ["24C512", "AT24C512", "24LC512", "24LC512B", "24AA512", "M24C512", "BR24C512", "CAT24C512", "FM24C512"]
priority: 10
voltage: null          # зависит от производителя (1.7–5.5 / 2.5–5.5 В) — подтвердите
size: 65536
allow_write: true

tool:                  # у 24Cxx нет ID: модель выбирается перед сеансом
  bp5_i2c: {eeprom: 24C512}
  pi_i2c: {eeprom: 24C512}
  minipro: {device: AT24C512}   # ПРОВЕРИТЬ НА ЖЕЛЕЗЕ: имя в `minipro -L 24C512` вашей версии

checks:
  - stable_read
  - not_zero
  - size_matches
  - compare_reference

recipes:
  - id: restore_reference
    title: Записать эталонное содержимое
    action: write_reference
  - id: restore_image
    title: Записать образ (--image, 65536 байт)
    action: write_image

notes: |
  Адрес по умолчанию 0x50 (A0–A2 на GND); два байта адреса памяти.
  Страница записи у распространённых производителей — 128 байт и больше; pi_i2c пишет по 128.
  При записи вывод WP (7) — на GND.
