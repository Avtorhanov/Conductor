# Профиль ПЛАТЫ (пример для симулятора).
# Уточняет профиль чипа: узнаётся по содержимому дампа (content_match)
# и знает уникальные области платы (preserve), которые нельзя затирать при ремонте.

id: example_sim_board
name: Учебная плата (симулятор) на W25Q64
class: memory.spi_nor
match:
  jedec_id: "EF4017"            # тот же чип, что в профиле winbond_w25q64
content_match:
  - offset: 0x0
    hex: "4657494D"             # "FWIM" — заголовок прошивки этой платы
priority: 20
voltage: 3.3
size: 8388608
allow_write: true

preserve:                       # уникальное для каждой платы: берётся с текущего чипа
  - offset: 0x7FF000
    length: 0x1000
    why: MAC-адрес и серийный номер платы

# Карта разделов (core/layout.py): из чего состоит образ. Сравнение с эталоном называет разделы,
# рецепт restore_regions берёт из эталона только испорченные разделы с restore: true.
layout:
  - id: header
    title: Заголовок прошивки
    offset: 0x0
    length: 0x1000
    kind: boot
    help: Подпись FWIM, версия формата, длина и CRC прошивки. Пустой — плата не запустится.
  - id: firmware
    title: Прошивка
    offset: 0x1000
    length: 0x300000
    kind: data
  - id: free
    title: Свободное место
    offset: 0x301000
    end: 0x7FE000
    kind: free
  - id: settings
    title: Параметры
    offset: 0x7FE000
    length: 0x1000
    kind: config                # restore: false по умолчанию — настройки этой платы, а не эталона
  - id: unique
    title: MAC и серийник
    offset: 0x7FF000
    length: 0x1000
    kind: unique                # preserve: true по умолчанию

# Карта параметров (учебная): что можно прочитать и изменить сценарием «Настройка».
params:
  - id: fw_format
    title: Версия формата прошивки
    offset: 0x4
    type: u16le
    writable: false
  - id: boot_delay
    title: Задержка загрузки
    offset: 0x7FE000
    type: u8
    unit: с
    min: 0
    max: 30
    help: Учебный параметр. 255 — не задано (стёртая память).
  - id: region
    title: Регион радио
    offset: 0x7FE001
    type: u8
    choices: {0: EU, 1: US, 2: JP, 255: "не задан"}

checks:
  - stable_read
  - not_zero
  - not_blank
  - size_matches
  - compare_reference
  - binwalk
  - layout

recipes:
  - id: restore_reference
    title: Записать эталонную прошивку (MAC и серийник сохраняются)
    action: write_reference
  - id: restore_regions
    title: Восстановить из эталона только испорченные разделы (параметры, MAC и серийник — свои)
    action: write_reference_regions
  - id: restore_image
    title: Записать официальный образ (--image)
    action: write_image

notes: |
  Учебный профиль. Для настоящей платы сделайте такой же: сигнатура из её
  исправного дампа + области с MAC/серийником/калибровками.
