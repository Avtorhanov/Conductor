# Карточку приносит навык modbus_rtu: так любой навык может добавить свой движок или переходник.
id: modbus_rtu
kind: engine
title: Modbus RTU (помощник Дирижёра)
tagline: Настройки приборов по RS-485 — термопреобразователи, регуляторы, счётчики
group: tool
icon: wave
since: "1979"
lang: Python (stdlib)
license: свой код Дирижёра; протокол Modbus — открытая спецификация
authors:
  - name: Modicon
    role: протокол Modbus опубликован в 1979 году
  - name: Modbus Organization
    role: развивает открытую спецификацию
  - name: Дирижёр
    role: помощник rtu.py — функции 3, 4, 6, 16, CRC, повторы, эхо
links:
  - {title: Спецификация Modbus, url: "https://modbus.org"}
what: >-
  Протокол, на котором промышленные приборы отдают и принимают свои настройки. Каждая настройка — регистр
  с номером из паспорта прибора.
strengths:
  - Понимают тысячи приборов разных производителей
  - "Два провода (A и B) на десятки и сотни метров, до 247 приборов на линии"
  - "Для Дирижёра настройки прибора — та же «память»: копия «до», сверка, откат, эталон"
how:
  - Запрос — адрес прибора, функция (3 — прочитать, 6/16 — записать), номер регистра, CRC
  - Прибор отвечает значениями; ошибка CRC или молчание — повтор
in_dirizher:
  - "Лезвие навыка modbus_rtu, помощник-процесс skills/modbus_rtu/rtu.py (без pyserial)"
  - Окно чтения — только регистры настроек (живые измерения ломают сверку и блокируют запись)
  - Запись — только изменившихся регистров, после слова «ДА»; адрес и скорость — только чтение
plugin: modbus_rtu
targets: [device.modbus]
adapters: [usb_rs485]
examples:
  - {title: Прочитать параметры, cmd: "python3 -m dirizher params"}
  - {title: Сменить верхнюю границу, cmd: "python3 -m dirizher tune --set range_high=600 --dry-run"}
verify:
  - Эхо вашего переходника, паузы между кадрами, поддержку функции 16 прибором
