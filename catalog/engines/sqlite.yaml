what: >-
  База данных в одном файле. Ничего не нужно устанавливать и запускать отдельно — Python умеет с ней работать сам.
strengths:
  - Один файл data/memory.sqlite — легко скопировать на флешку
  - Надёжные транзакции — запись либо целиком, либо никак
  - Встроена в Python (модуль sqlite3)
how:
  - Данные хранятся в таблицах; изменения записываются транзакциями
in_dirizher:
  - "Таблицы sessions, events, snapshots, refs, recipe_stats, fixes"
  - "Самопроверка запускает PRAGMA integrity_check"
  - Сами дампы лежат не в базе, а файлами по SHA-256 — база хранит только ссылки
