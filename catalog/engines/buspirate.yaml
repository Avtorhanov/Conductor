id: buspirate
kind: engine
title: Прошивка Bus Pirate 5
tagline: Универсальный «переводчик» шин — I2C, SPI, UART — с терминалом и экраном
group: tool
level: 2
icon: board
since: "2024"
lang: C (RP2040)
license: MIT (прошивка), открытое железо
authors:
  - name: Ian Lesnet
    role: автор Bus Pirate (Dangerous Prototypes, Where Labs)
  - name: Sjaak (SMD Prutser)
    role: соавтор Bus Pirate 5
  - name: Сообщество Bus Pirate
    role: новые режимы прошивки
links:
  - {title: Прошивка и документация, url: "https://firmware.buspirate.com"}
  - {title: Исходный код прошивки, url: "https://github.com/DangerousPrototypes/BusPirate5-firmware"}
what: >-
  Bus Pirate 5 — прибор, внутри которого работает своя открытая программа. Ему пишут текстовые команды
  вида [0xA0 0x00] — и он выполняет их на шине I2C или SPI. Сам подаёт питание и включает подтяжки.
strengths:
  - Сам питает микросхему (регулируемо) и измеряет напряжения на выводах
  - Буферы выводов 1,2–5,5 В — безопасно для микросхем на разное напряжение
  - Экран сам подписывает, какой вывод что делает в текущем режиме
  - Прошивка обновляется за секунды и быстро развивается
how:
  - "m → I2C — выбор режима; W 3.3 — питание 3,3 В; P — подтяжки"
  - "[0xA0 0x00] — запись адреса; [0xA1 r:16] — чтение 16 байт"
  - "Ответы приходят строками TX:/RX: в терминал USB"
in_dirizher:
  - "Лезвие bp5_i2c: помощник-процесс helpers/bp5_i2c.py на стандартной библиотеке говорит с терминалом BP5"
  - "Чтение по 16 байт; запись — только изменившиеся куски по 8 байт, не пересекая границу страницы"
  - "У 24Cxx нет ID: модель из настроек, ответ по адресу (ACK) — уверенность 0,7"
  - "WP на питании — запись не пройдёт сверку, Дирижёр предложит вернуть копию «до»"
  - "Для диагностики: замер на VOUT после включения питания (если прошивка его показывает) — просевшее питание останавливает сеанс"
plugin: bp5_i2c
targets: [memory.i2c_eeprom]
adapters: [bus_pirate5]
lesson: tool_bp5
examples:
  - {title: Через Дирижёр, cmd: "python3 -m dirizher detect", note: "лезвие bp5_i2c включено в «Прибор» → «Инструменты» → «Настроить»"}
verify:
  - "Пункт I2C в меню m (ищется по тексту), вопросы после W 3.3, раскраска терминала"
  - Время чтения 24C256
