id: usb_rs485
kind: adapter
title: Переходник USB–RS-485
tagline: Для приборов Modbus RTU — термопреобразователей, регуляторов, счётчиков
group: buy
level: 4
icon: cable
voltage: "дифференциальная линия A/B (развязка — желательна)"
groups: [dialout]              # последовательный порт — группа dialout
engines: [modbus_rtu]
targets: [device.modbus]
what: >-
  Переводит USB в двухпроводную линию RS-485. Прибор питается сам; переходник только «разговаривает».
steps:
  - text: Подключите переходник и найдите порт; права — группа dialout.
    code: ls /dev/ttyUSB*
  - A → A, B → B (у некоторых производителей D+/D−). Не перепутаете — не страшно, просто не будет ответа.
  - Общий провод GND соедините, если у прибора есть такой вывод.
  - На длинной линии — резистор 120 Ом на концах линии (часто есть перемычка на переходнике).
  - "Скорость, чётность, адрес — как в меню прибора: skills/modbus_rtu/skill.yaml → settings."
check: "«Прочитать параметры» показывает значения как на экране прибора."
drawings:
  - type: wiring
    title: Провода
    a_title: USB–RS-485
    b_title: Прибор
    wires:
      - {a: A (D+), b: A, color: yellow}
      - {a: B (D−), b: B, color: blue}
      - {a: GND, b: GND / COM, color: black, note: если есть}
  - type: chain
    steps: [Raspberry Pi, USB–RS-485, "линия A/B", Прибор 1, "… до 247 приборов"]
caution:
  - "Некоторые переходники возвращают свои же байты (эхо) — тогда echo: true в настройках навыка"
  - Адрес и скорость прибора Дирижёр не меняет — после смены сверка по старому адресу невозможна
verify:
  - Эхо вашего переходника; паузы между кадрами на вашей скорости
