id: soic8_socket
kind: adapter
title: Переходник SOIC-8 → DIP-8
tagline: Для выпаянной микросхемы — вставить в панель CH341A или T48
group: buy
icon: socket
engines: [flashrom, minipro]
targets: [memory.spi_nor, memory.i2c_eeprom]
what: >-
  Плата-переходник, на которую кладётся выпаянная микросхема SOIC-8 (или панель с откидной крышкой).
  Снизу — ножки DIP-8 для панели ZIF.
steps:
  - Выпаяйте микросхему феном или паяльником с медной оплёткой; дайте остыть.
  - Положите чип на переходник — точка (вывод 1) к отметке 1 на переходнике.
  - Вставьте переходник в панель программатора по рисунку для этой микросхемы, зажмите рычаг.
check: Чтение стабильное (две копии совпадают) — значит, контакт хороший.
drawings:
  - type: package
    title: "DIP-8 снизу переходника — вид сверху"
    style: dip
    pins: ["1", "2", "3", "4", "5", "6", "7", "8"]
    mark: {"1": red}
caution:
  - Перепаивание нагревает чип — не перегревайте и не держите долго
verify:
  - Ширину корпуса (150 или 208 mil) — переходник должен ей соответствовать
