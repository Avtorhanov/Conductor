id: adapter_18v
kind: adapter
title: Переходник 1,8 В для 25xx
tagline: Для флешек на 1,8 В (25U…, W25Q…FW/JW) — понижает питание и уровни сигналов
group: buy
level: 2
icon: socket
voltage: "1,8 В"
engines: [flashrom]
needs: [ch341a, soic8_clip]
targets: [memory.spi_nor]
lesson: voltage
what: >-
  Плата-вставка между CH341A и микросхемой: стабилизатор 1,8 В и преобразователь уровней. Без неё
  3,3 В от программатора могут повредить чип на 1,8 В.
steps:
  - Определите напряжение чипа по маркировке и даташиту — Дирижёр сам остановит работу, если профиль говорит 1,8 В.
  - Вставьте переходник в панель CH341A по отметке, прищепку — в переходник.
  - text: Скажите Дирижёру, что адаптер теперь на 1,8 В (только у лезвия flashrom_spi).
    code: |
      plugins:
        flashrom_spi:
          programmer_voltage: 1.8
  - Верните 3.3, когда снова работаете с обычными чипами.
check: "Шаг «Совместимость по напряжению» — «чип 1.8 В, адаптер 1.8 В»."
drawings:
  - type: chain
    title: Что к чему
    steps:
      - {title: CH341A, sub: "3,3 В"}
      - {title: Переходник, sub: "1,8 В"}
      - {title: Прищепка}
      - {title: Чип 1,8 В}
caution:
  - Дешёвые переходники иногда делят уровни только резисторами — проверьте напряжение на выводах
verify:
  - Напряжение на VCC и на линиях данных переходника (должно быть около 1,8 В)
