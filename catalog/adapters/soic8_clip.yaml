id: soic8_clip
kind: adapter
title: Прищепка SOIC-8 с кабелем
tagline: Подключиться к флешке или EEPROM прямо на плате, без пайки
group: buy
level: 1
icon: clip
engines: [flashrom, buspirate, minipro]
needs: []
targets: [memory.spi_nor, memory.i2c_eeprom]
what: >-
  Зажим с подпружиненными контактами под корпус SOIC-8 и шлейф к программатору. Красный провод шлейфа —
  вывод 1.
steps:
  - Обесточьте устройство. Найдите на корпусе микросхемы точку или скос — это вывод 1.
  - Красный провод прищепки — к выводу 1. Наденьте ровно, все 8 контактов на ножках.
  - Покачайте прищепку — она не должна соскальзывать. Окислы на ножках снимите спиртом.
  - text: Запустите опознание — без записи.
    code: python3 -m dirizher detect
check: "Опознание находит чип, а две копии «до» совпадают. Не совпадают — переставьте прищепку."
drawings:
  - type: package
    title: "SOIC-8 сверху: точка — вывод 1, красный провод сюда"
    style: soic
    pins: ["1", "2", "3", "4", "5", "6", "7", "8"]
    mark: {"1": red}
caution:
  - "Программатор питает через VCC всю плату: процессор оживает и мешает. Признак — разные чтения. Держите процессор в сбросе или выпаяйте чип"
  - Перекос прищепки замыкает соседние ножки
verify:
  - Шаг выводов прищепки под ваш корпус (SOIC-8 узкий 150 mil или широкий 208 mil)
