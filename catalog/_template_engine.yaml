# ШАБЛОН КАРТОЧКИ ДВИЖКА (внешняя программа с открытым кодом). Файлы на «_» не загружаются.
# Новая карточка: «Справочник» → «+ Карточка» (конструктор) или скопируйте этот файл в catalog/engines/<id>.yaml.
# Пишите коротко: одна мысль — один пункт. Всё, что не проверено на железе, — в verify.

id: my_engine                 # латиница, цифры, _ (как имя файла)
kind: engine
title: "Название программы"
tagline: "Одна строка: что делает и с чем"
group: tool                   # tool — инструмент; base — основа, на которой стоит Дирижёр
# level: 2                    # ступень сложности 1–5: 1 первая флешка, 2 другие напряжения и шины,
                              # 3 микроконтроллеры, 4 приборы и замеры, 5 под капотом (пусто — по targets)
icon: code                    # chip usb clip board probe cable socket scope code db wave plug
since: "2010"                 # с какого года проект (если известно)
lang: C                       # на чём написан
license: GPL-2.0              # как в файле LICENSE проекта
authors:                      # кто создал и кто ведёт — обязательно
  - name: Имя Фамилия
    role: автор первой версии
  - name: Сообщество проекта
    role: сопровождение
links:
  - {title: Сайт проекта, url: "https://example.org"}

what: >-
  Простое объяснение в 1–2 предложениях: что это и зачем человеку.
strengths:                    # почему именно эта программа
  - Сильная сторона 1
  - Сильная сторона 2
how:                          # принцип действия самой программы, по шагам
  - Шаг 1
  - text: Шаг 2 с командой
    code: my-tool --identify
in_dirizher:                  # как работает внутри Дирижёра (лезвие, защита, что запрещено)
  - "Лезвие my_tool: probe() только читает идентификатор"
plugin: my_tool               # имя лезвия (если есть) — по нему виден статус «включено / выключено»
program: my-tool              # имя программы в PATH — по нему виден статус «установлена»
targets: [memory.spi_nor]     # с чем работает (список в справке «Справочник»)
adapters: [ch341a]            # какие переходники нужны (id их карточек)
install: sudo apt install my-tool
examples:
  - {title: Опознать, cmd: "my-tool --identify", note: только чтение}
lesson: first_chip            # урок Штурмана по теме (необязательно)
drawings:                     # рисунки (необязательно); см. шаблон переходника
  - type: chain
    title: Как устроено в Дирижёре
    steps: [Дирижёр, "лезвие my_tool", my-tool, переходник, микросхема]
caution:
  - Что может пойти не так и как этого избежать
verify:                       # ПРОВЕРИТЬ НА ЖЕЛЕЗЕ
  - Формат вывода программы на вашей версии
