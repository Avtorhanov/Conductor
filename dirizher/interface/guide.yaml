# ШТУРМАН «Дирижёра»: вопросы, варианты ответов и уроки.
# Один файл для всех экранов: браузер (ПК, телефон, экран прибора) и текстовый мастер.
#
# Как устроено:
#   nodes   — вопросы. У вопроса есть ask (вопрос), say (пояснение) и options (варианты).
#   options — вариант ведёт ровно в одно место:
#               next: <вопрос>      — следующий вопрос
#               action: <действие>  — выполнить (+ params)
#               lesson: <урок>      — открыть объяснение с примерами
#   lessons — уроки: title, why (зачем), steps (шаги: text + необязательный code),
#             check (как проверить), related (куда дальше), group: work | dev.
#
# Действия: run (dry_run, label, image), detect, rollback (dry_run), feedback,
#   reference (label), export, sim (do: status|reset|corrupt|erase|flaky|steady),
#   history, plugins, profiles, roadmap, builder, capture (scan: true — найти анализатор),
#   params (прочитать параметры прибора), tune (set: {параметр: значение}), tune_form,
#   skills (вкладка «Навыки»), help (article: имя статьи), hood (area: guide|work|log|dev|device|help),
#   doctor (самопроверка), fix (что помогло), catalog (card, kind),
#   playground (track: id маршрута из playground.yaml — учебная площадка).
#   Значение «ask» в params — спросить у человека (метку или файл образа).
#   Для rollback, feedback, reference, export сеанс выбирается из журнала.
#
# После правки проверьте:  python3 -m unittest tests.test_interface -v

version: 1
start: home

nodes:
  home:
    ask: Что будем делать?
    say: Выберите цель — дальше Дирижёр сам подскажет шаги. На микросхему ничего не запишется без вашего слова «ДА».
    options:
      - icon: "🔧"
        label: Починить устройство
        explain: не включается, зависает, сбой после обновления
        next: repair
      - icon: "💾"
        label: Снять копию с исправного устройства
        explain: эталон — по нему потом чинят такие же устройства
        next: backup_good
      - icon: "🔍"
        label: Узнать, что за микросхема
        explain: только чтение идентификатора, ничего не меняется
        action: detect
      - icon: "🎛"
        label: Настроить прибор
        explain: диапазон, уставка, единицы — по карте параметров
        next: tune
      - icon: "↩️"
        label: Вернуть как было
        explain: записать обратно копию «до» из прошлого сеанса
        action: rollback
      - icon: "✅"
        label: Сообщить, помог ли ремонт
        explain: отзыв учит Дирижёр — удачные способы предлагаются первыми
        action: feedback
      - icon: "📦"
        label: Забрать дамп файлом
        explain: скачать копию «до» или «после» на телефон или ПК
        action: export
      - icon: "🔌"
        label: Подключить инструмент
        explain: Bus Pirate 5, ST-Link, T48, USBasp, ESP, логический анализатор
        next: tools
      - icon: "🧰"
        label: "Справочник: что купить или собрать"
        explain: переходники с рисунками подключения, движки и их авторы
        action: catalog
      - icon: "🎓"
        label: Потренироваться без железа
        explain: виртуальная микросхема с учебными поломками
        next: sim
      - icon: "🧭"
        label: "Учебная площадка: ноутбук, ТВ, телефон, машина"
        explain: пошаговый тренажёр с вопросами — что и как можно сделать тем, что есть дома
        action: playground
      - icon: "🛠"
        label: Развивать Дирижёр
        explain: навыки, капот, профили, проверки — с примерами
        next: develop
      - icon: "❓"
        label: Что-то не получается
        explain: частые проблемы и как их решить
        next: trouble

  tune:
    ask: Настройка прибора
    say: Параметры читаются и меняются по карте из профиля. Перед записью — копия текущих настроек, после — сверка. Значения сверяйте с паспортом прибора.
    options:
      - label: Прочитать параметры
        explain: только чтение — сверьте значения с экраном прибора
        action: params
      - label: Изменить параметры
        explain: по последнему чтению; запись после слова «ДА»
        action: tune_form
      - label: "Пример: сменить диапазон термодатчика"
        explain: Modbus RTU по RS-485 — по шагам
        action: help
        params: {article: example_thermo}
      - label: Прибора нет в списке — добавить карту или протокол
        explain: Навыки → + (карта параметров без кода или новое лезвие)
        action: skills
      - label: Вернуть прежние настройки
        action: rollback

  repair:
    ask: Что есть для ремонта?
    say: Чинят двумя способами — записывают эталон (дамп с такого же исправного устройства) или полный образ прошивки. Копия «до» снимается всегда.
    options:
      - label: Эталон уже снят
        explain: такое же устройство уже чинили или копировали
        next: repair_mode
      - label: Есть файл — полный образ всей микросхемы
        next: repair_image
      - label: Ничего нет или не знаю
        explain: сделаем копию и диагностику без записи — станет понятно, что дальше
        action: run
        params: {dry_run: true}
      - label: Почему копия «до» так важна?
        lesson: safety

  repair_mode:
    ask: Как действовать?
    options:
      - label: Сначала показать план, ничего не записывая
        explain: рекомендуется — копия, диагностика и план ремонта
        action: run
        params: {dry_run: true}
      - label: Чинить
        explain: запись только после вашего слова «ДА»
        action: run

  repair_image:
    ask: Ремонт по образу прошивки
    say: Нужен полный образ ВСЕЙ микросхемы. Файл обновления с сайта производителя часто не подходит — размер другой, и Дирижёр заблокирует запись.
    options:
      - label: Показать план с этим образом (без записи)
        action: run
        params: {dry_run: true, image: ask}
      - label: Чинить этим образом
        action: run
        params: {image: ask}
      - label: Чем образ отличается от файла обновления?
        lesson: full_image

  backup_good:
    ask: Снимем эталон
    say: Дирижёр прочитает микросхему дважды, сверит чтения и спросит, исправно ли устройство. Если да — дамп станет эталоном. На чип ничего не записывается.
    options:
      - label: Начать — назову устройство
        explain: метка вроде «роутер-X1-rev2» помогает различать эталоны
        action: run
        params: {dry_run: true, label: ask}
      - label: Начать без метки
        action: run
        params: {dry_run: true}
      - label: Что такое эталон?
        lesson: reference

  sim:
    mode: sim
    ask: Учебный режим
    say: Виртуальная микросхема W25Q64 (8 МБ). Настоящее железо не используется, учебные копии хранятся отдельно. Устройте поломку — и почините её.
    options:
      - label: Учебный ремонт по шагам
        explain: начните отсюда
        lesson: sim_tour
      - label: "Тренажёр: как думает Дирижёр"
        explain: 7 шагов, копии, эталон, «ДА» — с вопросами и протоколами ядра
        action: playground
        params: {track: start}
      - label: Исправная прошивка
        explain: начать с чистого листа
        action: sim
        params: {do: reset}
      - label: Сбой обновления
        explain: стёрто 16 секторов и испорчены байты
        action: sim
        params: {do: corrupt}
      - label: Стёртый чип
        action: sim
        params: {do: erase}
      - label: Плохой контакт прищепки
        explain: чтения начнут различаться — запись заблокируется
        action: sim
        params: {do: flaky}
      - label: Контакт снова хороший
        action: sim
        params: {do: steady}
      - label: Что сейчас на виртуальной флешке?
        action: sim
        params: {do: status}
      - label: Починить
        next: repair

  tools:
    ask: Что подключаете?
    say: Каждый инструмент — отдельное «лезвие». Новые выключены, пока вы не включите их — «Прибор» → «Инструменты» → «Настроить» (или в config.yaml). Порядок первого раза везде один — опознание, план без записи, эталон с исправного устройства.
    options:
      - label: Какой переходник нужен — карточки с рисунками
        explain: что купить, как подключить, какие выводы куда
        action: catalog
        params: {kind: adapter}
      - label: Собрать переходник самому
        explain: SPI самого Raspberry Pi, Pico как отладчик, Arduino как программатор
        action: catalog
        params: {kind: diy}
      - label: SPI-флешка 25xx (роутеры, ТВ, материнские платы)
        explain: CH341A или SPI самого Raspberry Pi — flashrom
        lesson: first_chip
      - label: EEPROM 24Cxx через Bus Pirate 5
        explain: настройки, серийники, EDID — 256 байт … 64 КБ
        lesson: tool_bp5
      - label: Микроконтроллер ARM (STM32 и др.) — ST-Link
        explain: probe-rs или OpenOCD по SWD
        lesson: tool_arm
      - label: Микросхема в панельке — T48 / TL866II+
        explain: 24Cxx, 25xx, 93Cxx, 27/28/29/39
        lesson: tool_minipro
      - label: AVR (ATmega, Arduino) — USBasp
        explain: flash + EEPROM, фьюзы не трогаются
        lesson: tool_avr
      - label: ESP8266 / ESP32 — USB-UART
        explain: весь флеш модуля через esptool
        lesson: tool_esp
      - label: Логический анализатор — замер сигналов
        explain: "только приём — читает ли процессор флеш при включении"
        lesson: tool_sigrok
      - label: Что сейчас подключено и включено
        action: plugins

  develop:
    ask: Что развиваем?
    say: Правило слоёв — новый чип или плата = новый профиль (YAML), новый инструмент = навык или плагин. Ядро при этом не меняется.
    options:
      - icon: "🧠"
        label: Навыки — добавить и править
        explain: протокол, карта параметров, проверка — без правки ядра
        action: skills
      - icon: "⌨"
        label: Капот — код и настройки разделов
        explain: правка с проверкой, историей и откатом
        action: help
        params: {article: hood}
      - label: Самопроверка и самоисцеление
        explain: копии, память, профили, навыки — и починка
        action: doctor
      - icon: "🧭"
        label: Что делать дальше по плану
        explain: следующие шаги из docs/STATUS.md
        action: roadmap
      - icon: "🧩"
        label: Конструктор профиля чипа
        explain: заполните паспорт чипа — получите проверенный профиль
        action: builder
      - label: Новый чип — как это устроено
        lesson: dev_chip_profile
      - label: Новая плата (MAC, серийник)
        lesson: dev_board_profile
      - label: Новая проверка диагностики
        lesson: dev_check
      - label: Проверка структуры прошивки (binwalk)
        lesson: dev_binwalk_expect
      - label: Новый инструмент (плагин)
        lesson: dev_plugin
      - label: Тесты без железа
        lesson: dev_test
      - label: Свой вопрос или урок в Штурмане
        lesson: dev_guide
      - label: Как устроен Дирижёр
        lesson: dev_architecture
      - label: Сессия разработки с Claude
        lesson: dev_session

  trouble:
    ask: Что случилось?
    options:
      - label: Самопроверка — найти и починить
        explain: копии, память, профили, навыки, Штурман
        action: doctor
      - label: Не видит микросхему
        lesson: not_detected
      - label: Чтения не совпадают, запись заблокирована
        lesson: unstable_read
      - label: Остановилось из-за напряжения
        lesson: voltage
      - label: Записалось, но устройство не работает
        lesson: after_fail
      - label: Первый настоящий чип — с чего начать
        lesson: first_chip
      - label: Как подключить экран, телефон или ПК
        lesson: displays
      - label: Журнал прошлых сеансов
        action: history
      - label: Какие инструменты и профили подключены
        action: plugins
      - label: Какой инструмент нужен для моей микросхемы
        next: tools

lessons:
  # ───────────── инструменты 0.3.0 ─────────────
  tool_bp5:
    group: work
    title: EEPROM 24Cxx через Bus Pirate 5
    why: В маленьких EEPROM хранятся настройки, серийные номера, калибровки, EDID монитора. Испорченные байты — частая причина «кирпича».
    steps:
      - Подключите BP5 по USB — он появится как /dev/ttyACM0. Права — группа dialout (один раз, затем перелогиниться).
      - text: Прищепка или провода к микросхеме — SDA, SCL, GND и VCC от BP5. Вывод WP (7) на время записи — к GND.
        code: sudo usermod -aG dialout $USER
      - text: Включите лезвие — «Прибор» → «Инструменты» → bp5_i2c → «Настроить» (или в config.yaml, образец — docs/config-snippet-0.3.0.yaml). Модель — как на корпусе.
        code: |
          plugins:
            bp5_i2c:
              enabled: true
              port: "/dev/ttyACM0"
              eeprom: "24C02"
              psu_voltage: 3.3      # BP5 питает чип; 0 — питание от платы
      - text: «Узнать, что за микросхема». У 24Cxx нет ID — Дирижёр проверит, что микросхема отвечает по адресу 0x50, а модель возьмёт из настроек.
        code: python3 -m dirizher detect
      - Затем «Снять копию с исправного устройства». Формат ответов BP5 проверен только на эмуляторе (ПРОВЕРИТЬ НА ЖЕЛЕЗЕ).
    check: Журнал сеанса — строки помощника bp5_i2c (FOUND, READ 256). Если микросхема молчит — проверьте подтяжки и питание.
    related:
      - label: Настроить bp5_i2c (форма, без правки config.yaml)
        action: tool
        params: {name: bp5_i2c}
      - label: "Схема подключения Bus Pirate 5"
        action: catalog
        params: {card: bus_pirate5}
      - label: Узнать, что за микросхема
        action: detect
      - label: Все карточки инструментов
        lesson: tool_cards

  tool_arm:
    group: work
    title: Микроконтроллер ARM через ST-Link (probe-rs или OpenOCD)
    why: Прошивка многих устройств живёт прямо во флеше микроконтроллера (STM32, GD32, nRF). Её читают и пишут по SWD.
    steps:
      - Провода SWD — SWDIO, SWCLK, GND и (по возможности) NRST. Плата питается сама; ST-Link должен «видеть» её напряжение.
      - text: Поставьте probe-rs (основной путь) или OpenOCD (запасной).
        code: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/probe-rs/probe-rs/releases/latest/download/probe-rs-tools-installer.sh | sh
          sudo apt install openocd        # запасной путь
      - text: Модель МК по SWD надёжно не узнать — укажите её сами. Не включайте probe_rs и openocd одновременно.
        code: |
          plugins:
            probe_rs:
              enabled: true
              chip: "STM32F103C8"
              flash_base: 0x08000000
              flash_size: 65536
      - Если чтение не проходит из-за защиты (RDP) — Дирижёр её не снимает. Снятие стирает прошивку, а обход защит — вне задач проекта.
    check: «Узнать, что за микросхема» → «модель из настроек, Cortex-M3». Форматы вывода — ПРОВЕРИТЬ НА ЖЕЛЕЗЕ.
    related:
      - label: Настроить probe_rs (форма, без правки config.yaml)
        action: tool
        params: {name: probe_rs}
      - label: Настроить openocd (форма, без правки config.yaml)
        action: tool
        params: {name: openocd}
      - label: "Схема подключения ST-Link"
        action: catalog
        params: {card: st_link_v2}
      - label: "Отладчик из Raspberry Pi Pico"
        action: catalog
        params: {card: pico_probe}
      - label: Узнать, что за микросхема
        action: detect
      - label: Все карточки инструментов
        lesson: tool_cards

  tool_minipro:
    group: work
    title: Микросхема в панельке — T48 / TL866II+
    why: Выпаянные микросхемы удобно читать программатором с панелькой — он сам подаёт нужные напряжения.
    steps:
      - text: Соберите minipro (один раз) и поставьте правила udev.
        code: |
          sudo apt install build-essential pkg-config libusb-1.0-0-dev git
          git clone https://gitlab.com/DavidGriffith/minipro.git && cd minipro && make && sudo make install
          sudo cp system/99-dirizher-tools.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules
      - text: Точное имя микросхемы — из списка minipro.
        code: minipro -L W25Q64
      - text: Впишите его — «Прибор» → «Инструменты» → minipro → «Настроить» (или в config.yaml). Класс (SPI, I2C, параллельная) Дирижёр определит по имени.
        code: |
          plugins:
            minipro:
              enabled: true
              device: "W25Q64BV"
      - Микроконтроллеры через minipro Дирижёр не обслуживает — стирание заденет EEPROM и фьюзы.
    check: «Узнать, что за микросхема» → ID из панельки. Текст minipro — ПРОВЕРИТЬ НА ЖЕЛЕЗЕ.
    related:
      - label: Настроить minipro (форма, без правки config.yaml)
        action: tool
        params: {name: minipro}
      - label: "Карточка T48 / TL866II+"
        action: catalog
        params: {card: t48}
      - label: Узнать, что за микросхема
        action: detect
      - label: Все карточки инструментов
        lesson: tool_cards

  tool_avr:
    group: work
    title: AVR (ATmega, Arduino) через USBasp
    why: При записи flash avrdude стирает весь чип вместе с EEPROM. Поэтому Дирижёр копирует и восстанавливает flash и EEPROM вместе, а фьюзы не трогает никогда.
    steps:
      - text: Поставьте avrdude, подключите USBasp к разъёму ISP (6 или 10 выводов).
        code: sudo apt install avrdude
      - text: USBasp обычно работает на 5 В — укажите это, Дирижёр сверит с платой.
        code: |
          plugins:
            avrdude:
              enabled: true
              programmer: "usbasp"
              part: "m328p"
              programmer_voltage: 5.0
              memories: [flash, eeprom]
              flash_size: 32768
              eeprom_size: 1024
      - Подпись 0x000000 или 0xFFFFFF — нет связи — проверьте RESET, питание и кварц; попробуйте bitclock 10.
    check: «Узнать, что за микросхема» → «подпись 0x1E950F». Строку avrdude — ПРОВЕРИТЬ НА ЖЕЛЕЗЕ.
    related:
      - label: Настроить avrdude (форма, без правки config.yaml)
        action: tool
        params: {name: avrdude}
      - label: "Схема подключения USBasp"
        action: catalog
        params: {card: usbasp}
      - label: "Arduino как программатор"
        action: catalog
        params: {card: arduino_isp}
      - label: Узнать, что за микросхема
        action: detect
      - label: Все карточки инструментов
        lesson: tool_cards

  tool_esp:
    group: work
    title: ESP8266 / ESP32 через USB-UART
    why: Весь флеш модуля можно сохранить и вернуть через встроенный загрузчик ESP — без прищепки.
    steps:
      - text: Поставьте esptool.
        code: pipx install esptool
      - Переведите ESP в режим загрузчика — GPIO0 к GND при сбросе (на платах разработчика — кнопки BOOT и EN). Логика USB-UART — только 3.3 В.
      - text: Включите лезвие.
        code: |
          plugins:
            esptool:
              enabled: true
              port: "/dev/ttyUSB0"
      - В отпечаток входит MAC — откат возможен только на ту же плату. При шифровании флеша эталон с другой платы не поможет.
    check: «Узнать, что за микросхема» → чип, MAC и размер флеша. Строки esptool — ПРОВЕРИТЬ НА ЖЕЛЕЗЕ.
    related:
      - label: Настроить esptool (форма, без правки config.yaml)
        action: tool
        params: {name: esptool}
      - label: "Схема подключения USB-UART"
        action: catalog
        params: {card: usb_uart}
      - label: Узнать, что за микросхема
        action: detect
      - label: Все карточки инструментов
        lesson: tool_cards

  tool_sigrok:
    group: work
    title: Замер логическим анализатором
    why: Прежде чем читать и писать, полезно увидеть, что происходит на шине. Например, читает ли процессор флеш при включении и где останавливается загрузка. Анализатор только слушает — в устройство ничего не пишется.
    steps:
      - text: Поставьте sigrok-cli и подключите анализатор (дешёвые — на чипе CY7C68013A, драйвер fx2lafw).
        code: sudo apt install sigrok-cli
      - Провода к CLK, MOSI, MISO, CS и обязательно GND. Входы дешёвых анализаторов — до 5 В.
      - text: Настройки — секция sigrok в config.yaml (необязательна).
        code: |
          sigrok:
            channels: "D0,D1,D2,D3"
            samplerate: "1m"
            time_ms: 2000
            decode: "spi:clk=D0:mosi=D1:miso=D2:cs=D3"
            annotation: "spi"
      - Нажмите «Записать сигналы» и включите устройство. Запись и расшифровка сохранятся в data/captures/.
    check: В расшифровке SPI команды 03 или 0B — процессор читает флеш. Тишина — проблема раньше флеша (питание, кварц).
    related:
      - label: "Схема подключения анализатора"
        action: catalog
        params: {card: logic_analyzer}
      - label: Найти анализатор
        action: capture
        params: {scan: true}
      - label: Записать сигналы
        action: capture

  tool_cards:
    group: work
    title: Все инструменты — коротко
    why: Подробные карточки — docs/INTEGRATIONS.md. Здесь — что для чего.
    steps:
      - flashrom — SPI-флешки 25xx (CH341A, SPI Raspberry Pi).
      - Bus Pirate 5 — I2C EEPROM 24Cxx.
      - probe-rs / OpenOCD — микроконтроллеры ARM по SWD.
      - minipro — микросхемы в панельке T48 / TL866II+.
      - avrdude — AVR (flash + EEPROM).
      - esptool — ESP8266 / ESP32.
      - binwalk — проверка структуры прошивки в дампе.
      - sigrok-cli — замер сигналов (только приём).
      - text: Образец всех настроек — в одном файле.
        code: cat docs/config-snippet-0.3.0.yaml
    check: «Какие инструменты и профили подключены» — у включённых будет ✔.
    related:
      - label: Что сейчас подключено
        action: plugins

  dev_binwalk_expect:
    group: dev
    title: Проверка структуры прошивки (binwalk_expect)
    why: Повреждённая прошивка часто теряет узнаваемые части — заголовок загрузчика, файловую систему. Проверка найдёт это без эталона.
    steps:
      - text: Снимите копию с ИСПРАВНОГО устройства и посмотрите, что binwalk находит в дампе.
        code: |
          python3 -m dirizher export 3 --kind before --to good.bin
          binwalk good.bin
      - text: Впишите найденные названия в профиль чипа или платы.
        code: |
          checks:
            - type: binwalk_expect
              expect: ["uImage header", "Squashfs filesystem"]
      - Если в дампе неисправного устройства чего-то не хватает — проверка предложит восстановление из эталона или образа.
    check: python3 -m dirizher profiles — без ошибок; в диагностике появится строка binwalk_expect.
    related:
      - label: Конструктор профиля
        action: builder
  # ───────────── работа ─────────────
  safety:
    group: work
    title: Как Дирижёр бережёт прошивку
    why: Самая частая беда — записать не то и потерять единственную копию. Поэтому порядок всегда один — замер, чтение, запись.
    steps:
      - Перед любой записью снимается копия «до». Микросхема читается минимум два раза, чтения сверяются по SHA-256.
      - Запись начнётся, только если выполнены все 7 условий — копия подтверждена, нет блокирующих проблем, напряжение совместимо, размер образа равен размеру чипа, профиль разрешает запись, не включён пробный режим, и вы сами ввели слово «ДА».
      - После записи Дирижёр читает чип обратно, сверяет и сохраняет копию «после».
      - text: Не помогло — откат вернёт копию «до». Перед откатом тоже снимается копия, поэтому и откат можно отменить.
        code: python3 -m dirizher rollback 7
    check: Копии лежат в data/backups/ под именем = SHA-256 содержимого, только для чтения. Программа их никогда не удаляет.
    related:
      - label: Включить второе место для копий
        lesson: mirror

  mirror:
    group: work
    title: Зеркало копий — второе место хранения
    why: Флешка или карта памяти могут отказать. Зеркало дублирует каждую копию дампа в другое место.
    steps:
      - Подключите вторую флешку или SSD и узнайте путь к ней — например /media/pi/BACKUP.
      - text: Впишите путь в config.yaml.
        code: |
          mirror_dir: /media/pi/BACKUP/dirizher
      - text: Раз в неделю копируйте всю папку data/ целиком.
        code: rsync -a data/ /media/pi/BACKUP/data-copy/
    check: Если основная копия повредится, Дирижёр сам достанет её из зеркала — это проверяет автотест.

  reference:
    group: work
    title: Эталон — что это и зачем
    why: Эталон — дамп с исправного устройства. По нему Дирижёр находит повреждения и чинит такие же устройства.
    steps:
      - text: Подключите ИСПРАВНОЕ устройство и выберите «Снять копию с исправного устройства». Метка — модель и ревизия платы.
        code: python3 -m dirizher run --dry-run --label "роутер-X1-rev2"
      - На вопрос «Устройство сейчас исправно работает?» ответьте «да» — дамп станет эталоном.
      - При ремонте такого же устройства диагностика покажет, сколько секторов отличается, и предложит записать эталон.
      - Уникальные данные платы (MAC, серийный номер) берутся с ремонтируемого чипа — если их области описаны в профиле платы (preserve).
    check: Журнал → сеанс → строка «эталон … сохранён». Эталоны ищутся по ключу чипа (класс + JEDEC ID).
    related:
      - label: Снять эталон сейчас
        next: backup_good
      - label: Профиль платы — сохранить MAC и серийник
        lesson: dev_board_profile

  full_image:
    group: work
    title: Полный образ или файл обновления
    why: Записать можно только образ ВСЕЙ микросхемы — байт в байт её размера.
    steps:
      - Файл обновления с сайта производителя обычно содержит только часть разделов или свой заголовок. Его размер не равен размеру чипа — Дирижёр заблокирует запись.
      - text: Сравните размеры. Для чипа 8 МБ нужен файл ровно 8 388 608 байт.
        code: |
          ls -l firmware.bin      # должно быть 8388608
      - Полный образ берут с такого же исправного устройства (эталон) или от производителя, если он выкладывает именно полный дамп.
      - text: В браузере файл загружается кнопкой «Загрузить файл»; в терминале указывается путь.
        code: python3 -m dirizher run --dry-run --image ~/firmware_full.bin
    check: Сначала всегда «показать план» — там видно, сколько секторов изменится и что сохранится с чипа.

  sim_tour:
    group: work
    title: Учебный ремонт за 5 шагов
    why: Весь цикл без железа и без риска. Учебная память отдельная — с настоящей не смешается.
    steps:
      - text: «Исправная прошивка» — начать с чистого листа.
        code: python3 -m dirizher sim reset
      - text: «Починить» → «Ничего нет или не знаю». Дирижёр снимет копию и спросит, исправно ли устройство — ответьте «да». Это первый эталон.
        code: python3 -m dirizher --sim run --dry-run
      - text: «Сбой обновления» — испортим прошивку.
        code: python3 -m dirizher sim corrupt
      - text: «Починить» → «Эталон уже снят» → «Чинить». Введите ДА и посмотрите, как MAC и серийник сохранились с чипа.
        code: python3 -m dirizher --sim run
      - text: «Плохой контакт» — убедитесь, что запись блокируется. Потом «Контакт снова хороший».
        code: |
          python3 -m dirizher sim flaky
          python3 -m dirizher --sim run
          python3 -m dirizher sim steady
    check: «Журнал» покажет все учебные сеансы с итогами.
    related:
      - label: Шаг 1 — исправная прошивка
        action: sim
        params: {do: reset}
      - label: Шаг 2 — копия и эталон
        action: run
        params: {dry_run: true}
      - label: Шаг 3 — сбой обновления
        action: sim
        params: {do: corrupt}
      - label: Шаг 4 — починить
        action: run

  first_chip:
    group: work
    title: Первый настоящий чип
    why: Начните с донора — устройства, которое не жалко. Цель — проверить подключение и сохранить первый эталон.
    steps:
      - text: Установите flashrom и права на USB (один раз).
        code: |
          sudo apt install flashrom
          sudo cp system/99-dirizher.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -aG plugdev $USER     # затем перелогиньтесь
      - text: Проверьте, что программатор виден системе — у CH341A это 1a86:5512.
        code: lsusb
      - Обесточьте устройство и поставьте прищепку — красный провод к выводу 1 (точка или скос на корпусе).
      - text: «Узнать, что за микросхема». Если ID не распознался — откройте журнал сеанса, там полный вывод flashrom. Разбор вывода пока проверен только на подставной программе (ПРОВЕРИТЬ НА ЖЕЛЕЗЕ).
        code: python3 -m dirizher detect
      - text: «Снять копию с исправного устройства» — первый настоящий эталон.
        code: python3 -m dirizher run --dry-run --label "донор-1"
    check: Журнал → сеанс «опознание» → строка flashrom «Found … flash chip». Если она есть — подключение работает.
    related:
      - label: "Переходник: CH341A"
        action: catalog
        params: {card: ch341a}
      - label: "Без программатора: SPI самого Raspberry Pi"
        action: catalog
        params: {card: rpi_spi}
      - label: Узнать, что за микросхема
        action: detect

  not_detected:
    group: work
    title: Дирижёр не видит микросхему
    steps:
      - Прищепка — красный провод к выводу 1 (точка или скос на корпусе). Пошевелите её — все зубья должны касаться выводов.
      - text: Программатор виден системе?
        code: |
          lsusb    # CH341A = 1a86:5512
      - Нет прав на USB — нужно правило udev (урок «Первый настоящий чип») или разово sudo.
      - Чип на плате может питать через программатор всю схему, и процессор мешает. Держите процессор в сбросе или выпаяйте чип.
      - text: Установлен ли flashrom? Экран «Прибор» показывает состояние инструментов.
        code: python3 -m dirizher plugins
    check: После исправления — снова «Узнать, что за микросхема».
    related:
      - label: Попробовать снова
        action: detect

  unstable_read:
    group: work
    title: Чтения не совпадают
    why: Если два чтения дают разные данные — копии верить нельзя. Дирижёр блокирует запись, и это правильно.
    steps:
      - Переставьте прищепку, проверьте все 8 контактов.
      - Укоротите провода, уберите удлинители USB, подключите программатор прямо в порт.
      - Проверьте мультиметром питание 3.3 В на выводе 8 (VCC).
      - Чип на плате ловит помехи от самой платы. Надёжнее выпаять его и читать в панельке.
      - В учебном режиме это «Плохой контакт» — можно потренироваться.
    check: В диагностике должно появиться «повторные чтения совпали — контакт надёжный».

  voltage:
    group: work
    title: Остановилось из-за напряжения
    why: Чип на 1.8 В можно испортить адаптером на 3.3 В. Поэтому Дирижёр даже не читает, пока напряжения не совпадут.
    steps:
      - Найдите маркировку чипа и даташит. Серии W25Q…FW и …JW, MX25U, GD25LQ обычно на 1.8 В — сверьте по даташиту.
      - Поставьте переходник 1.8 В между программатором и прищепкой.
      - text: Укажите напряжение адаптера в config.yaml.
        code: |
          safety:
            programmer_voltage: 1.8
      - Если в профиле напряжение не указано, Дирижёр спросит вас. Отвечайте «да», только если сверили по даташиту.
    check: В шаге 3 должно быть «напряжение совместимо».

  after_fail:
    group: work
    title: Записалось, но не заработало
    steps:
      - text: Сообщите результат — «Сообщить, помог ли ремонт» → «нет». Этот способ опустится в списке.
        code: python3 -m dirizher feedback 7 --fail
      - text: Верните копию «до» — «Вернуть как было». Перед откатом тоже снимется копия.
        code: python3 -m dirizher rollback 7
      - Причина может быть не в прошивке — питание, другие микросхемы, разъёмы.
      - Эталон был с другой ревизии платы? Снимите эталон с точно такой же.
    check: Журнал → сеанс отката → «откат выполнен».
    related:
      - label: Вернуть как было
        action: rollback

  displays:
    group: work
    title: Экран, телефон, ПК — как подключить
    why: Дирижёр работает с любого экрана. Выберите, что у вас есть.
    steps:
      - text: Телефон или ПК в той же сети (Wi-Fi). На приборе запустите веб-интерфейс, на телефоне откройте адрес и введите код — оба видны на экране прибора и в консоли.
        code: |
          python3 -m dirizher web
          # на телефоне: http://<адрес-прибора>:8080
      - text: Сенсорный экран Raspberry Pi (DSI) или монитор через переходник micro-HDMI → HDMI. Служба запускает интерфейс при включении, браузер открывается на весь экран. Экран самого прибора входит без кода. В файле службы поправьте пользователя и папку.
        code: |
          sudo cp system/dirizher-web.service /etc/systemd/system/
          sudo systemctl enable --now dirizher-web
          system/kiosk.sh
      - text: Маленький экран без графики (SPI-дисплей 3.5″), консоль через переходник USB-UART или SSH — текстовый мастер с теми же вопросами.
        code: |
          python3 -m dirizher wizard
          # или просто: python3 -m dirizher
      - text: Без роутера Raspberry Pi может раздать свою сеть Wi-Fi, телефон подключится к ней напрямую (ПРОВЕРИТЬ НА ЖЕЛЕЗЕ).
        code: sudo nmcli device wifi hotspot ssid DIRIZHER password 12345678
      - text: Постоянный код доступа задаётся в config.yaml — обязательно в кавычках.
        code: |
          web:
            pin: "4721"
    check: Экран «Прибор» → «Подключить телефон или ПК» показывает адреса. Код виден только на экране самого прибора.

  # ───────────── развитие ─────────────
  dev_architecture:
    group: dev
    title: Как устроен Дирижёр
    why: Как оркестр. Дирижёр (ядро) ведёт общий сценарий, музыканты (плагины) играют каждый на своём инструменте, ноты (профили) говорят, что играть.
    steps:
      - Плагин знает, КАК подключиться — flashrom, probe-rs, Bus Pirate. Четыре метода — available, probe, read, write.
      - Профиль знает, ЧТО это и как лечить — отпечаток (JEDEC ID), напряжение, проверки, способы ремонта. Это YAML-файл, его пишет человек.
      - text: Ядро знает только порядок — опознание → напряжение → копия «до» → диагностика → план → запись со сверкой. И правила безопасности.
        code: |
          __main__.py            команды
          core/pipeline.py       Conductor — единый сценарий
          core/checks.py         проверки диагностики
          core/safety.py         условия записи
          plugins/*.py           инструменты («лезвия»)
          profiles/**/*.yaml     чипы и платы
          interface/             Штурман, веб, мастер
      - Интерфейс — отдельный слой. Ядро говорит с человеком только через объект ui. Консоль, браузер и мастер подставляют свой ui — ядро о них не знает.
      - Отсюда правило — новый чип = новый профиль, новый инструмент = новый плагин. Ядро меняется только при необходимости.
    check: Экран «Прибор» (или python3 -m dirizher plugins и profiles) — что подключено сейчас.

  dev_chip_profile:
    group: dev
    title: Новый чип за 5 минут
    why: Дирижёр опознал чип, но пишет «точного профиля нет»? Нужен профиль — YAML-файл с паспортом чипа.
    steps:
      - text: Узнайте JEDEC ID — «Узнать, что за микросхема». Если профиля нет, черновик уже лежит в data/drafts/.
        code: python3 -m dirizher detect
      - Найдите даташит по маркировке на корпусе. Выпишите напряжение питания и объём.
      - text: Заполните «Конструктор профиля» — он проверит поля и подскажет. Или скопируйте шаблон вручную.
        code: cp profiles/chips/_template.yaml profiles/chips/gigadevice_gd25q64.yaml
      - text: Пример готового профиля (JEDEC ID сверьте по даташиту).
        code: |
          id: gigadevice_gd25q64
          name: GigaDevice GD25Q64 (8 МБ, SPI NOR, 3.3 В)
          class: memory.spi_nor
          match:
            jedec_id: "C84017"
          priority: 10
          voltage: 3.3
          size: 8388608
          allow_write: true
          checks: [stable_read, not_zero, not_blank, size_matches, compare_reference]
          recipes:
            - {id: restore_reference, title: Записать эталонную прошивку, action: write_reference}
            - {id: restore_image, title: Записать официальный образ, action: write_image}
      - text: Проверьте, что профиль загрузился без ошибок.
        code: python3 -m dirizher profiles
    check: Снова «Узнать, что за микросхема» — теперь там ваш профиль и точность совпадения 1.0.
    related:
      - label: Открыть конструктор профиля
        action: builder

  dev_board_profile:
    group: dev
    title: Профиль платы — сохранить MAC и серийник
    why: На одном чипе бывают разные платы. Профиль платы узнаёт её по сигнатуре в дампе и знает, какие области уникальны — их нельзя затирать чужими данными.
    steps:
      - text: Снимите эталон с исправной платы и выгрузите его файлом (в браузере — «Забрать дамп файлом»).
        code: python3 -m dirizher export 3 --kind before --to ~/good.bin
      - text: Посмотрите начало дампа — первые байты часто и есть сигнатура (заголовок загрузчика).
        code: hexdump -C ~/good.bin | head
      - text: Найдите уникальные области — сравните дампы двух одинаковых плат. Различия в паре мест — это MAC и серийники.
        code: cmp -l ~/plataA.bin ~/plataB.bin | head
      - text: Скопируйте шаблон и заполните content_match и preserve.
        code: |
          cp profiles/boards/_template_board.yaml profiles/boards/my_router.yaml
          # content_match:
          #   - offset: 0x0
          #     hex: "27051956"
          # preserve:
          #   - offset: 0x7F0000
          #     length: 0x10000
          #     why: MAC-адреса и калибровка радио
    check: При ремонте Дирижёр напишет «по содержимому узнана плата» и «сохраняю с текущего чипа …».

  dev_check:
    group: dev
    title: Новая проверка диагностики
    why: Проверка — маленькая функция. Она только читает дамп и возвращает находку со статусом ok, info, warn, fail или block.
    steps:
      - text: Откройте dirizher/core/checks.py и добавьте функцию с пометкой @register.
        code: |
          import zlib   # в начало файла

          @register("crc32_region")
          def crc32_region(ci: CheckInput) -> Finding:
              off = to_int(ci.params["offset"])
              ln = to_int(ci.params["length"])
              want = to_int(ci.params["crc"])
              got = zlib.crc32(ci.data[off:off + ln])
              if got == want:
                  return Finding("crc32_region", "ok", "контрольная сумма раздела верна")
              return Finding("crc32_region", "fail",
                             f"CRC раздела 0x{got:08X}, ожидалось 0x{want:08X}",
                             ["restore_reference", "restore_image"])
      - text: Включите проверку в профиле — с параметрами.
        code: |
          checks:
            - stable_read
            - type: crc32_region
              offset: 0x1000
              length: 0x300000
              crc: 0x1A2B3C4D
      - Статус block — только когда запись опасна. Для «прошивка повреждена» — fail и список способов ремонта.
      - Напишите тест — урок «Тесты без железа».
    check: python3 -m unittest -v — внизу OK.

  dev_plugin:
    group: dev
    title: Новый инструмент (плагин)
    why: Плагин учит Дирижёр новому способу подключения. Например, probe-rs для микроконтроллеров ARM или minipro для программатора T48.
    steps:
      - text: Скопируйте шаблон — имя без «_» в начале.
        code: cp dirizher/plugins/_template.py dirizher/plugins/probe_rs.py
      - text: Задайте name, title, target_class и реализуйте 4 метода. Формат вывода программы сверьте со своей версией (ПРОВЕРИТЬ НА ЖЕЛЕЗЕ).
        code: |
          class ProbeRsPlugin(Plugin):
              name = "probe_rs"
              title = "Микроконтроллеры ARM через probe-rs"
              target_class = "mcu.arm"

              def available(self):
                  if not shutil.which("probe-rs"):
                      return False, "probe-rs не установлен"
                  return True, "готов"

              def probe(self):        # ТОЛЬКО чтение идентификаторов
                  res = self.run(["probe-rs", "info"], timeout=60)
                  ...                 # разобрать res.out → Detection
      - text: Включите плагин в config.yaml.
        code: |
          plugins:
            probe_rs:
              enabled: true
      - Создайте профиль с class — mcu.arm.
      - text: Тест без железа — подставная программа. Скрипт с именем настоящей программы печатает типичный вывод; папку с ним ставят первой в PATH.
        code: |
          #!/bin/sh
          # tests/fake/probe-rs — пример, не настоящий вывод
          echo "Chip: STM32F103C8 IDCODE 0x1BA01477"
      - Правила — probe() только читает; внешние программы только через self.run(); копии, сверку и «ДА» делает ядро.
    check: Экран «Прибор» — новый плагин в списке со статусом «готов».

  dev_test:
    group: dev
    title: Тесты без железа
    why: Каждая возможность — с тестом. Симулятор и AutoUI проходят весь цикл за секунды, без микросхемы.
    steps:
      - text: Запуск всех тестов — перед каждым коммитом.
        code: python3 -m unittest -v
      - text: Тест сценария — AutoUI отвечает на вопросы по списку, симулятор изображает чип.
        code: |
          def test_repair_after_corrupt(self):
              self.make_reference()
              c = self.conductor(["yes"])      # «заработало?» — да
              self.sim(c).do_corrupt()
              sid = c.run()
              self.assertEqual(self.outcome(c, sid), "repaired")
      - Нашли ошибку на железе? Сначала воспроизведите её тестом, потом исправляйте.
      - text: Тесты интерфейса и Штурмана — отдельный файл.
        code: python3 -m unittest tests.test_interface -v
    check: Внизу вывода — OK.

  dev_guide:
    group: dev
    title: Свой вопрос или урок в Штурмане
    why: Все вопросы, варианты и уроки лежат в одном файле — dirizher/interface/guide.yaml. Код менять не нужно.
    steps:
      - text: Вариант ответа ведёт либо к следующему вопросу (next), либо к действию (action), либо к уроку (lesson).
        code: |
          - label: Роутер не грузится после обновления
            explain: частый случай — оборванная запись
            next: repair
      - text: Новый урок — в разделе lessons. Шаги — текст и, если нужно, пример (code).
        code: |
          lessons:
            my_router:
              group: work
              title: Роутер X1 — особенности
              why: Чип под радиатором, прищепка не встаёт.
              steps:
                - Снимите радиатор, читайте выпаянный чип.
                - text: Сначала план без записи
                  code: python3 -m dirizher run --dry-run
      - Действия — run (dry_run, label, image), detect, rollback, feedback, export, sim (do), history, plugins, profiles, roadmap, builder, params, tune, tune_form, skills, help (article), hood (area), doctor, fix.
      - text: Проверьте файл — тест ловит опечатки в ссылках.
        code: python3 -m unittest tests.test_interface -v
    check: Обновите страницу в браузере (или перезапустите мастер) — новый вариант на месте.

  dev_session:
    group: dev
    title: Сессия разработки с Claude
    why: Одна сессия — одна цель. Claude видит проект через код одним файлом, STATUS.md и PRINCIPLES.md.
    steps:
      - text: Перед сессией соберите код в один файл и замените его в проекте Claude.
        code: python3 tools/bundle.py
      - Назовите цель одной фразой — например «плагин для Bus Pirate 5, I2C EEPROM 24Cxx». Нет цели — Claude предложит следующую из STATUS.md.
      - Claude отвечает планом, новыми файлами целиком и изменениями «было → стало».
      - text: Проверьте у себя и сохраните.
        code: |
          python3 -m unittest -v
          git add -A && git commit -m "…"
      - В конце сессии обновите docs/STATUS.md и строку в CHANGELOG.md.
    check: «Развитие» → «Что делать дальше по плану» показывает шаги из STATUS.md.
    related:
      - label: Что делать дальше по плану
        action: roadmap
