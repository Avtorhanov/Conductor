<style>
/* «Дирижёр» — одна страница для любого экрана: телефон, ПК, сенсорный экран прибора.
   Без внешних шрифтов и библиотек: работает без интернета.
   Две темы: «Нави» (по умолчанию и при тёмной теме системы; заменила прежнюю тёмную) и «Светлое».
   «Нави»: тёмно-синяя основа, полукруглые объёмные вкладки, тень вправо-вниз, низ элемента притемнён.
   Всё, чем темы отличаются по форме и объёму, — переменные ниже; светлая тема возвращает прежний плоский вид.
   Шрифт заголовков Exo 2 берётся, только если он установлен в системе; иначе — системный. */
:root {
  --bg: #0a1430; --surface: #11214a; --surface2: #162b5b; --line: #1e3366;
  --text: #e8eeff; --muted: #9aaed6; --accent: #49d3ff; --accent-ink: #04122e;
  --ok: #4be3a3; --warn: #ffc24d; --bad: #ff6b7a; --info: #8fb4ff; --sim: #b9a2ff; --bad-ink: #2b0007;
  --ok-bg: rgba(75,227,163,.14); --warn-bg: rgba(255,194,77,.14); --bad-bg: rgba(255,107,122,.15);
  --info-bg: rgba(143,180,255,.14); --sim-bg: rgba(185,162,255,.16);
  --radius: 16px; --scale: 1; --tabs-h: 64px;
  --mono: ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif;
  --font-head: "Exo 2", "Jura", var(--font-body);
  /* форма и объём */
  --top-bg: #08112a; --edge: transparent; --card-gap: 1.3rem; --opts-gap: .8rem; --list-gap: .6rem;
  --tabs-bg: #08112a; --tabs-pad: .55rem .6rem .6rem; --tabs-side: .6rem; --tabs-gap: .5rem; --tabs-inner: 1.15rem; --tabs-gap-wide: .75rem;
  --tab-bg: #132550; --tab-on-bg: #1f3d7a; --tab-on-ink: #ffffff; --tab-radius: 14px; --tab-lift: translateY(-2px);
  --seg-bg: #060b1a; --seg-pad: 3px; --seg-radius: 999px; --seg-btn-bg: transparent; --seg-btn-radius: 999px;
  --sh-raised: 4px 6px 0 #02050f, 10px 16px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1), inset 0 -3px 0 rgba(0,0,0,.28);
  --sh-on: 5px 8px 0 #02050f, 12px 20px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -3px 0 var(--accent);
  --sh-card: 6px 8px 0 #02050f, 14px 22px 36px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
  --sh-item: 3px 4px 0 #02050f, 6px 10px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  --sh-press: 1px 2px 0 #02050f, inset 3px 4px 8px rgba(0,0,0,.45);
  --sh-sunken: inset 3px 4px 0 #02050f, inset 0 0 0 1px #1e3366;
  --sh-ask: var(--sh-card);
  --press: translate(2px, 3px); --press-opt: translate(2px, 3px);
  font-size: calc(16px * var(--scale));
}
:root[data-theme="light"] {
  --bg: #f5f3ee; --surface: #ffffff; --surface2: #f0ede6; --line: #ddd8cc;
  --text: #1d2228; --muted: #67707a; --accent: #b7791f; --accent-ink: #ffffff;
  --ok: #1f8a3a; --warn: #a36a00; --bad: #c8382d; --info: #2f6fbf; --sim: #7b4fc4; --bad-ink: #ffffff;
  --ok-bg: rgba(63,185,80,.12); --warn-bg: rgba(217,163,58,.14); --bad-bg: rgba(242,100,90,.13);
  --info-bg: rgba(106,169,245,.12); --sim-bg: rgba(180,140,242,.14);
  --radius: 14px; --font-head: var(--font-body);
  --top-bg: var(--bg); --edge: var(--line); --card-gap: 1rem; --opts-gap: .55rem; --list-gap: .4rem;
  --tabs-bg: var(--surface); --tabs-pad: 0; --tabs-side: 0px; --tabs-gap: 0; --tabs-inner: 0px; --tabs-gap-wide: .25rem;
  --tab-bg: transparent; --tab-on-bg: var(--surface); --tab-on-ink: var(--accent); --tab-radius: 10px; --tab-lift: none;
  --seg-bg: transparent; --seg-pad: 0; --seg-radius: 12px; --seg-btn-bg: var(--surface2); --seg-btn-radius: 0;
  --sh-raised: none; --sh-on: none; --sh-card: none; --sh-item: none; --sh-press: none; --sh-sunken: none;
  --sh-ask: 0 10px 30px rgba(0,0,0,.35);
  --press: none; --press-opt: scale(.99);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="navy"]) {
    --bg: #f5f3ee; --surface: #ffffff; --surface2: #f0ede6; --line: #ddd8cc;
    --text: #1d2228; --muted: #67707a; --accent: #b7791f; --accent-ink: #ffffff;
    --ok: #1f8a3a; --warn: #a36a00; --bad: #c8382d; --info: #2f6fbf; --sim: #7b4fc4; --bad-ink: #ffffff;
    --ok-bg: rgba(63,185,80,.12); --warn-bg: rgba(217,163,58,.14); --bad-bg: rgba(242,100,90,.13);
    --info-bg: rgba(106,169,245,.12); --sim-bg: rgba(180,140,242,.14);
    --radius: 14px; --font-head: var(--font-body);
    --top-bg: var(--bg); --edge: var(--line); --card-gap: 1rem; --opts-gap: .55rem; --list-gap: .4rem;
    --tabs-bg: var(--surface); --tabs-pad: 0; --tabs-side: 0px; --tabs-gap: 0; --tabs-inner: 0px; --tabs-gap-wide: .25rem;
    --tab-bg: transparent; --tab-on-bg: var(--surface); --tab-on-ink: var(--accent); --tab-radius: 10px; --tab-lift: none;
    --seg-bg: transparent; --seg-pad: 0; --seg-radius: 12px; --seg-btn-bg: var(--surface2); --seg-btn-radius: 0;
    --sh-raised: none; --sh-on: none; --sh-card: none; --sh-item: none; --sh-press: none; --sh-sunken: none;
    --sh-ask: 0 10px 30px rgba(0,0,0,.35);
    --press: none; --press-opt: scale(.99);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 1rem/1.45 var(--font-body);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--info); }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- каркас ---------- */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .6rem;
  padding: calc(.55rem + env(safe-area-inset-top)) 1rem .55rem; background: var(--top-bg);
  border-bottom: 1px solid var(--line);
  /* iPhone в альбомной ориентации: вырез экрана сбоку — края отступают от него (в портрете вставки = 0) */
  padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right));
}
/* Всё, что выше края экрана, залито цветом шапки. На iPhone (Safari iOS 26) страница рисуется и под строкой
   состояния — без этой заливки там просвечивают прокручиваемые карточки. Полоса демо не закрывается:
   она внутри экрана, а заливка — только над ним. */
.top::before {
  content: ""; position: fixed; left: 0; right: 0; bottom: 100%; height: 100vh;
  background: var(--top-bg); pointer-events: none;
}
.brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; letter-spacing: .02em; font-size: 1.1rem; font-family: var(--font-head); }
.brand svg { width: 1.6rem; height: 1.6rem; color: var(--accent); }
.spacer { flex: 1; }
.pill {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: .35rem .8rem; font-size: .85rem; display: inline-flex; align-items: center; gap: .4rem; min-height: 2.2rem;
}
.pill .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ok); }
.pill.sim { border-color: var(--sim); background: var(--sim-bg); }
.pill.sim .dot { background: var(--sim); }
.net { font-size: .8rem; color: var(--bad); }

main {
  padding: 1rem 1rem calc(var(--tabs-h) + 1.5rem + env(safe-area-inset-bottom)); max-width: 880px; margin: 0 auto;
  padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right));
}
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  background: var(--tabs-bg); border-top: 1px solid var(--line); gap: var(--tabs-gap);
  padding: var(--tabs-pad); padding-bottom: calc(env(safe-area-inset-bottom) + var(--tabs-inner) / 2);
  padding-left: max(var(--tabs-side), env(safe-area-inset-left)); padding-right: max(var(--tabs-side), env(safe-area-inset-right));
}
/* то же снизу: под меню (полоса жеста iPhone, оттягивание) не видно прокручиваемых карточек */
.tabs::after {
  content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 100vh;
  background: var(--tabs-bg); pointer-events: none;
}
.tab {
  min-width: 0; padding: 0 .15rem;
  border: 0; background: var(--tab-bg); color: var(--muted); min-height: calc(var(--tabs-h) - var(--tabs-inner)); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: .15rem; font-size: .72rem; position: relative;
  border-radius: var(--tab-radius); box-shadow: var(--sh-raised); font-family: var(--font-head);
  transition: transform .08s, box-shadow .08s, background .12s;
}
.tab svg { width: 1.5rem; height: 1.5rem; flex: none; }
.tab span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .short { display: none; }
.tab[aria-current="page"] { color: var(--tab-on-ink); background: var(--tab-on-bg); box-shadow: var(--sh-on); transform: var(--tab-lift); font-weight: 600; }
.tab[aria-current="page"] svg { color: var(--accent); }
.tab:active { transform: var(--press); box-shadow: var(--sh-press); }
.tab .badge {
  position: absolute; top: .55rem; left: calc(50% + .55rem); width: .6rem; height: .6rem; border-radius: 50%;
  background: var(--info);
}
.tab .badge.ask { background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
  .top { grid-column: 1 / 3; }
  .tabs {
    position: sticky; top: 3.4rem; align-self: start; grid-template-columns: 1fr; border: 0;
    background: none; padding: 1rem .6rem; gap: var(--tabs-gap-wide);
    padding-left: max(.6rem, env(safe-area-inset-left));
  }
  .tabs::after { display: none; }
  .tab { flex-direction: row; justify-content: flex-start; gap: .7rem; padding: 0 1rem; min-height: 3rem; border-radius: var(--tab-radius); font-size: .95rem; }
  .tab .badge { top: 50%; left: auto; right: .8rem; transform: translateY(-50%); }
  main { padding-bottom: 2rem; margin: 0; width: 100%; padding-left: 1rem; }
}
/* Низкий экран: телефон в альбомной ориентации, экраны прибора 800×480 и 480×320.
   Подписи разделов НЕ прячутся (раньше пропадали): значок и слово стоят в одну строку — меню не выше прежнего. */
@media (max-height: 520px) {
  :root { --tabs-h: 50px; --tabs-pad: .2rem .45rem; --tabs-side: .45rem; --tabs-inner: .4rem; }
  .tab { flex-direction: row; gap: .4rem; font-size: .78rem; }
  .tab svg { width: 1.25rem; height: 1.25rem; }
  .tab .badge { top: .3rem; left: auto; right: .4rem; }
  .top { padding-top: .3rem; padding-bottom: .3rem; }
  main { padding-top: .6rem; }
  h1 { font-size: 1.15rem; }
  .card { padding: .7rem; margin-bottom: .6rem; }
  .say { font-size: .85rem; margin-bottom: .5rem; }
  .opt { min-height: 2.8rem; padding: .45rem .7rem; }
}
@media (max-height: 360px) {
  .opt .txt small, .say { display: none !important; }
  .ask { padding: .6rem; }
}
/* низкое меню внизу (не боковое): «Справочник» подписан «Каталог» — слово целиком и при вырезе экрана сбоку */
@media (max-height: 520px) and (max-width: 899px) {
  .tab .full { display: none; }
  .tab .short { display: inline; }
}
/* узкий и низкий (экран прибора 480×320): значок над словом, мельче — шесть подписей влезают */
@media (max-height: 520px) and (max-width: 600px) {
  .tab { flex-direction: column; gap: 0; font-size: .62rem; }
  .tab svg { width: 1.15rem; height: 1.15rem; }
}
/* боковое меню на низком экране (большой телефон в альбомной ориентации): подписи, кнопки ниже — все шесть видны */
@media (min-width: 900px) and (max-height: 520px) {
  .tabs { top: 2.9rem; padding-top: .6rem; padding-bottom: .6rem; gap: .45rem; }
  .tab { font-size: .9rem; gap: .6rem; min-height: 2.6rem; }
  .tab svg { width: 1.35rem; height: 1.35rem; }
  .tab .badge { top: 50%; left: auto; right: .8rem; transform: translateY(-50%); }
}

/* ---------- карточки и кнопки ---------- */
.card {
  background: var(--surface); border: 1px solid var(--edge); border-radius: var(--radius); padding: 1rem; margin: 0 0 var(--card-gap);
  box-shadow: var(--sh-card);
}
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
h1 { font-size: 1.45rem; margin: .2rem 0 .4rem; font-family: var(--font-head); }
h2 { font-size: 1.2rem; margin: .2rem 0 .5rem; font-family: var(--font-head); }
h3 { font-size: 1rem; margin: .8rem 0 .4rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
p { margin: .3rem 0 .7rem; }
.muted { color: var(--muted); }
.say { color: var(--muted); margin-bottom: 1rem; }

.opts { display: grid; gap: var(--opts-gap); }
@media (min-width: 640px) { .opts.two { grid-template-columns: 1fr 1fr; } }
.opt {
  display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left; min-height: 3.4rem;
  padding: .7rem .9rem; border-radius: 12px; border: 1px solid var(--edge); background: var(--surface2);
  border-left: 4px solid var(--line); box-shadow: var(--sh-raised);
}
.opt:hover { border-color: var(--accent); }
.opt:active { transform: var(--press-opt); box-shadow: var(--sh-press); }
.opt .ico { font-size: 1.45rem; width: 1.9rem; text-align: center; flex: none; }
.noemoji .opt .ico { display: none; }
.opt .txt { flex: 1; min-width: 0; }
.opt .txt b { display: block; font-weight: 600; }
.opt .txt small { display: block; color: var(--muted); font-size: .85rem; margin-top: .1rem; }
.opt .chev { color: var(--muted); font-size: 1.3rem; }
.opt.important { border-left-color: var(--accent); }
.opt.tip { border-left-color: var(--info); }
.opt.info { border-left-color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; padding: .05rem .45rem; border-radius: 999px; margin-left: .35rem; vertical-align: middle; font-weight: 500; }
.tag-ok { background: var(--ok-bg); color: var(--ok); }
.tag-warn { background: var(--warn-bg); color: var(--warn); }
.tag-info { background: var(--info-bg); color: var(--info); }
.tag-sim { background: var(--sim-bg); color: var(--sim); }

.btn {
  border: 1px solid var(--edge); background: var(--surface2); border-radius: 12px; min-height: 3rem;
  padding: .55rem 1.1rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  box-shadow: var(--sh-raised);
}
.btn:active { transform: var(--press); box-shadow: var(--sh-press); }
a.btn { text-decoration: none; color: var(--text); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: var(--bad); color: var(--bad-ink); border-color: var(--bad); }
.btn.ghost { background: none; box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn.small { min-height: 2.3rem; padding: .3rem .8rem; font-size: .9rem; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.back { border: 0; background: none; color: var(--muted); padding: .3rem 0; margin-bottom: .4rem; min-height: 2.4rem; font-size: .95rem; }

/* ---------- работа ---------- */
.progress { display: grid; gap: 4px; margin: .6rem 0 .3rem; }
.progress i { height: 6px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--ok); }
.progress i.now { background: var(--accent); }
.log { font-size: .93rem; }
.log .ev { padding: .25rem 0; display: flex; gap: .5rem; white-space: pre-wrap; word-break: break-word; }
.log .ev .k { flex: none; width: 1.2rem; text-align: center; }
.log .ev.ok .k { color: var(--ok); }
.log .ev.warn { color: var(--warn); }
.log .ev.error { color: var(--bad); }
.log .ev.info, .log .ev.text { color: var(--muted); }
.log .hdr { font-weight: 700; font-size: 1.05rem; margin: .4rem 0; }
.log .step { margin: .9rem 0 .2rem; font-weight: 700; color: var(--accent); }
.log .step small { color: var(--muted); font-weight: 500; margin-right: .4rem; }
.st { font-size: .72rem; padding: .05rem .45rem; border-radius: 999px; flex: none; height: fit-content; margin-top: .15rem; }
.st-ok { background: var(--ok-bg); color: var(--ok); }
.st-info { background: var(--info-bg); color: var(--info); }
.st-warn { background: var(--warn-bg); color: var(--warn); }
.st-fail, .st-block { background: var(--bad-bg); color: var(--bad); }
.log .chk { color: var(--muted); font-family: var(--mono); font-size: .8rem; }

.ask {
  position: sticky; bottom: calc(var(--tabs-h) + .6rem + env(safe-area-inset-bottom)); z-index: 10;
  background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: 1rem;
  box-shadow: var(--sh-ask); margin-top: 1rem;
}
@media (min-width: 900px) { .ask { bottom: 1rem; } }
.ask .qtext { font-weight: 600; margin-bottom: .8rem; white-space: pre-wrap; }

<script>
"use strict";
/* =====================================================================
   Состояние и утилиты
   ===================================================================== */
const S = {
  guide: null, hello: null, tab: "guide", node: null, stack: [], pages: [],
  sim: null, job: null, jobId: null, seq: 0, events: [], polling: false,
  builder: null, loginWait: null, renderId: 0,
};
const $ = (sel, root) => (root || document).querySelector(sel);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem("drz." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("drz." + k, JSON.stringify(v)); } catch (e) { /* хранилище недоступно — не страшно */ } },
};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(3)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function toast(text, kind) {
  const t = $("#toast");
  t.textContent = text; t.className = "toast" + (kind ? " " + kind : ""); t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, kind === "bad" ? 6000 : 3500);
}

function fmtSize(n) {
  if (n == null) return "—";
  if (n >= 1048576 && n % 1048576 === 0) return (n / 1048576) + " МБ";
  if (n >= 1024 && n % 1024 === 0) return (n / 1024) + " КБ";
  return n.toLocaleString("ru-RU") + " байт";
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* пробуем запасной способ */ }
  const ta = h("textarea", { style: "position:fixed;top:0;left:0;opacity:0" });
  ta.value = text; document.body.append(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

/* На экранах без цветных эмодзи (например, Raspberry Pi без шрифта Noto Color Emoji)
   значки скрываются, чтобы не было «квадратиков». */
function emojiSupported() {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 24;
    const x = c.getContext("2d"); x.textBaseline = "top"; x.font = "20px sans-serif"; x.fillText("🔧", 0, 0);
    const d = x.getImageData(0, 0, 24, 24).data;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 0 && (d[i] !== d[i + 1] || d[i + 1] !== d[i + 2])) return true;
    return false;
  } catch (e) { return true; }
}

/* =====================================================================
   Связь с прибором
   ===================================================================== */
async function api(path, opts) {
  opts = opts || {};
  const init = { method: opts.method || "GET", headers: { "X-Dirizher": "1" }, credentials: "same-origin" };
  if (opts.json !== undefined) {
    init.method = "POST"; init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.json);
  }
  let r;
  try { r = await fetch(path, init); setOnline(true); }
  catch (e) { setOnline(false); const err = new Error("нет связи с прибором"); err.status = 0; throw err; }
  if (r.status === 401 && !opts.noLogin) { await ensureLogin(); return api(path, opts); }
  const isJson = (r.headers.get("content-type") || "").indexOf("json") >= 0;
  const data = isJson ? await r.json() : null;
  if (!r.ok) { const err = new Error((data && data.error) || ("ошибка " + r.status)); err.status = r.status; throw err; }
  return data;
}

function setOnline(ok) { $("#net").hidden = ok; }

function ensureLogin() {
  if (S.loginWait) return S.loginWait;
  S.loginWait = new Promise(resolve => {
    const input = h("input", { class: "in", type: "password", inputmode: "numeric", autocomplete: "one-time-code",
      maxlength: "12", placeholder: "••••••", "aria-label": "Код доступа" });
    const err = h("div", { class: "msg e", hidden: true });
    const btn = h("button", { class: "btn primary", type: "submit", style: "width:100%;margin-top:.8rem" }, "Войти");
    const form = h("form", {}, input, err, btn);
    const wrap = h("div", { class: "login" }, h("div", { class: "card" },
      h("h1", {}, "Дирижёр"),
      h("p", { class: "muted" }, "Введите код доступа. Он виден на экране самого прибора (раздел «Прибор») и в консоли, где запущен интерфейс."),
      form));
    form.addEventListener("submit", async ev => {
      ev.preventDefault(); btn.disabled = true; err.hidden = true;
      try {
        await api("/api/login", { json: { pin: input.value }, noLogin: true });
        wrap.remove(); S.loginWait = null; resolve();
      } catch (e) { err.textContent = e.message; err.hidden = false; input.select(); }
      btn.disabled = false;
    });
    document.body.append(wrap);
    setTimeout(() => input.focus(), 50);
  });
  return S.loginWait;
}

/* =====================================================================
   Режим, вкладки, страницы

function setSim(v, announce) {
  S.sim = !!v; store.set("sim", S.sim);
  const b = $("#mode");
  b.classList.toggle("sim", S.sim);
  $("#modeText").textContent = S.sim ? (window.innerWidth < 420 ? "Учебный" : "Учебный режим") : "Железо";
  if (announce) toast(S.sim ? "Учебный режим: виртуальная микросхема, железо не используется" : "Работа с настоящим железом");
}

function showTab(tab) {
  S.tab = tab; S.pages = [];
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false");
  render();
  window.scrollTo(0, 0);
}

function openPage(fn) { S.pages.push(fn); render(); window.scrollTo(0, 0); }
function back() { S.pages.pop(); render(); }
function backBtn(label) { return h("button", { class: "back", type: "button", onclick: back }, "← " + (label || "Назад")); }

function render() {
  const v = $("#view");
  v.textContent = "";
  S.renderId++;
  try {
    if (S.pages.length) return S.pages[S.pages.length - 1](v);
    ({ guide: renderGuide, work: renderWork, log: renderLog, catalog: renderCatalog, dev: renderDev, device: renderDevice })[S.tab](v);
  } catch (e) { v.append(h("div", { class: "card" }, "Ошибка показа: " + e.message)); }
}

function questionBanner() {
  if (!S.job || S.job.done || !S.job.question || S.tab === "work") return null;
  return h("div", { class: "banner" }, h("span", { class: "grow" }, "Дирижёр ждёт вашего ответа"),
    h("button", { class: "btn primary small", type: "button", onclick: () => showTab("work") }, "Открыть"));
}

/* =====================================================================
   Варианты ответов (общий вид для Штурмана, подсказок, «что дальше»)
   ===================================================================== */
function optTag(o) {
  const p = o.params || {};
  if (o.lesson) return ["урок", "tag-info"];
  if (o.action === "run") return p.dry_run ? ["без записи", "tag-ok"] : ["запись после «ДА»", "tag-warn"];
  if (o.action === "rollback") return ["запись после «ДА»", "tag-warn"];
  if (o.action === "detect") return ["только чтение", "tag-ok"];
  if (o.action === "capture") return ["только приём", "tag-ok"];
  if (o.action === "sim") return ["учебный", "tag-sim"];
  if (o.action === "params") return ["только чтение", "tag-ok"];
  if (o.action === "tune") return p.dry_run ? ["без записи", "tag-ok"] : ["запись после «ДА»", "tag-warn"];
  if (o.action === "tune_form") return ["запись после «ДА»", "tag-warn"];
  if (o.action === "help") return ["справка", "tag-info"];
  if (o.action === "playground") return ["тренажёр", "tag-info"];
  return null;
}

function optButton(o) {
  const tag = optTag(o);
  return h("button", { class: "opt " + (o.level || ""), type: "button", onclick: () => go(o) },
    o.icon ? h("span", { class: "ico", "aria-hidden": "true" }, o.icon) : null,
    h("span", { class: "txt" },
      h("b", {}, o.label, tag ? h("span", { class: "tag " + tag[1] }, tag[0]) : null),
      o.explain ? h("small", {}, o.explain) : null),
    h("span", { class: "chev", "aria-hidden": "true" }, "›"));
}

async function go(o) {
  if (o.next) {
    const node = S.guide.nodes[o.next];
    if (o.next === S.guide.start) S.stack = [];
    else if (S.tab === "guide") { if (o.next !== S.node) S.stack.push(S.node); }
    else S.stack = [S.guide.start];
    S.node = o.next;
    if (node.mode === "sim" && !S.sim) setSim(true, true);
    return showTab("guide");
  }
  if (o.lesson) return openPage(v => renderLesson(v, o.lesson));
  if (o.action) return doAction(o.action, o.params || {});
}

const VIEW_ACTIONS = {
  history: () => showTab("log"),
  plugins: () => showTab("device"),
  profiles: () => showTab("device"),
  roadmap: () => showTab("dev"),
  builder: p => openPage(v => renderBuilder(v, p.draft)),
  show: p => openPage(v => renderSession(v, p.session)),
  skills: () => showTab("dev"),
  help: p => openPage(v => p.article ? renderArticle(v, p.article) : renderHelp(v, "", S.tab)),
  hood: p => openPage(v => renderHood(v, p.area || S.tab)),
  doctor: () => openPage(renderDoctor),
  tune_form: p => openPage(v => renderTune(v, p.session)),
  fix: p => fixModal(p.session, p.fix),
  catalog: p => {
    if (p.card) return openPage(v => renderCard(v, p.card));
    S.catKind = p.kind || ""; S.catQ = ""; showTab("catalog");
  },
  /* учебная площадка — отдельная страница рядом с этой (на приборе, в демо и в приложении) */
  playground: p => { location.href = "playground.html" + (p.track ? "#" + encodeURIComponent(p.track) : ""); },
};
const PICK = { rollback: "rollback", feedback: "feedback", reference: "reference", export: "export" };

async function doAction(action, params) {
  params = Object.assign({}, params);
  if (VIEW_ACTIONS[action]) return VIEW_ACTIONS[action](params);
  if (S.job && !S.job.done) { toast("Уже идёт задание — сначала завершите его", "bad"); return showTab("work"); }
  if (PICK[action] && params.session == null) {
    const sid = await pickSession(PICK[action]);
    if (sid == null) return;
    params.session = sid;
  }
  if (action === "export") return openPage(v => renderSession(v, params.session));
  if (params.label === "ask") {
    const v = await promptText("Метка эталона", "Модель и ревизия платы — помогает различать эталоны. Можно оставить пустым.", "роутер-X1-rev2");
    if (v === null) return;
    params.label = v || null;
  }
  if (params.image === "ask") {
    const name = await pickImage();
    if (!name) return;
    params.image = name;
  }
  if (action === "sim" && !S.sim) setSim(true, true);
  try {
    const r = await api("/api/job", { json: { action, params, sim: S.sim } });
    S.jobId = null; S.seq = 0;
    applyJob(r.job);
    showTab("work");
    poll();
  } catch (e) {
    toast(e.message, "bad");
    if (e.status === 409) showTab("work");
  }
}

/* =====================================================================
   Окна: выбор сеанса, текст, файл образа
   ===================================================================== */
function modal(title, body, onClose) {
  const m = $("#modal");
  m.textContent = "";
  const close = () => { m.hidden = true; m.textContent = ""; if (onClose) onClose(); };
  const box = h("div", { class: "box", role: "dialog", "aria-modal": "true", "aria-label": title }, h("h2", {}, title), body);
  m.append(box); m.hidden = false;
  m.onclick = ev => { if (ev.target === m) close(); };
  return { close, box };
}

function pickSession(purpose) {
  const titles = { rollback: "Какой сеанс откатить?", feedback: "Отзыв по какому сеансу?",
    reference: "Из какого сеанса взять эталон?", export: "Дамп из какого сеанса?" };
  return new Promise(async resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    const list = h("div", { class: "list" }, h("p", { class: "muted" }, "Загружаю журнал…"));
    const m = modal(titles[purpose] || "Выберите сеанс", [list,
      h("div", { class: "row end", style: "margin-top:1rem" },
        h("button", { class: "btn ghost", type: "button", onclick: () => m.close() }, "Отмена"))], () => finish(null));
    try {
      const r = await api("/api/pick?purpose=" + purpose + "&sim=" + (S.sim ? 1 : 0));
      list.textContent = "";
      if (!r.items.length) list.append(h("p", { class: "muted" }, "Подходящих сеансов нет" + (S.sim ? " (учебный режим)." : ".")));
      for (const it of r.items) list.append(h("button", { class: "item", type: "button",
        onclick: () => { finish(it.id); m.close(); } }, it.text));
    } catch (e) { list.textContent = e.message; }
  });
}

function promptText(title, hint, placeholder) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    const input = h("input", { class: "in", type: "text", placeholder: placeholder || "", maxlength: "300" });
    const form = h("form", {}, h("p", { class: "muted" }, hint), input,
      h("div", { class: "row end", style: "margin-top:1rem" },
        h("button", { class: "btn ghost", type: "button", onclick: () => m.close() }, "Отмена"),
        h("button", { class: "btn primary", type: "submit" }, "Дальше")));
    form.addEventListener("submit", ev => { ev.preventDefault(); finish(input.value.trim()); m.close(); });
    const m = modal(title, form, () => finish(null));
    setTimeout(() => input.focus(), 50);
  });
}

function uploadFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/upload?name=" + encodeURIComponent(file.name));
    x.setRequestHeader("X-Dirizher", "1");
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      let data = null;
      try { data = JSON.parse(x.responseText); } catch (e) { data = null; }
      if (x.status === 200) resolve(data);
      else reject(new Error((data && data.error) || ("ошибка " + x.status)));
    };
    x.onerror = () => reject(new Error("нет связи с прибором"));
    x.send(file);
  });
}

function pickImage() {
  return new Promise(async resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    const list = h("div", { class: "list" });
    const status = h("p", { class: "muted" });
    const file = h("input", { type: "file", hidden: true });
    const m = modal("Файл полного образа", [
      h("p", { class: "muted" }, "Нужен образ ВСЕЙ микросхемы — размер файла должен быть равен размеру чипа. Файл обновления с сайта производителя обычно не подходит."),
      h("div", { class: "row" },
        h("button", { class: "btn primary", type: "button", onclick: () => file.click() }, "Загрузить файл с этого устройства"), file),
      status, h("h3", {}, "Уже на приборе"), list,
      h("div", { class: "row end", style: "margin-top:1rem" },
        h("button", { class: "btn ghost", type: "button", onclick: () => m.close() }, "Отмена"))], () => finish(null));
    file.addEventListener("change", async () => {
      const f = file.files[0];
      if (!f) return;
      status.textContent = "Загружаю " + f.name + "…";
      try {
        const r = await uploadFile(f, p => { status.textContent = "Загружаю " + f.name + ": " + Math.round(p * 100) + "%"; });
        toast("Файл на приборе: " + r.name + " (" + fmtSize(r.size) + ")");
        finish(r.name); m.close();
      } catch (e) { status.textContent = e.message; }
    });
    try {
      const r = await api("/api/images");
      if (!r.items.length) list.append(h("p", { class: "muted" }, "Пока ни одного файла."));
      for (const it of r.items) list.append(h("button", { class: "item", type: "button",
        onclick: () => { finish(it.name); m.close(); } }, it.name, h("small", {}, fmtSize(it.size) + " · " + it.mtime)));
    } catch (e) { list.textContent = e.message; }
  });
}

/* =====================================================================
   Штурман
   ===================================================================== */
function renderGuide(v) {
  const g = S.guide;
  const node = g.nodes[S.node] || g.nodes[g.start];
  const banner = questionBanner();
  if (banner) v.append(banner);
  if (S.node === g.start) {
    const sug = h("section", { class: "card", hidden: true }, h("h3", {}, "Сейчас важно"));
    const list = h("div", { class: "opts" });
    sug.append(list);
    v.append(sug);
    api("/api/suggest?sim=" + (S.sim ? 1 : 0)).then(r => {
      if (!r.items.length) return;
      for (const o of r.items) list.append(optButton(o));
      sug.hidden = false;
    }).catch(() => {});
  }
  const card = h("section", { class: "card" });
  if (S.stack.length) card.append(h("button", { class: "back", type: "button", onclick: () => {
    S.node = S.stack.pop() || g.start; render(); } }, "← Назад"));
  card.append(h(S.node === g.start ? "h1" : "h2", {}, node.ask));
  if (node.say) card.append(h("p", { class: "say" }, node.say));
  const opts = h("div", { class: "opts" + (node.options.length > 6 ? " two" : "") });
  for (const o of node.options) opts.append(optButton(o));
  card.append(opts);
  v.append(card);
}

/* =====================================================================
   Работа: ход задания, вопросы, итог
   ===================================================================== */
const FIND = { ok: "норма", info: "сведения", warn: "замечание", fail: "неисправность", block: "опасно" };
const MARKS = { ok: "✔", warn: "⚠", error: "✖", info: "·", text: "" };

function eventNode(e) {
  if (e.kind === "header") return h("div", { class: "hdr" }, e.text);
  if (e.kind === "step") return h("div", { class: "step" }, h("small", {}, "Шаг " + e.n + " из " + e.total), e.text);
  if (e.kind === "finding") return h("div", { class: "ev" },
    h("span", { class: "st st-" + e.status }, FIND[e.status] || e.status),
    h("span", {}, e.text, " ", h("span", { class: "chk" }, e.check)));
  let mark = MARKS[e.kind] || "", text = e.text;
  if (text.startsWith("• ")) { mark = "•"; text = text.slice(2); }
  return h("div", { class: "ev " + e.kind }, h("span", { class: "k" }, mark), h("span", {}, text));
}

function lastStep() {
  for (let i = S.events.length - 1; i >= 0; i--) if (S.events[i].kind === "step") return S.events[i];
  return null;
}

function progressNode() {
  const st = lastStep();
  const bar = h("div", { class: "progress", id: "progress" });
  if (!st) return bar;
  bar.style.gridTemplateColumns = "repeat(" + st.total + ", 1fr)";
  const finished = S.job && S.job.done;
  for (let i = 1; i <= st.total; i++) bar.append(h("i", { class: i < st.n || (finished && i === st.n) ? "done" : (i === st.n ? "now" : "") }));
  return bar;
}

function renderWork(v) {
  const j = S.job;
  if (!j) {
    v.append(h("div", { class: "card empty" }, h("p", {}, "Сейчас ничего не выполняется."),
      h("button", { class: "btn primary", type: "button", onclick: () => showTab("guide") }, "Что будем делать?")));
    return;
  }
  const chips = h("div", { class: "row" },
    h("span", { class: "tag " + (j.sim ? "tag-sim" : "tag-ok") }, j.sim ? "учебный режим" : "железо"),
    j.dry_run ? h("span", { class: "tag tag-ok" }, "без записи") : null,
    h("span", { class: "tag tag-info", id: "jobState" }, j.done ? "завершено" : "идёт"));
  v.append(h("section", { class: "card" }, h("h2", {}, j.title), chips, progressNode(),
    h("div", { class: "log", id: "log" }, S.events.map(eventNode))));
  v.append(h("div", { id: "q" }));
  v.append(h("div", { id: "res" }));
  renderQuestion();
  renderResult();
}

function updateWork(newEvents) {
  const log = $("#log");
  if (!log) return render();
  const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
  for (const e of newEvents) log.append(eventNode(e));
  const old = $("#progress");
  if (old) old.replaceWith(progressNode());
  const st = $("#jobState");
  if (st) st.textContent = S.job.done ? "завершено" : "идёт";
  renderQuestion();
  renderResult();
  if (nearBottom && newEvents.length) window.scrollTo(0, document.body.scrollHeight);
}

function renderQuestion() {
  const box = $("#q");
  if (!box) return;
  const q = S.job && !S.job.done ? S.job.question : null;
  if (box.dataset.qid === String(q ? q.qid : "")) return;   // уже показан
  box.dataset.qid = q ? q.qid : "";
  box.textContent = "";
  box.className = "";
  if (!q) return;
  const send = async (value, buttons) => {
    buttons.forEach(b => { b.disabled = true; });
    try { await api("/api/answer", { json: { job: S.job.id, qid: q.qid, value } }); box.textContent = ""; }
    catch (e) { toast(e.message, "bad"); buttons.forEach(b => { b.disabled = false; }); }
  };
  const cancel = async () => {
    try { await api("/api/cancel", { json: {} }); box.textContent = ""; } catch (e) { toast(e.message, "bad"); }
  };
  box.className = "ask" + (q.type === "confirm_word" ? " danger" : "");
  box.append(h("div", { class: "qtext" }, q.text));
  const buttons = [];
  const mk = (label, cls, fn) => { const b = h("button", { class: "btn " + cls, type: "button", onclick: () => fn(b) }, label); buttons.push(b); return b; };

  if (q.type === "pause") {
    box.append(h("div", { class: "row" }, mk("Продолжить", "primary", () => send(true, buttons)),
      mk("Отмена", "ghost", () => cancel())));
  } else if (q.type === "yes_no") {
    box.append(h("div", { class: "row" }, q.options.map(o =>
      mk(o.label, o.value === "yes" ? "primary" : "", () => send(o.value, buttons)))));
  } else if (q.type === "choose") {
    const list = h("div", { class: "opts" });
    q.options.forEach((label, i) => {
      const b = h("button", { class: "opt", type: "button", onclick: () => send(i, buttons) },
        h("span", { class: "txt" }, h("b", {}, label)), h("span", { class: "chev" }, "›"));
      buttons.push(b); list.append(b);
    });
    box.append(list, h("div", { class: "row" }, mk("Отмена", "ghost", () => cancel())));
  } else if (q.type === "confirm_word") {
    const word = q.word || "ДА";
    const input = h("input", { type: "text", autocomplete: "off", autocapitalize: "characters", spellcheck: "false",
      "aria-label": "Слово подтверждения", placeholder: word });
    const writeBtn = mk("Записать", "danger", () => send(input.value, buttons));
    writeBtn.disabled = true;
    input.addEventListener("input", () => {
      const v = input.value.trim().toLowerCase();
      writeBtn.disabled = !(v === word.toLowerCase() || v === "yes");
    });
    input.addEventListener("keydown", ev => { if (ev.key === "Enter" && !writeBtn.disabled) writeBtn.click(); });
    box.append(h("p", { class: "muted" }, "Копия «до» уже сохранена. Чтобы записать, введите слово «" + word + "» — кнопкой его не заменить."),
      input, h("div", { class: "row" }, writeBtn, mk("Отмена — не записывать", "ghost", () => cancel())));
    setTimeout(() => input.focus(), 50);
  }
}

function renderResult() {
  const box = $("#res");
  if (!box) return;
  box.textContent = "";
  const j = S.job;
  if (!j || !j.done || !j.result) return;
  const o = j.result.outcome || "";
  const good = ["healthy", "repaired", "rolled_back", "detected", "already_same"].indexOf(o) >= 0;
  const bad = ["write_failed", "not_repaired", "rollback_failed", "read_failed", "blocked", "blocked_voltage"].indexOf(o) >= 0 || j.result.error;
  const card = h("section", { class: "card result " + (good ? "good" : bad ? "bad" : "warn") },
    h("h2", {}, j.result.outcome_text || "Готово"),
    j.result.session ? h("p", { class: "muted" }, "Сеанс №" + j.result.session) : null);
  if (j.next && j.next.length) {
    card.append(h("h3", {}, "Что дальше?"));
    card.append(h("div", { class: "opts" }, j.next.map(optButton)));
  }
  card.append(h("div", { class: "row", style: "margin-top:.8rem" },
    j.result.session ? h("button", { class: "btn small", type: "button", onclick: () => openPage(v => renderSession(v, j.result.session)) }, "Журнал сеанса") : null,
    (j.next || []).some(o => o.next === S.guide.start) ? null :
      h("button", { class: "btn small ghost", type: "button", onclick: () => { S.node = S.guide.start; S.stack = []; showTab("guide"); } }, "К началу")));
  box.append(card);
}

function applyJob(job) {
  if (!job) { S.job = null; updateBadge(); return; }
  const fresh = job.id !== S.jobId;
  if (fresh) { S.jobId = job.id; S.events = []; }
  S.job = job;
  S.events.push(...job.events);
  if (S.events.length > 4000) S.events.splice(0, S.events.length - 4000);
  S.seq = job.seq;
  updateBadge();
  if (S.tab === "work" && !S.pages.length) {
    if (fresh) render(); else updateWork(job.events);
  } else if (S.tab === "guide" && !S.pages.length && job.question && !$(".banner")) {
    render();
  }
}

function updateBadge() {
  const b = $("#workBadge");
  const j = S.job;
  b.hidden = !(j && !j.done);
  b.classList.toggle("ask", !!(j && !j.done && j.question));
  document.title = (j && !j.done && j.question ? "● " : "") + "Дирижёр";
}

async function poll() {
  if (S.polling) return;
  S.polling = true;
  try {
    for (;;) {
      let r;
      try { r = await api("/api/job?wait=1&since=" + S.seq + "&job=" + (S.jobId || "")); }
      catch (e) { await sleep(2500); continue; }
      applyJob(r.job);
      if (!r.job || r.job.done) break;
    }
  } finally { S.polling = false; }
}

      input = h("input", { type: "checkbox" });

      autocapitalize: "off", spellcheck: "false", inputmode: f.name === "voltage" ? "decimal" : null });
    input.value = B.fields[f.name] == null ? "" : B.fields[f.name];
    input.addEventListener("input", () => { B.fields[f.name] = input.value; preview(); });
    form.append(h("label", { class: "f" }, h("b", {}, f.label + (f.required ? " *" : "")), h("small", {}, f.help), input));
  }
  card.append(form);
  const msgs = h("div", {});

  const confirm = h("input", { type: "checkbox" });

  const saveBtn = h("button", { class: "btn", type: "button" }, "Сохранить черновик");
  const enableBtn = h("button", { class: "btn primary", type: "button" }, "Включить профиль");

  saveBtn.addEventListener("click", async () => {
    try { const r = await api("/api/builder/save", { json: { fields: B.fields } }); toast("Черновик сохранён: " + r.file); }
    catch (e) { toast(e.message, "bad"); }
  });
  enableBtn.addEventListener("click", async () => {
    try {
      const r = await api("/api/builder/enable", { json: { fields: B.fields, confirmed: B.confirmed } });
      toast("Профиль включён: profiles/chips/" + r.file);
      S.builder = null; back();

  v.append(res, h("section", { class: "card" },

      h("small", { class: "muted", style: "display:block" }, "Без этого профиль не включится. Черновик можно сохранить в любой момент."))),
    h("div", { class: "row" }, saveBtn, enableBtn)));
  let timer = null;
  async function preview() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try {
        const r = await api("/api/builder/preview", { json: { fields: B.fields } });
        msgs.textContent = "";
        r.errors.forEach(t => msgs.append(h("div", { class: "msg e" }, t)));
        r.warnings.forEach(t => msgs.append(h("div", { class: "msg w" }, t)));
        r.hints.forEach(t => msgs.append(h("div", { class: "msg h" }, t)));
        if (!r.errors.length && !r.warnings.length) msgs.append(h("div", { class: "msg h" }, "Ошибок нет."));

        saveBtn.disabled = B.hasErrors;
        enableBtn.disabled = B.hasErrors || !B.confirmed;
      } catch (e) { msgs.textContent = e.message; }
    }, 300);
  }
  preview();
}

function setScale(x) {
  x = Math.max(0.8, Math.min(1.8, Math.round(x * 10) / 10));
  store.set("scale", x); applyPrefs();
}

function applyPrefs() {
  document.documentElement.style.setProperty("--scale", store.get("scale", 1));
  const t = themePref();
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* значок «копировать» (два листа) и «скопировано» (галочка) */
function copyIcon(done) {
  return sv("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2",
    "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" },
    done ? sv("path", { d: "M5 12.5l4.5 4.5L19 7.5" })
         : [sv("rect", { x: "9", y: "9", width: "11", height: "11", rx: "2" }), sv("path", { d: "M5 15V6a2 2 0 0 1 2-2h9" })]);
}

/* Команда и значок копирования рядом, а не поверх: текст виден целиком и выделяется пальцем по частям. */
function codeBox(code) {
  code = String(code).replace(/\s+$/, "");
  const btn = h("button", { class: "btn copy", type: "button", title: "Копировать", "aria-label": "Копировать команду" }, copyIcon(false));
  btn.addEventListener("click", async () => {
    const ok = await copyText(code);
    toast(ok ? "Скопировано" : "Не удалось скопировать — выделите текст вручную");
    if (!ok) return;
    btn.classList.add("done"); btn.replaceChildren(copyIcon(true));
    setTimeout(() => { btn.classList.remove("done"); btn.replaceChildren(copyIcon(false)); }, 1500);
  });
  return h("div", { class: "code" }, h("pre", {}, code), btn);
}

function replacePage(fn) { S.pages[S.pages.length - 1] = fn; render(); }

function msgList(box, r, okText) {
  box.textContent = "";
  (r.errors || []).forEach(t => box.append(h("div", { class: "msg e" }, t)));
  (r.warnings || []).forEach(t => box.append(h("div", { class: "msg w" }, t)));
  (r.hints || []).forEach(t => box.append(h("div", { class: "msg h" }, t)));
  if (!(r.errors || []).length && okText) box.append(h("div", { class: "msg h" }, okText));
}

/* Markdown → DOM: заголовки, абзацы, списки, таблицы, код, **жирный**, `код`, ссылки. Без innerHTML. */
function md(text) {
  const out = h("div", { class: "md" });
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  const LIST = /^\s*([-*]|\d+\.)\s+/;
  const inline = s => {
    const nodes = [], re = /(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)\s]+\))/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) nodes.push(s.slice(last, m.index));
      const t = m[0];
      if (t.startsWith("**")) nodes.push(h("b", {}, t.slice(2, -2)));
      else if (t.startsWith("`")) nodes.push(h("code", {}, t.slice(1, -1)));
      else {
        const mm = /\[([^\]]+)\]\(([^)\s]+)\)/.exec(t);
        nodes.push(/^https?:\/\//.test(mm[2]) ? h("a", { href: mm[2], target: "_blank", rel: "noopener" }, mm[1]) : mm[1]);
      }
      last = m.index + t.length;
    }
    if (last < s.length) nodes.push(s.slice(last));
    return nodes;
  };
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*```/.test(ln)) {
      const indent = ln.match(/^\s*/)[0].length, buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++].slice(indent));
      i++;
      out.append(codeBox(buf.join("\n")));
      continue;
    }
    const hm = /^(#{1,4})\s+(.*)$/.exec(ln);
    if (hm) { out.append(h(hm[1].length <= 1 ? "h2" : "h3", {}, inline(hm[2]))); i++; continue; }
    if (/^\s*\|/.test(ln)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++].trim());
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const table = h("table", {});
      rows.forEach((r, n) => {
        if (/^\|[\s:|-]+\|$/.test(r)) return;
        table.append(h("tr", {}, cells(r).map(c => h(n === 0 ? "th" : "td", {}, inline(c)))));
      });
      out.append(table);
      continue;
    }
    if (LIST.test(ln)) {
      const list = h(/^\s*\d+\./.test(ln) ? "ol" : "ul", {});
      while (i < lines.length && LIST.test(lines[i])) {
        const li = h("li", {}, inline(lines[i].replace(LIST, "")));
        i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !LIST.test(lines[i]) && !/^\s*```/.test(lines[i])) {
          li.append(" ", ...inline(lines[i].trim())); i++;
        }
        list.append(li);
      }
      out.append(list);
      continue;
    }
    if (!ln.trim()) { i++; continue; }
    const para = [ln.trim()];
    i++;
    while (i < lines.length && lines[i].trim() && !/^(\s*#|\s*```|\s*\|)/.test(lines[i]) && !LIST.test(lines[i])) para.push(lines[i++].trim());
    out.append(h("p", {}, inline(para.join(" "))));
  }
  return out;
}

function hoodBanner(st, onChange) {
  if (st.open) {
    return h("div", { class: "row muted", style: "margin:.2rem 0 .6rem" }, "✎ Капот открыт" + (st.permanent ? " (hood.edit: true)" : " до перезапуска"),
      st.local && !st.permanent ? h("button", { class: "btn small ghost", type: "button", onclick: () => setHood(false, onChange) }, "Закрыть") : null);
  }
  return h("div", { class: "msg w" }, "🔒 Капот закрыт — только просмотр. ",
    st.local ? h("button", { class: "btn small", type: "button", onclick: () => setHood(true, onChange) }, "Открыть до перезапуска")
      : "Открыть можно на экране самого прибора или hood.edit: true в config.yaml.");
}

async function setHood(open, onChange) {
  try { await api("/api/hood/unlock", { json: { open } }); toast(open ? "Капот открыт до перезапуска" : "Капот закрыт"); (onChange || render)(); }
  catch (e) { toast(e.message, "bad"); }
}

async function renderHelp(v, q, section) {
  const alive = liveCheck();
  v.append(backBtn());
  const input = h("input", { class: "in", type: "search", placeholder: "Поиск: диапазон, капот, прищепка…", value: q || "" });
  const list = h("div", { class: "opts" }, h("p", { class: "muted" }, "Загружаю…"));
  const addBtn = h("button", { class: "btn small", type: "button", onclick: newArticleModal }, "+ Статья");
  v.append(h("section", { class: "card" }, h("div", { class: "row", style: "justify-content:space-between" }, h("h1", {}, "Справка"), addBtn),
    input, h("div", { style: "margin-top:.8rem" }, list)));
  let timer = null;
  const load = async () => {
    try {
      const r = await api("/api/help?q=" + encodeURIComponent(input.value) + "&section=" + (section || ""));
      if (!alive()) return;
      list.textContent = "";
      if (!r.items.length) list.append(h("p", { class: "muted" }, "Ничего не нашлось."));
      for (const it of r.items) list.append(optButton(it.kind === "lesson"
        ? { label: it.title, explain: it.summary, lesson: it.lesson }
        : it.kind === "card" ? { label: it.title, explain: it.source + " · " + it.summary, action: "catalog", params: { card: it.card } }
        : { label: it.title, explain: it.summary || it.source, action: "help", params: { article: it.id } }));
    } catch (e) { list.textContent = e.message; }
  };
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(load, 250); });
  load();
}

async function renderArticle(v, id) {
  const alive = liveCheck();
  v.append(backBtn());
  const card = h("article", { class: "card" }, h("p", { class: "muted" }, "Загружаю…"));
  v.append(card);
  let a;
  try { a = await api("/api/help/article?id=" + encodeURIComponent(id)); } catch (e) { card.textContent = e.message; return; }
  if (!alive()) return;
  card.textContent = "";
  let body = a.text;
  if (/^#\s/.test(body)) body = body.replace(/^#\s+.*\n?/, "");
  card.append(h("h1", {}, a.title), md(body));

    h("span", { class: "muted", style: "flex:1" }, a.source),

    h("button", { class: "btn small ghost", type: "button", onclick: () => openPage(w => renderHelp(w, "", "")) }, "Вся справка")));
}

  card.textContent = "";
  card.append(h("div", { class: "row", style: "justify-content:space-between" }, h("h1", {}, "Капот"),
      h("button", { class: "btn small ghost", type: "button", onclick: () => openPage(w => renderArticle(w, "hood")) }, "?")),
    hoodBanner(r),
    h("div", { class: "seg wrap" }, r.areas.map(a => h("button", { type: "button", "aria-pressed": String(a.id === area),

async function renderEditor(v, path) {
  const alive = liveCheck();
  v.append(backBtn());
  let f;
  try { f = await api("/api/hood/file?path=" + encodeURIComponent(path)); } catch (e) { v.append(h("div", { class: "card" }, e.message)); return; }
  if (!alive()) return;
  const canEdit = f.mode === "edit" && f.open;
  const ta = h("textarea", { class: "in editor", spellcheck: "false", autocapitalize: "off", autocomplete: "off", wrap: "off", "aria-label": path });
  ta.value = f.text; ta.readOnly = !canEdit;
  ta.addEventListener("keydown", ev => {
    if (ev.key === "Tab" && !ta.readOnly && !ev.shiftKey) { ev.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); }
  });
  const msgs = h("div", {});
  const word = h("input", { class: "in", type: "text", autocomplete: "off", autocapitalize: "characters", spellcheck: "false",
    placeholder: "слово «" + (f.word || "ДА") + "»", style: "max-width:9rem;min-height:2.3rem", "aria-label": "Слово подтверждения" });
  const busy = async (btn, fn) => { btn.disabled = true; try { await fn(); } catch (e) { toast(e.message, "bad"); } btn.disabled = false; };
  const checkBtn = h("button", { class: "btn small", type: "button" }, "Проверить");
  checkBtn.addEventListener("click", () => busy(checkBtn, async () => msgList(msgs, await api("/api/hood/check", { json: { path, text: ta.value } }), "Проверка пройдена.")));
  const saveBtn = h("button", { class: "btn small primary", type: "button", hidden: !canEdit }, "Сохранить");
  saveBtn.addEventListener("click", () => busy(saveBtn, async () => {
    const r = await api("/api/hood/save", { json: { path, text: ta.value, word: word.value } });
    msgList(msgs, r, r.ok ? (r.unchanged ? "Без изменений." : "Сохранено. Прежняя версия — в истории.") : "");
    if (r.ok && !r.unchanged) { toast("Сохранено"); word.value = ""; }
  }));
  const card = h("section", { class: "card" }, h("h2", { class: "mono", style: "font-size:1rem;word-break:break-all" }, path));
  if (f.mode === "view") card.append(h("div", { class: "msg w" }, "🔒 Только просмотр: " + f.reason));
  else if (!f.open) card.append(hoodBanner({ open: false, local: S.hello && S.hello.local }, () => replacePage(w => renderEditor(w, path))));
  card.append(ta, h("div", { class: "row", style: "margin-top:.6rem" }, checkBtn,
    canEdit && f.needs_word ? word : null, saveBtn,
    h("button", { class: "btn small ghost", type: "button", onclick: () => openPage(w => renderHistory(w, path)) }, "История" + (f.versions ? " (" + f.versions + ")" : "")),
    h("button", { class: "btn small ghost", type: "button", onclick: () => openPage(w => renderArticle(w, "hood")) }, "?")), msgs);
  v.append(card);
}

async function renderHistory(v, path) {
  const alive = liveCheck();
  v.append(backBtn());
  const card = h("section", { class: "card" }, h("h2", {}, "История"), h("p", { class: "mono muted" }, path));
  v.append(card);
  let r;
  try { r = await api("/api/hood/history?path=" + encodeURIComponent(path)); } catch (e) { card.append(e.message); return; }
  if (!alive()) return;
  const list = h("div", { class: "list" });
  if (!r.items.length) list.append(h("p", { class: "muted" }, "Правок через капот ещё не было."));
  for (const it of r.items) list.append(h("button", { class: "item", type: "button", onclick: () => openPage(w => renderVersion(w, path, it)) },
    it.ts + " · " + it.note, h("small", {}, (it.actor ? it.actor + " · " : "") + it.sha.slice(0, 12) + (it.good ? " · проверена" : ""))));
  card.append(list);
}

async function renderVersion(v, path, it) {
  v.append(backBtn());
  let r;
  try { r = await api("/api/hood/version?path=" + encodeURIComponent(path) + "&v=" + encodeURIComponent(it.vid)); } catch (e) { v.append(e.message); return; }
  const word = h("input", { class: "in", type: "text", autocomplete: "off", placeholder: "слово «ДА»", style: "max-width:9rem;min-height:2.3rem" });
  const msgs = h("div", {});
  const btn = h("button", { class: "btn small primary", type: "button" }, "Вернуть эту версию");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      const res = await api("/api/hood/restore", { json: { path, v: it.vid, word: word.value } });
      msgList(msgs, res, res.ok ? "Версия возвращена. Текущая — в истории." : "");
      if (res.ok) toast("Версия возвращена");
    } catch (e) { toast(e.message, "bad"); }
    btn.disabled = false;
  });
  const ta = h("textarea", { class: "in editor", readonly: true, wrap: "off" }); ta.value = r.text;
  v.append(h("section", { class: "card" }, h("h2", {}, it.ts + " · " + it.note), ta,
    h("div", { class: "row", style: "margin-top:.6rem" }, word, btn), msgs));
}

async function renderTune(v, sid) {
  const alive = liveCheck();
  v.append(backBtn());
  const card = h("section", { class: "card" }, h("h1", {}, "Изменить параметры"), h("p", { class: "muted" }, "Загружаю…"));
  v.append(card);
  let d;
  try { d = await api("/api/params?sim=" + (S.sim ? 1 : 0) + (sid ? "&session=" + sid : "")); }
  catch (e) {
    card.lastChild.textContent = e.message;
    card.append(h("button", { class: "btn primary", type: "button", onclick: () => go({ action: "params" }) }, "Прочитать параметры"));
    return;
  }
  if (!alive()) return;
  card.textContent = "";
  card.append(h("h1", {}, d.profile_name), h("p", { class: "muted" }, "Значения из сеанса №" + d.session + " (" + d.ts + ")" +
    (d.verified ? "" : " — чтения НЕ совпали") + ". Перед записью Дирижёр прочитает прибор заново."));
  const wanted = {};
  const box = h("div", { class: "params" });
  for (const p of d.params) {
    const row = h("div", { class: "prow" });
    const label = h("div", {}, h("b", {}, p.title), h("small", {}, [p.min != null || p.max != null ? (p.min ?? "…") + " … " + (p.max ?? "…") + " " + p.unit : "", p.help].filter(Boolean).join(" · ")));
    let ctl;
    if (!p.writable) ctl = h("div", { class: "ro" }, p.text);
    else if (Object.keys(p.choices).length) {
      ctl = h("select", { class: "in" }, Object.entries(p.choices).map(([k, t]) => h("option", { value: k }, t)));
      ctl.value = String(p.value);
    } else {
      ctl = h("input", { class: "in", type: "text", inputmode: "decimal", value: p.value == null ? "" : String(p.value) });
    }
    if (p.writable) ctl.addEventListener("input", () => {
      const val = ctl.value.trim();
      if (val !== String(p.value) && val !== "") wanted[p.id] = val; else delete wanted[p.id];
      row.classList.toggle("changed", p.id in wanted);
    });
    row.append(label, ctl); box.append(row);
  }
  const start = dry => {
    if (!Object.keys(wanted).length) return toast("Ничего не изменено", "bad");
    doAction("tune", { set: Object.assign({}, wanted), dry_run: dry || null });
  };
  card.append(box, h("div", { class: "row", style: "margin-top:1rem" },
    h("button", { class: "btn", type: "button", onclick: () => start(true) }, "План без записи"),
    h("button", { class: "btn primary", type: "button", onclick: () => start(false) }, "Записать…"),
    h("button", { class: "btn ghost", type: "button", onclick: () => go({ action: "params" }) }, "Прочитать заново")));
}

/* =====================================================================
   Самопроверка и «что помогло»
   ===================================================================== */
async function renderDoctor(v) {
  const alive = liveCheck();
  v.append(backBtn());
  const card = h("section", { class: "card" }, h("div", { class: "row", style: "justify-content:space-between" }, h("h1", {}, "Самопроверка"),
    h("button", { class: "btn small ghost", type: "button", onclick: () => openPage(w => renderArticle(w, "doctor")) }, "?")),
    h("p", { class: "muted" }, "Сверяю копии, память, профили, навыки и Штурман…"));
  v.append(card);
  let r;
  try { r = await api("/api/doctor?sim=" + (S.sim ? 1 : 0)); } catch (e) { card.lastChild.textContent = e.message; return; }
  if (!alive()) return;
  card.lastChild.remove();
  const marks = { bad: "✖", warn: "⚠", info: "·" };
  if (!r.items.length) card.append(h("div", { class: "msg h" }, "✔ Всё в порядке."));
  for (const it of r.items) {
    const msgs = h("div", {});
    const fix = it.heal ? h("button", { class: "btn small primary", type: "button" }, "Исправить") : null;
    if (fix) fix.addEventListener("click", async () => {
      let word = null;
      if (it.id.startsWith("file:")) {
        word = await promptText("Слово подтверждения", "Вернуть рабочую версию файла из истории капота. Код и профили — только после слова «ДА».", "ДА");
        if (word === null) return;
      }
      fix.disabled = true;
      try {
        const res = await api("/api/doctor/heal", { json: { id: it.id, sim: S.sim, word } });
        msgs.textContent = ""; res.done.forEach(t => msgs.append(h("div", { class: "msg h" }, "✔ " + t)));
        toast("Исправлено");
      } catch (e) { msgs.textContent = ""; msgs.append(h("div", { class: "msg e" }, e.message)); fix.disabled = false; }
    });
    card.append(h("div", { style: "padding:.5rem 0;border-bottom:1px solid var(--line)" },
      h("div", {}, h("span", { class: "lvl " + it.level }, marks[it.level] || "·"), h("b", {}, it.title)),
      it.detail ? h("div", { class: "muted", style: "font-size:.88rem" }, it.detail) : null,
      it.heal ? h("div", { class: "row", style: "margin-top:.3rem" }, h("small", { class: "muted", style: "flex:1" }, it.heal), fix) : null, msgs));
  }
  card.append(h("div", { class: "row", style: "margin-top:.8rem" }, h("button", { class: "btn small", type: "button", onclick: () => replacePage(renderDoctor) }, "Проверить ещё раз")));
}

async function fixModal(sid, fixId) {
  if (sid == null) return;
  try {
    if (fixId != null) {
      await api("/api/fix", { json: { session: sid, fix: fixId, sim: S.sim } });
      return toast("Отмечено: подсказка помогла снова — она поднимется выше");
    }
    const text = await promptText("Что помогло?", "Одна фраза для следующего раза — например «переставил прищепку: вывод 1 был не там».", "");

}

const WIRE = { red: "#ff5a5f", black: "#2b2f36", orange: "#ff9f43", yellow: "#ffd43b", green: "#3ddc84",

const ICONS = {

  probe: "M14 3l7 7-4 4-7-7zM10 7l-5.5 5.5 3 3L13 10M3 21l2.5-2.5",
  cable: "M3 5h5v5H3zM16 14h5v5h-5zM8 7.5c7 0 1 9 8 9",
  socket: "M5 3h14v18H5zM8 6.5h2M8 10h2M8 13.5h2M8 17h2M14 6.5h2M14 10h2M14 13.5h2M14 17h2",
  scope: "M3 5h18v14H3zM5 15l3-6 3 6 3-6 3 6 2-3",

  wave: "M2 12c2-5 4-5 6 0s4 5 6 0 4-5 6 0 2 2 2 2",

async function busyBtn(btn, fn) { btn.disabled = true; try { await fn(); } catch (e) { toast(e.message, "bad"); } btn.disabled = false; }
const SVGNS = "http://www.w3.org/2000/svg";

function sv(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}

function cardIcon(card, big) {
  const svg = sv("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "1.8",
    "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" }, sv("path", { d: ICONS[card.icon] || ICONS.code }));
  return h("span", { class: "ic " + card.kind + (big ? " big" : "") }, svg);
}

/* Рисунок тянется по ширине экрана, но не крупнее чем в полтора раза — иначе на ПК гребёнка «во весь экран». */
function fitStyle(w) { return "max-width:" + Math.round(w * 1.5) + "px;margin:0 auto"; }

function swatch(color) { return h("span", { class: "sw", style: "background:" + (WIRE[color] || WIRE.gray) }); }

function figure(title, body, caption) {
  return h("figure", { class: "fig" }, title ? h("div", { class: "fig-title" }, title) : null, body,
    caption ? h("figcaption", {}, caption) : null);
}

/* Провода: слева выводы переходника, справа — устройства; провод своего цвета, подписи по краям. */
function drawWiring(d) {
  const n = d.wires.length, rowH = 30, top = 34, W = 380, bw = 132;
  const H = top + n * rowH + 6;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, style: fitStyle(W), role: "img", "aria-label": (d.title || "Подключение") + ": " +
    d.wires.map(w => w.a + " к " + w.b).join(", ") });
  svg.append(sv("text", { x: 8, y: 18, class: "fh" }, d.a_title || "Откуда"),
    sv("text", { x: W - 8, y: 18, "text-anchor": "end", class: "fh" }, d.b_title || "Куда"),
    sv("rect", { x: 4, y: top - 6, width: bw, height: n * rowH, rx: 9, class: "body" }),
    sv("rect", { x: W - 4 - bw, y: top - 6, width: bw, height: n * rowH, rx: 9, class: "body" }));
  const x1 = 4 + bw, x2 = W - 4 - bw;
  d.wires.forEach((w, i) => {
    const y = top - 6 + i * rowH + rowH / 2, col = WIRE[w.color] || WIRE.gray;
    svg.append(
      sv("path", { d: `M${x1} ${y} H${x2}`, stroke: "var(--muted)", "stroke-opacity": ".35", "stroke-width": 7, "stroke-linecap": "round" }),
      sv("path", { d: `M${x1} ${y} H${x2}`, stroke: col, "stroke-width": 4.5, "stroke-linecap": "round" }),
      sv("circle", { cx: x1, cy: y, r: 4.5, fill: col, stroke: "var(--muted)", "stroke-width": ".8" }),
      sv("circle", { cx: x2, cy: y, r: 4.5, fill: col, stroke: "var(--muted)", "stroke-width": ".8" }),
      sv("text", { x: 12, y: y + 4 }, w.a.length > 17 ? w.a.slice(0, 16) + "…" : w.a),
      sv("text", { x: W - 12, y: y + 4, "text-anchor": "end" }, w.b.length > 17 ? w.b.slice(0, 16) + "…" : w.b));
  });
  const noted = d.wires.filter(w => w.note);
  const notes = noted.length ? h("ul", { class: "marks dot", style: "margin-top:.5rem" }, noted.map(w => h("li", {},
    swatch(w.color), h("b", {}, w.a + " → " + w.b), " — " + w.note))) : null;
  const table = h("details", { class: "yaml" }, h("summary", {}, "Провода списком (с названиями цветов)"),
    h("table", { class: "wires" }, d.wires.map(w => h("tr", {},
      h("td", { class: "mono" }, swatch(w.color), WIRE_RU[w.color] || ""),
      h("td", {}, h("b", {}, w.a), " → ", h("b", {}, w.b)),
      h("td", { class: "muted" }, w.note || "")))));
  return figure(d.title || "Подключение", [svg, notes, table], d.caption);
}

/* Корпус сверху: выводы против часовой стрелки от 1-го, точка — вывод 1. */
function drawPackage(d) {
  const pins = d.pins, n = pins.length, half = n / 2, pitch = 26, W = 340, bodyW = 112;
  const bodyX = (W - bodyW) / 2, top = 10, H = top * 2 + half * pitch;
  const mark = d.mark || {};
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, style: fitStyle(W), role: "img", "aria-label": (d.title || "Корпус") + ": " +
    pins.map((p, i) => (i + 1) + " " + p).join(", ") });
  svg.append(sv("rect", { x: bodyX, y: top, width: bodyW, height: half * pitch, rx: d.style === "dip" ? 5 : 8, class: "body" }));
  if (d.style === "dip") svg.append(sv("path", { d: `M${W / 2 - 10} ${top} a10 10 0 0 0 20 0`, class: "body" }));
  for (let i = 0; i < half; i++) {
    const y = top + i * pitch + pitch / 2;
    const left = pins[i], right = pins[n - 1 - i];
    const lc = mark[left] ? WIRE[mark[left]] : null, rc = mark[right] ? WIRE[mark[right]] : null;
    svg.append(
      sv("rect", { x: bodyX - 18, y: y - 4.5, width: 18, height: 9, rx: 2, fill: lc || null, class: lc ? null : "leg-free" }),
      sv("rect", { x: bodyX + bodyW, y: y - 4.5, width: 18, height: 9, rx: 2, fill: rc || null, class: rc ? null : "leg-free" }),
      sv("text", { x: bodyX + 8, y: y + 4, class: "sm" }, i + 1),
      sv("text", { x: bodyX + bodyW - 8, y: y + 4, "text-anchor": "end", class: "sm" }, n - i),
      sv("text", { x: bodyX - 24, y: y + 4, "text-anchor": "end" }, left),
      sv("text", { x: bodyX + bodyW + 24, y: y + 4 }, right));
  }
  svg.append(sv("circle", { cx: bodyX + 26, cy: top + pitch / 2, r: 4.5, class: "p1" }));
  return figure(d.title || "Корпус", svg, d.caption || "Вид сверху. Точка — вывод 1, дальше против часовой стрелки.");
}

/* Гребёнка: в 2 ряда нечётные выводы сверху; задействованные — цветом, вывод 1 — квадрат. */
function drawHeader(d) {
  const count = d.count, rows = d.rows || 2, cols = count / rows;
  const pitch = Math.max(14, Math.min(30, 340 / cols)), W = cols * pitch + 20, H = rows * pitch + 32;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, style: fitStyle(W), role: "img", "aria-label": d.title || "Выводы" });
  svg.append(sv("rect", { x: 6, y: 14, width: W - 12, height: rows * pitch + 4, rx: 6, class: "body" }));
  for (let k = 1; k <= count; k++) {
    const col = rows === 2 ? Math.floor((k - 1) / 2) : k - 1, row = rows === 2 ? (k - 1) % 2 : 0;
    const x = 10 + col * pitch + pitch / 2, y = 16 + row * pitch + pitch / 2;
    const spec = d.pins[String(k)];
    const r = pitch * (spec ? 0.36 : 0.2);
    if (k === 1) svg.append(sv("rect", { x: x - pitch * 0.42, y: y - pitch * 0.42, width: pitch * 0.84, height: pitch * 0.84, fill: "none", stroke: "var(--accent)", "stroke-width": 1.4 }));
    svg.append(spec ? sv("circle", { cx: x, cy: y, r, fill: WIRE[spec.color] || WIRE.gray, stroke: "var(--muted)", "stroke-width": ".8" })
      : sv("circle", { cx: x, cy: y, r, class: "pin-free" }));
    if (spec || k === 1 || k === count) {
      const ty = rows === 2 && row === 1 ? H - 3 : 11;
      svg.append(sv("text", { x, y: ty, "text-anchor": "middle", class: "sm" }, k));
    }
  }
  const legend = h("table", { class: "wires" }, Object.entries(d.pins).sort((a, b) => a[0] - b[0]).map(([num, p]) => h("tr", {},
    h("td", { class: "mono" }, swatch(p.color), num), h("td", {}, h("b", {}, p.label)), h("td", { class: "muted" }, p.to ? "→ " + p.to : ""))));
  return figure(d.title || "Выводы", [svg, legend], d.caption);
}

function chainEl(steps, onPick) {
  const box = h("div", { class: "chain" });
  steps.forEach((s, i) => {
    if (i) box.append(h("span", { class: "arr", "aria-hidden": "true" }, "→"));
    if (s.items) {                      // варианты на выбор — одно звено, не цепочка
      box.append(h("div", { class: "lnk alt" }, h("small", {}, s.sub || "на выбор"), h("span", { class: "alts" },
        s.items.map(it => onPick && it.card ? h("button", { class: "chip pick", type: "button", onclick: () => onPick(it.card) }, it.title)
          : h("span", { class: "chip" }, it.title)))));
      return;
    }
    const kids = [h("b", {}, s.title), s.sub ? h("small", {}, s.sub) : null];
    box.append(s.card && onPick ? h("button", { class: "lnk", type: "button", onclick: () => onPick(s.card) }, kids)
      : h("div", { class: "lnk" + (s.core ? " core" : "") }, kids));
  });
  return box;
}

function drawing(d) {
  if (d.type === "wiring") return drawWiring(d);
  if (d.type === "package") return drawPackage(d);
  if (d.type === "header") return drawHeader(d);
  if (d.type === "chain") return figure(d.title || "Что к чему", chainEl(d.steps), d.caption);
  return null;
}

function cardChips(c) {

function cardTile(c) {

function marks(cls, items) { return items && items.length ? h("ul", { class: "marks " + cls }, items.map(t => h("li", {}, t))) : null; }

/* Тело карточки — общее для страницы карточки и предпросмотра в конструкторе. */
function cardBody(c, rel) {
  const out = [];
  out.push(h("div", { class: "card-head" }, cardIcon(c, true), h("div", {}, h("h1", {}, c.title), h("div", { class: "muted" }, c.tagline))));

    out.push(sec("Как работает сам", stepList(c.how)));
    out.push(sec("Как работает в Дирижёре", marks("dot", c.in_dirizher), draws,

    out.push(sec("Установка", c.install ? codeBox(c.install) : null));
    out.push(sec("Авторы", h("div", { class: "authors" }, c.authors.map(a => h("div", { class: "author" },

const TRANSLIT = { а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "e", ж: "zh", з: "z", и: "i", й: "y", к: "k", л: "l", м: "m",
  н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f", х: "h", ц: "c", ч: "ch", ш: "sh", щ: "sch", ъ: "", ы: "y", ь: "",
  э: "e", ю: "yu", я: "ya" };
function slugId(title) {
  let t = String(title || "").toLowerCase().split("").map(ch => TRANSLIT[ch] !== undefined ? TRANSLIT[ch] : ch).join("");
  t = t.replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40).replace(/_+$/, "");
  if (t && !/^[a-z]/.test(t)) t = "x_" + t;
  return t;
}

}

      field("in_dirizher", "Как работает в Дирижёре", "лезвие, что только читает, что запрещено", { area: true }),
      select("plugin", "Лезвие", [["", "— нет —"]].concat(cat.plugins.map(p => [p, p]))),
      field("program", "Программа в PATH", "по ней видно «установлена»", { raw: true }), field("install", "Установка", "команда", { raw: true }),
      field("examples", "Примеры", "по строке: «команда # пояснение»", { area: true, raw: true }),
      checks("adapters", "Какие переходники нужны", cat.adapters));
  }
  form.append(field("caution", "Осторожно", "что опасно — по строке", { area: true }),
    field("verify", "Проверить на железе", "что вы ещё не проверили — по строке", { area: true }));
  const saveBtn = h("button", { class: "btn primary", type: "button" }, "Сохранить карточку");
  const tplBtn = h("button", { class: "btn small ghost", type: "button" }, "Пустой шаблон YAML → капот");
  saveBtn.addEventListener("click", () => busyBtn(saveBtn, async () => {
    try {
      const r = await api("/api/catalog/new", { json: { fields: F } });
      toast("Карточка сохранена: " + r.open); S.cb = null; S.cat = null;
      replacePage(w => renderCard(w, r.id));
    } catch (e) { toast(e.message, "bad"); }
  }));
  tplBtn.addEventListener("click", () => busyBtn(tplBtn, async () => {
    try {
      const r = await api("/api/catalog/new", { json: { template: true, kind: F.kind, id: F.id, title: F.title } });
      toast("Создано из шаблона"); S.cb = null; S.cat = null; replacePage(w => renderEditor(w, r.open));
    } catch (e) { toast(e.message, "bad"); }
  }));
  const hoodBox = h("div", {}, hoodBanner(cat.hood, () => { S.cat = null; replacePage(w => renderCardBuilder(w, F.kind)); }));
  form.append(msgs, hoodBox, h("div", { class: "row", style: "margin-top:.6rem" }, saveBtn, tplBtn), yamlBox);
  v.append(form, h("section", { class: "card" }, h("h2", {}, "Так будет выглядеть"), preview));
  doPreview();
}

/* =====================================================================
   Запуск
   ===================================================================== */
async function boot() {
  applyPrefs();
  if (!emojiSupported()) document.body.classList.add("noemoji");
  for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => showTab(b.dataset.tab));
  $("#mode").addEventListener("click", () => { setSim(!S.sim, true); render(); });
  $("#helpBtn").addEventListener("click", () => openPage(v => renderHelp(v, "", S.tab)));
  $("#hoodBtn").addEventListener("click", () => openPage(v => renderHood(v, S.tab)));
  for (;;) {
    try { S.hello = await api("/api/hello", { noLogin: true }); break; }
    catch (e) { $("#view").textContent = "Нет связи с прибором. Проверяю снова…"; await sleep(3000); }
  }
  if (S.hello.demo) {
    const bar = $("#demoBar");
    bar.textContent = S.hello.demo_text || "Демо: железа нет, задания показаны по записи на симуляторе.";
    bar.hidden = false;
  }
  const saved = store.get("sim", null);
  setSim(saved === null ? S.hello.sim_default : saved, false);
  if (!S.hello.authed) await ensureLogin();
  S.guide = await api("/api/guide");
  S.node = S.guide.start;
  const st = await api("/api/job");
  applyJob(st.job);
  showTab(st.job && st.job.running ? "work" : S.tab);   // вкладку, выбранную во время загрузки, не перебиваем
  if (st.job && st.job.running) poll();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.job && !S.job.done) poll(); });
}
boot();
</script>
