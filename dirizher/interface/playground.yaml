        url: https://www.bios-mods.com/forum/Thread-Acer-Swift-3-SF314-42-Need-help-programming-Acer-laptop-BIOS-chip?pid=179169
      - title: "W25Q128FW: питание 1,65–1,95 В"
        url: https://www.alldatasheet.net/datasheet-pdf/pdf/1179112/WINBOND/W25Q128FW.html
    steps:
      - title: Почему ноутбук — хорошая мишень
        text: |-
          На плате ноутбука есть SPI-флешка с [[BIOS]] — тот же класс чипов, что учебная W25Q64. Значит, Дирижёр с ним уже умеет работать.

          Но ноутбук сложнее и ценнее. Чип у разных Swift 3 разный:
          - SF315-51G — GD25Q64, 8 МБ, 3,3 В;
          - SF314-42 — XM25QU128, 16 МБ, 1,8 В.

          Поэтому начинаем не с паяльника, а с маркировки.
        verify: Напряжение каждого чипа — по даташиту вашей маркировки.

      - title: Модель и серийный номер
        text: |-
          С наклейки на дне перепишите модель (SF314-… или SF315-…) и серийный номер (S/N). Сфотографируйте наклейку.
        why: По модели ищется чип и сведения на форумах. S/N понадобится, чтобы найти уникальные данные в дампе.
        tick:
          - Модель записана
          - S/N записан

      - title: Почему он сломан?
        text: |-
          BIOS виноват редко. Подозреваем его, если:
          - ноутбук умер сразу после обновления BIOS;
          - кулер крутится, индикаторы горят, а изображения нет.

          Нет признаков жизни вообще — сначала мультиметром блок питания и вход. Для учёбы ноутбук годится в любом случае: прочитать чип можно, даже если остальная плата неисправна.
        quiz:
          ask: Индикатор зарядки не горит, кнопка ни на что не реагирует. С чего начать?
          options:
            - text: С питания — зарядник, штекер, вход на плате
              ok: true
              say: Да. «Мёртвый» ноутбук без питания — не проблема прошивки.
            - text: Сразу перепрошить BIOS
              say: Если не доказано, что виноват BIOS, запись только добавит проблем.

      - title: Разборка
        text: |-
          1. Выкрутить винты дна. Разложить их на листе бумаги так же, как они стояли.
          2. Пластиковой лопаткой отщёлкнуть крышку.
          3. **Первым делом — отключить разъём аккумулятора.**
          4. Фото каждого шага.
        warn: Литиевый аккумулятор, замкнутый отвёрткой или щупом, может загореться. Пока он подключён, плата под напряжением.

      - title: Найти микросхему BIOS
        text: |-
          Ищите восьминогий чип с маркировкой «25…» на 64 или 128 Мбит. Таких может быть несколько: например, на SF314-42 рядом стоит маленький 25X20 — это не BIOS.
          - [[SOIC-8]] — ножки по бокам: прищепка подойдёт.
          - [[WSON-8]] — плоский, без ножек: прищепка не сядет, только выпаивать.
        quiz:
          ask: Нашли два чипа — 25Q128 и 25X20. Где BIOS?
          options:
            - text: 25Q128 — 128 Мбит, 16 МБ
              ok: true
              say: Да. 25X20 — всего 2 Мбит, для BIOS слишком мал.
            - text: 25X20
              say: 2 Мбит — это 256 КБ. Современный BIOS в него не влезет.

      - title: Даташит и напряжение
        text: |-
          Найдите [[даташит]] по маркировке и сверьте с замером на выводе 8. Подсказка: буква W или U в названии часто означает 1,8 В — например, W25Q128FW работает от 1,65 до 1,95 В.
          - 1,8 В — только через [[переходник 1,8 В]] и `programmer_voltage: 1.8`.
          - 3,3 В — напрямую.
        console:
          ask: Что будет, если забыть про переходник?
          cases:
            - label: Чип 1,8 В, программатор на 3,3 В
              check: voltage
              lines:
                - "[2/7] Опознание (только чтение идентификаторов)"
                - "~✔ профиль: (ваш профиль чипа, 16 МБ, 1.8 В)"
                - "[3/7] Совместимость по напряжению"
                - "✖ чип рассчитан на 1.8 В, а адаптер — на 3.3 В. Работа остановлена, чтобы не повредить чип: нужен переходник на 1.8 В (и смените programmer_voltage в config.yaml — общий или у плагина)."
              result: Дирижёр остановит работу до чтения — но только если в профиле записано верное напряжение. Поэтому профиль делается по даташиту.

      - title: Свой профиль чипа
        text: |-
          Готовых профилей под GD25Q64 и 128-мегабитные чипы нет. Сделайте свой в конструкторе — это ваш первый собственный профиль.
          - id и название — латиницей и по маркировке;
          - JEDEC ID — из `detect`;
          - напряжение — по даташиту;
          - объём — 8 МБ = 8388608 байт, 16 МБ = 16777216 байт.

          Профиль включится только после галочки «сверил с даташитом».
        dirizher: Штурман → «Развивать Дирижёр» → урок «Новый чип за 5 минут» → «Открыть конструктор профиля».
        quiz:
          ask: Сколько байт в 16 МБ?
          options:
            - text: "16 777 216"
              ok: true
              say: Да, 16 × 1024 × 1024. Дирижёр сверяет размер образа с размером чипа побайтно.
            - text: "16 000 000"
              say: Это «маркетинговые» мегабайты. В памяти считают по 1024.

      - title: Чтение
        text: |-
          `detect` → `run --dry-run --label "acer-SF314-…"` — сначала [[dry-run|пробный режим]].

          Если на плате чип не опознаётся или чтения не совпадают — программатор питает всю плату, и процессор мешает. Тогда выпаивать, но только после тренировки на доноре (маршрут «Паяльник»).
        code: |-
          python3 -m dirizher detect
          python3 -m dirizher run --dry-run --label "acer-SF314-xx"
        verify: Для 16 МБ таймауты 900 / 1800 с могут не подойти. Засеките время 8 МБ на учебном чипе; если не хватает — увеличьте read_timeout в config.yaml → plugins → flashrom_spi.

      - title: Разбор дампа
        text: |-
          Выгрузите [[копия «до»|копию «до»]] файлом — это обычный [[дамп]] — и поищите в нём серийный номер с наклейки — `grep -abo` покажет смещение.

          Так же ищутся UUID и ключ Windows (таблица ACPI MSDM). Найденные места — в раздел [[preserve]] профиля платы.

          [[binwalk]] покажет, что лежит внутри. Названия сигнатур с настоящего дампа — для проверки binwalk_expect.
        code: |-
          python3 -m dirizher export N --kind before --to ~/acer.bin
          grep -abo "ВАШ_S/N" ~/acer.bin
          binwalk ~/acer.bin | head -30
        verify: Смещения уникальных данных у каждой модели свои — найти по своему дампу.

      - title: Файл с сайта Acer — не дамп
        text: |-
          Файл обновления BIOS с сайта производителя — это не полный образ микросхемы. В нём только часть разделов, обёрнутых в программу обновления. Владелец SF315-51G писал официальные файлы прямо в чип — ноутбук не ожил.

          Дирижёр заблокирует запись, если размер образа не равен размеру чипа.
        quiz:
          ask: Вы скачали BIOS с сайта Acer, файл 9 МБ, чип 16 МБ. Что скажет Дирижёр?
          options:
            - text: Запишет, а остаток заполнит
              say: Нет — дописывать «остаток» Дирижёр не будет.
            - text: Заблокирует — размер образа не равен размеру чипа
              ok: true
              say: Да. Для записи нужен полный образ всей микросхемы.

      - title: Когда писать
        text: |-
          Запись — не цель учёбы. Пишем, только если:
          - доказано, что виноват BIOS;
          - есть полный образ именно этой платы;
          - копия «до» сохранена и проверена.

          Пароль BIOS и защиты Intel/AMD (Boot Guard и др.) не обходим — это принцип 12.
        why: Копия «до» с ноутбука остаётся с вами навсегда, даже если ноутбук так и не оживёт. Это уже ценный результат.

  # =====================================================================
  - id: car
    icon: "🚗"
    title: Лада Гранта
    tagline: диагностика только чтением — ELM327, OpenDiag как эталон, свои команды с Pi
    level: 4
    minutes: 60
    needs:
      - адаптер ELM327 (Bluetooth для телефона или USB для Pi)
      - мультиметр
      - машина на стоянке
    learn:
      - как устроен разъём OBD-II и линии связи
      - как читать ошибки и данные, ничего не меняя
      - как сверять свой инструмент с чужим «эталоном»
    next: [combos, limits]
    links:
      - title: "ЭБУ М74 CAN без K-Line"
        url: https://www.drive2.ru/b/2349134/
      - title: "OpenDiag: работа с ELM327"
        url: https://www.rustore.ru/catalog/app/ru.spb.OpenDiag
      - title: Распиновка разъёма OBD-II
        url: https://izoteh.perm.ru/GoodsRes/89427_559.pdf
      - title: "ELM327-emulator (лицензия CC-BY-NC-SA-4.0)"
        url: https://github.com/Ircama/ELM327-emulator
    steps:
      - title: Что можно и чего нельзя
        text: |-
          Машина — тренажёр диагностики **только чтением**. Прошивку [[ЭБУ]] не трогаем: машина одна, ошибка записи = эвакуатор.

          Работаем на стоянке: зажигание включено, двигатель заглушён (или работает — для замеров «на ходу» без движения).
        quiz:
          ask: Что из этого — учебная задача на машине?
          options:
            - text: Прочитать ошибки и VIN
              ok: true
              say: Да. Это чтение — ничего не меняет.
            - text: Прошить ЭБУ «для мощности»
              say: Нет. Это запись в единственный блок — и не ремонт.
            - text: Поправить пробег
              say: Нет. Это подделка — вне задач проекта.

      - title: Узнать свой ЭБУ
        text: |-
          Модель блока — на его наклейке или в диагностической программе. На Грантах разных лет стоят разные: М74, М74 CAN, М86 и другие.

          От модели зависит линия связи: [[K-Line]] или [[CAN]]. Например, в ЭБУ М74 CAN нет K-Line — диагностика идёт по CAN.
        verify: Модель ЭБУ и линию связи — проверить на своей машине.

      - title: Замер на разъёме
        text: |-
          Найдите разъём [[OBD-II]] по руководству к машине. Перед тем как вставить адаптер — мультиметр: вывод 16 относительно 4 — напряжение аккумулятора.
        tick:
          - Разъём найден
          - На 16-м — около 12 В

      - title: Эталон для сверки — телефон и ELM327
        text: |-
          1. [[ELM327]] Bluetooth — в разъём, зажигание включить.
          2. OpenDiag Mobile: тип ЭБУ, VIN, ошибки, текущие величины.
          3. Скриншоты — это эталон. С ним будем сверять свой инструмент, как карту Modbus сверяют с экраном прибора.

          OpenDiag рассчитан на оригинальные ELM327 — часть китайских копий умеет не всё.
        quiz:
          ask: OpenDiag показал ошибку. Когда её стирать?
          options:
            - text: Когда понял причину и устранил её — и через приложение
              ok: true
              say: Да. Стёртая без причины ошибка просто вернётся.
            - text: Сразу — чтобы лампа погасла
              say: Лампа погаснет, а причина останется.

      - title: Свои команды с Pi
        text: |-
          ELM327 USB → Pi. Откройте терминал порта и поговорите с адаптером сами. Каждую команду можно понять:
          - `ATZ` — сброс адаптера;
          - `ATI` — его версия;
          - `ATSP0` — подобрать протокол автоматически;
          - `0100` — какие величины поддерживает блок;
          - `0902` — VIN;
          - `03` — коды ошибок.

          Команду `04` (стереть ошибки) не отправляем — это запись.
        code: screen /dev/ttyUSB0 38400
        verify: Скорость порта у адаптеров разная, а ЭБУ ВАЗ могут отвечать не на все стандартные запросы OBD-II — проверить на своей машине.
        quiz:
          ask: Какую команду не отправляем вручную?
          options:
            - text: "04"
              ok: true
              say: Да — она стирает ошибки, то есть пишет в блок.
            - text: "0902"
              say: Это только чтение VIN.
            - text: ATI
              say: Это вопрос к самому адаптеру, а не к машине.

      - title: Свой модуль диагностики (цель разработки)
        text: |-
          Следующий шаг — отдельная сессия разработки: модуль `dirizher.extras.obd` по образцу «замера» sigrok.
          - **Только чтение:** версия адаптера, протокол, VIN, коды ошибок — всё в журнал сеанса.
          - **Не лезвие:** лезвие читает образ памяти, а живые величины меняются каждую секунду и ломают сверку повторных чтений.
          - **Тест без машины** — свой маленький эмулятор ELM327, как эмулятор Modbus в tests/fakes.
        why: Готовый ELM327-emulator годится для ручной сверки, но в тесты репозитория его не кладём — внешняя зависимость и некоммерческая лицензия.

      - title: Raspberry Pi в машине
        text: |-
          - Питание — автомобильный адаптер 12 → 5 В с запасом по току для вашей модели Pi.
          - Pi включать после пуска двигателя: при работе стартера напряжение проседает и может перезагрузить Pi.
          - Телефон — экран, Pi раздаёт сеть DIRIZHER.
        verify: Ток адаптера для своей модели Pi — проверить по её требованиям.

  # =====================================================================
  - id: tv
    icon: "📺"
    title: Телевизор LG
    tagline: рабочий ТВ не вскрываем — RS-232C как тренажёр настройки, донорские платы для EEPROM
    level: 5
    minutes: 60
    needs:
      - для RS-232C — переходник USB–RS-232 (если разъём есть)
      - для доноров — неисправная плата ТВ, Bus Pirate 5 или T48
    learn:
      - чем EEPROM отличается от SPI-флешки и eMMC
      - безопасная настройка «было → стало → ДА → откат»
      - как выбирать донорскую плату
    next: [combos, shop]
    steps:
      - title: Рабочий телевизор не вскрываем
        text: |-
          В блоке питания телевизора — сетевое напряжение, а конденсаторы держат заряд и после отключения из розетки. Сервисное меню тоже не трогаем: там настройки матрицы.

          Для учёбы у телевизора два безопасных пути: внешнее управление через разъём RS-232C (если он есть) и донорские платы.
        quiz:
          ask: Почему нельзя «быстро глянуть плату» включённого в сеть ТВ?
          options:
            - text: В блоке питания сетевое напряжение — это опасно для жизни
              ok: true
              say: Да. И конденсаторы опасны даже после отключения.
            - text: Можно, если не трогать руками
              say: Нет. Одного касания щупом достаточно.

      - title: Разъём RS-232C
        text: |-
          На задней панели некоторых LG есть разъём RS-232C (иногда мини-джек CONTROL & SERVICE). Через него ТВ принимает команды: включиться, сменить вход, громкость.

          Нужен переходник USB–[[RS-232]], а **не** USB-[[UART]]: уровни RS-232 — от ±5 до ±15 В, они сожгут вход на 3,3 В.
        verify: Есть ли разъём у вашей модели и формат команд — в руководстве к ТВ (раздел о внешнем управлении).
        quiz:
          ask: Под рукой только USB-UART CH340 на 3,3 В. Подключать к RS-232C?
          options:
            - text: Нет — нужен переходник USB–RS-232
              ok: true
              say: Да. Уровни RS-232 для UART слишком высокие.
            - text: Да, это одно и то же
              say: Названия похожи, напряжения — нет.

      - title: Безопасная настройка — самый мягкий тренажёр
        text: |-
          Если разъём есть: сначала только запросы состояния, потом безвредная настройка — громкость или яркость.

          Как цель разработки — навык с картой параметров и проход «прочитать → было → стало → ДА → сверка → вернуть как было». Самый безопасный способ освоить настройку на настоящем устройстве: худший исход — громко.
        dirizher: Штурман → «Настроить прибор» → «Пример — сменить диапазон термодатчика» показывает тот же проход на Modbus.

      - title: Донорская плата
        text: |-
          Неисправная основная плата ТВ с барахолки — отличная мишень. Выбирайте по фото: нужна микросхема 24C… ([[EEPROM]] настроек) или 25… (SPI-флешка) в корпусе SOIC-8.

          Платы, где вся память — [[eMMC]] (плоский квадрат без ножек), пропускайте: Дирижёр их не обслуживает.
        tick:
          - На фото платы найден 24C… или 25…

      - title: EEPROM 24Cxx
        text: |-
          24Cxx хранит настройки — от 128 байт до 64 КБ. Говорит по [[I2C]]: два провода и адрес.
          - Bus Pirate 5 — лезвие `bp5_i2c`;
          - T48 — лезвие `minipro`.

          У CH341A есть режим I2C, но лезвия для него в Дирижёре пока нет — кандидат в новые плагины.
        verify: Чек-листы bp5_i2c и minipro в STATUS.md — проверяются как раз на таких платах.

      - title: Сломать и починить на доноре
        text: |-
          Тот же цикл, что с учебной флешкой:
          1. Снять копию, сохранить эталоном.
          2. Записать образ с затёртым куском (`run --image`).
          3. Новый run: диагностика найдёт отличия, «Записать эталонную прошивку» → «ДА» → сверка.
          4. Попробовать откат.
        warn: Только на доноре. На плате, которая вам нужна, образы руками не правят.

  # =====================================================================
  - id: combos
    icon: "🔗"
    title: Связки
    tagline: упражнения, где одна вещь проверяет другую
    level: 2
    minutes: 30
    needs:
      - то, что уже есть, — по каждой связке
    learn:
      - сверять результат двумя независимыми способами
    next: [first_chip, laptop, car]
    steps:
      - title: Почему связки — самое ценное
        text: |-
          Лучше всего учит упражнение, в котором одна вещь проверяет другую: замер — чтение, чужая программа — свой код, симулятор — железо. Так ошибка видна сразу, а не через неделю.

      - title: "Телефон + iPad + демо"
        text: |-
          Учебный ремонт на двух экранах: на одном вопросы и «ДА», на другом справочник и журнал.
          - **Чему учит:** 7 шагов, слово «ДА», откат.
          - **Уровень:** 0.

      - title: "Мультиметр + прищепка + CH341A"
        text: |-
          Прозвонка и замер линий до первого чипа.
          - **Чему учит:** откуда берутся находка stable_read и блокировка по напряжению.
          - **Уровень:** 1.

      - title: "Учебная W25Q64 + симулятор"
        text: |-
          Одна и та же поломка — виртуально и вживую. Сравните протоколы в «Журнале».
          - **Чему учит:** где симулятор отличается от железа — каждое отличие становится тестом.
          - **Уровень:** 2.

      - title: "Паяльник + донор + CH341A + Pi"
        text: |-
          Чтение на плате и выпаянного чипа, сравнение отпечатков.
          - **Чему учит:** почему плата мешает чтению; запись «что помогло».
          - **Уровень:** 2.

      - title: "Логический анализатор + донор-роутер"
        text: |-
          [[логический анализатор|Замер]] при включении: читает ли процессор флешку.
          - **Чему учит:** жив ли процессор; модуль `extras.sigrok`.
          - **Уровень:** 2.

      - title: "Acer + мультиметр + паяльник + камера"
        text: |-
          Полный цикл BIOS: маркировка → профиль → копия → разбор дампа.
          - **Чему учит:** новый профиль, preserve, 1,8 В.
          - **Уровень:** 3.

      - title: "Гранта + телефон (OpenDiag) + Pi (ELM327 USB)"
        text: |-
          Чужая программа — эталон, свои команды — сверка.
          - **Чему учит:** протоколы, дисциплина «только чтение».
          - **Уровень:** 4.

      - title: "LG (RS-232C) + Pi + телефон"
        text: |-
          Громкость через «было → стало → ДА → откат».
          - **Чему учит:** настройка на настоящем устройстве без риска.
          - **Уровень:** 5.
        quiz:
          ask: Какая связка лучше всего учит «где симулятор расходится с железом»?
          options:
            - text: Учебная W25Q64 + симулятор
              ok: true
              say: Да — одна и та же поломка в двух мирах, протоколы рядом.
            - text: Телефон + iPad
              say: Это про интерфейс, а не про железо.

  # =====================================================================
  - id: shop
    icon: "🛒"
    title: Что докупить
    tagline: по порядку пользы — что открывает следующий уровень
    level: 2
    minutes: 10
    needs: []
    learn:
      - что купить первым и зачем
    next: [first_chip, solder]
    steps:
      - title: Минимум для настоящего чипа (уровни 1–3)
        text: |-
          - Raspberry Pi 4/5 + microSD + блок питания — или любой ПК с Linux.
          - Набор CH341A — программатор, прищепка SOIC-8, переходник 1,8 В, платы SOIC-8→DIP-8.
          - 3–5 микросхем W25Q64 (SOIC-8) и пара 24C02 — расходники для «сломать и починить».
          - Флюс, оплётка, сплав Розе, пинцет, тонкие иглы для щупов.
        quiz:
          ask: Что купить первым?
          options:
            - text: Pi (или ПК с Linux) и набор CH341A
              ok: true
              say: Да. Это открывает главную веху — первую настоящую флешку.
            - text: Паяльный фен
              say: Пригодится позже. Начать можно и без него.

      - title: Доноры
        text: |-
          - Старый роутер — лучший первый донор: SPI-флешка на 3,3 В, консоль UART и подробные описания плат в вики OpenWrt.
          - Плата ТВ с 24C… — для EEPROM.

      - title: Машина
        text: |-
          - ELM327: USB для Pi и/или Bluetooth для телефона.

      - title: Связь и замеры
        text: |-
          - USB-UART 3,3 В (CH340 или CP2102) — консоль роутера, прошивка ESP.
          - Логический анализатор на 8 каналов (fx2lafw) — «замер».
          - USB–RS-232 — только если у ТВ есть разъём RS-232C.

      - title: Микроконтроллеры и позже
        text: |-
          - Arduino Nano, ESP32 DevKit, STM32 Blue Pill + ST-Link V2 — безопасные мишени для лезвий avrdude, esptool, probe_rs.
          - Позже — Bus Pirate 5, T48, паяльный фен, USB–RS-485 и дешёвый датчик [[Modbus RTU]] для навыка modbus_rtu.
        verify: Карту регистров датчика Modbus — по его паспорту.

  # =====================================================================
  - id: limits
    icon: "⛔"
    title: "Границы: чего не делаем"
    tagline: шесть ситуаций — правильно ответить и понять почему
    level: 0
    minutes: 10
    needs: []
    learn:
      - где проходят границы проекта и почему
    next: [start]
    steps:
      - title: Принципы, на которых всё стоит
        text: |-
          Границы идут от трёх принципов Дирижёра:
          - **1 — не навреди.** Порядок всегда «замер → чтение → запись».
          - **9 — человек решает, программа делает.** Подключение, пайка и окончательное «да» — за вами.
          - **12 — законность.** Только свои устройства, без обхода защит.

      - title: Ситуация 1 — телефон
        text: |-
          Друг просит «снять аккаунт» с найденного телефона.
        quiz:
          ask: Что делаете?
          options:
            - text: Отказываюсь — это обход защиты чужого устройства
              ok: true
              say: Да. Принцип 12 — только свои устройства и без обхода защит.
            - text: Пробую — вдруг получится
              say: Нет. Дело не в «получится», а в том, что это чужое и защищённое.

      - title: Ситуация 2 — машина
        text: |-
          Знакомый просит «немного поправить пробег» перед продажей.
        quiz:
          ask: Что делаете?
          options:
            - text: Отказываюсь — это подделка
              ok: true
              say: Да. И с ЭБУ и приборной панелью мы вообще работаем только чтением.
            - text: Соглашаюсь, если он владелец
              say: Владелец или нет — правка пробега обманывает покупателя.

      - title: Ситуация 3 — запись мимо Дирижёра
        text: |-
          Хочется быстро: `flashrom -w` руками, без всяких копий.
        quiz:
          ask: Что не так?
          options:
            - text: Не будет копии «до», сверки и записи в журнале
              ok: true
              say: Да. Учёба теряет смысл, а ошибку не откатить.
            - text: Всё так — Дирижёр только мешает
              say: Дирижёр не мешает, а помнит то, что легко забыть в спешке.

      - title: Ситуация 4 — пароль BIOS
        text: |-
          На ноутбуке стоит пароль BIOS, который вы не помните.
        quiz:
          ask: Что делаете?
          options:
            - text: Не обхожу защиту инструментами — иду официальным путём производителя с документами о покупке
              ok: true
              say: Да. Обход защит прошивки — вне задач проекта.
            - text: Ищу в дампе и вычищаю пароль
              say: Это обход защиты — Дирижёр в этом не помогает.

      - title: Ситуация 5 — включённый телевизор
        text: |-
          Хочется посмотреть плату ТВ, не выключая его.
        quiz:
          ask: Что делаете?
          options:
            - text: Не вскрываю — для учёбы беру донорскую плату
              ok: true
              say: Да. Сетевое напряжение опасно для жизни.
            - text: Вскрываю, но аккуратно
              say: Аккуратность не защищает от сетевого напряжения.

      - title: Ситуация 6 — нестабильное чтение
        text: |-
          Дирижёр пишет stable_read — чтения не совпали, а очень надо записать.
        quiz:
          ask: Что делаете?
          options:
            - text: Добиваюсь стабильного чтения — прищепка, провода, выпаивание
              ok: true
              say: Да. Обходов подтверждения и защиты в Дирижёре нет — и не будет.
            - text: Ищу, как отключить проверку
              say: Отключить нельзя. Это принцип 2 — копия «до», подтверждённая повторным чтением.
