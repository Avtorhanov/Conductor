  - id: ipad
    icon: "📲"
    title: iPad
    tagline: второй экран, проверка Safari, даташиты и тетрадь замеров
    level: 0
    minutes: 20
    needs:
      - iPad с Safari
    learn:
      - как проверить вёрстку Дирижёра в Safari
      - как удобно работать с двумя экранами
      - как вести записи, из которых потом получаются профили
    next: [phone, meter]
    steps:
      - title: Роль iPad
        text: |-
          iPad — второй экран и справочная стойка. Прошивка Apple подписана и защищена, а обход защит — вне задач проекта (принцип 12). Поэтому iPad — не мишень.
        quiz:
          ask: Почему iPad не мишень для Дирижёра?
          options:
            - text: Прошивка подписана и защищена, а обход защит — вне задач проекта
              ok: true
              say: Да. Дирижёр работает только со своими устройствами и без обхода защит.
            - text: Потому что у iPad нет памяти
              say: Память есть, но это не наш случай.

      - title: Проверка в Safari
        text: |-
          Откройте демо в Safari → «Поделиться» → «На экран \"Домой\"». Проверьте в портрете и в альбоме:
        tick:
          - Шапка без просвета при прокрутке
          - Все шесть вкладок видны целиком
          - Значок копирования рядом с командой копирует
        dirizher: iPad — не iPhone. Чек-лист «iPhone (0.5.2)» в STATUS.md он закрывает лишь частично — запишите отдельной строкой «iPad — проверено».

      - title: Два экрана на столе
        text: |-
          На телефоне — «Работа»: вопросы сеанса и «ДА». На iPad — «Справочник» с рисунком проводов или «Журнал». Рядом — [[даташит]] чипа в PDF: таблица выводов и напряжение.

          Задание у Дирижёра одно за раз. Если второй экран попробует начать другое — прибор скажет «уже идёт задание».

      - title: Тетрадь замеров
        text: |-
          Заведите заметку на каждое устройство. Из таких записей потом получаются профили и карточки справочника:
          - устройство и модель с наклейки;
          - маркировка чипа (фото);
          - напряжение на выводе 8 (замер);
          - чем подключали и как;
          - чем закончилось и что помогло.
        tick:
          - Завёл шаблон заметки

