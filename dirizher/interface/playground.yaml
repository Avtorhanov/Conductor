# УЧЕБНАЯ ПЛОЩАДКА «Дирижёра»: пошаговый тренажёр «что и как можно сделать тем, что есть».
# Один файл для всех экранов: страница playground.html (прибор, демо, отдельный файл) и мастер в терминале.
#
# Как устроено:
#   glossary — словарик: термин → объяснение простыми словами. В тексте термин пишется [[термин]]
#              или [[термин|как показать]] — на странице по нему можно нажать и прочитать объяснение.
#   tracks   — маршруты (ноутбук, ТВ, телефон, машина, связки…). У маршрута: id, icon, title, tagline,
#              level (0…5), minutes, needs (что нужно), learn (чему научитесь), next (куда дальше),
#              links (источники), steps (шаги).
#   Шаг: title, text (абзацы; строки «- » — список; **жирный**, `код`, [[термин]]) и по желанию:
#       why — зачем; dirizher — где это в Дирижёре; code — команды; warn — осторожно;
#       verify — что ещё не проверено на железе; tick — список «сделал»;
#       quiz — вопрос: ask + options (text, ok: true у верных, say — объяснение);
#       console — «сеанс вживую»: ask + cases (label, lines, result, check).
#   Строки console: «[n/7]» — шаг, «✔» — хорошо, «⚠» — замечание, «✖» — стоп, «?» и «!» — вопрос Дирижёра,
#       «>» — ваш ответ, « …» в конце — строка сокращена, «~» в начале — пример, а не запись ядра.
#       check: <сценарий> — тест сверяет строки с настоящим ядром на учебной микросхеме
#       (tests/test_playground.py: healthy_new, corrupt_ref, flaky, voltage, dry, blank).
#
# После правки проверьте:  python3 -m unittest tests.test_playground -v

version: 1
title: Учебная площадка
say: >-
  Пошаговый тренажёр: что можно сделать с тем, что есть дома, и как это связано с Дирижёром.
  Выберите устройство или связку — в каждом шаге простое объяснение, вопрос «что сделаете?» и что нажать в Дирижёре.
  Ничего не записывается и не ломается: это тренажёр.

glossary:
  прошивка: Программа, записанная в память устройства. Без неё роутер, телевизор или ноутбук — «железо без мозгов». Хранится в микросхеме памяти и не стирается при выключении.
  дамп: Точная копия всего содержимого микросхемы памяти, сохранённая в файл. Байт в байт.
  копия «до»: Дамп, который Дирижёр снимает перед любой записью. По нему всегда можно вернуть всё как было.
  копия «после»: Дамп, прочитанный сразу после записи. Доказывает, что в чип легло именно то, что писали.
  эталон: Дамп с исправного устройства такой же модели. Образец для сравнения и источник для ремонта.
  сверка: Чтение чипа обратно после записи и побайтное сравнение с тем, что писали. Не совпало — запись не считается удачной.
  SHA-256: «Отпечаток пальца» файла — 64 знака. Изменится хоть один байт — отпечаток станет другим. Так Дирижёр проверяет, что копия не испорчена.
  сектор: Кусок памяти по 4 КБ. Флешка стирается и сравнивается такими кусками, поэтому Дирижёр пишет «отличается 16 секторов».
  SPI-флешка: Самая частая память прошивки — восьминогая микросхема серии 25xx (W25Q64, MX25L6406, GD25Q128…). Общается по шине SPI.
  SPI: Способ «разговора» с чипом по четырём проводам — выбор чипа (CS), такт (CLK), данные в чип (DI) и из чипа (DO). Плюс питание и земля.
  JEDEC ID: «Паспорт» чипа — три байта, которые чип сообщает по запросу. Например, EF4017 — Winbond (EF), объём 64 Мбит (17). Читается, ничего не меняя.
  движок: Внешняя программа с открытым кодом, которая на самом деле говорит с чипом — flashrom, probe-rs, avrdude, esptool, minipro. Дирижёр её вызывает, но не встраивает.
  лезвие: Плагин Дирижёра для одного инструмента. Знает, как вызвать движок и разобрать его ответ. Умеет четыре вещи — проверить, что инструмент есть, опознать, прочитать, записать.
  профиль: Текстовый файл YAML с описанием чипа или платы — напряжение, объём, проверки, способы ремонта, уникальные области. Новый чип — новый профиль.
  ядро: Сердце Дирижёра — общий порядок работы из 7 шагов и правила безопасности. Не знает ни одного конкретного чипа.
  учебный режим: Виртуальная микросхема W25Q64 на 8 МБ внутри Дирижёра. Её можно «ломать» командами sim — настоящее железо не используется, учебные копии хранятся отдельно.
  Штурман: Главная вкладка Дирижёра — цели, подсказки «сейчас важно», уроки и «что дальше?».
  капот: Кнопка </> в Дирижёре — правка профилей, навыков и справки прямо на приборе, с проверкой и историей версий.
  preserve: Раздел профиля платы со списком уникальных мест в памяти (MAC, серийник, калибровки). При ремонте эти места берутся с текущего чипа, а не из эталона.
  MAC-адрес: Уникальный сетевой номер устройства. Два устройства с одинаковым MAC в одной сети мешают друг другу.
  откат: Возврат на чип копии «до» из прошлого сеанса. Перед откатом тоже снимается копия — поэтому и откат можно отменить.
  dry-run: Пробный режим — Дирижёр снимает копию, проводит диагностику и показывает план, но ничего не пишет.
  flashrom: Движок для SPI-флешек. Работает с CH341A, Bus Pirate, шиной SPI самого Raspberry Pi и десятками других программаторов.
  CH341A: Дешёвый USB-программатор для SPI-флешек (25xx) и EEPROM (24xx). Самая частая «первая покупка».
  прищепка: Зажим SOIC-8 с проводами — цепляется на чип прямо на плате, без пайки.
  SOIC-8: Корпус чипа — 8 ножек, по 4 с двух сторон, шаг 1,27 мм. На такой корпус надевается прищепка.
  WSON-8: Плоский корпус без ножек — контакты снизу. Прищепка на него не садится, нужен выпай или специальный зонд.
  вывод 1: Первая ножка чипа. Отмечена точкой или скосом на корпусе. От неё по кругу считаются остальные.
  напряжение чипа: На каком напряжении работает чип — обычно 3,3 В или 1,8 В. Подать больше — можно сжечь. Узнаётся по маркировке и даташиту.
  переходник 1,8 В: Плата между программатором и чипом, которая понижает уровни до 1,8 В. Нужна для «нежных» чипов (W25Q64FW, XM25QU128 и др.).
  даташит: Официальное описание чипа от производителя — выводы, напряжение, объём, команды. Ищется по маркировке.
  EEPROM: Маленькая память настроек — серия 24Cxx (от 128 байт до 64 КБ). Хранит настройки ТВ, калибровки, пробег. Говорит по шине I2C.
  I2C: Шина на два провода — данные (SDA) и такт (SCL). У каждого устройства на шине свой адрес.
  eMMC: «Флешка с контроллером» в корпусе BGA (шарики снизу), как в телефонах и новых телевизорах. Дирижёр её не обслуживает.
  BIOS: Прошивка компьютера, которая включает его и запускает Windows. Лежит в SPI-флешке на материнской плате. В новых компьютерах — UEFI.
  ЭБУ: Электронный блок управления двигателем — «мозги» машины. Решает, сколько топлива и когда искра.
  OBD-II: Диагностический разъём машины на 16 контактов. В нём есть питание, масса и линии связи с блоками.
  ELM327: Адаптер-переводчик между компьютером или телефоном и диагностикой машины. Бывает USB, Bluetooth, Wi-Fi.
  K-Line: Старая однопроводная линия диагностики машин.
  CAN: Современная шина машины — два провода, по которым блоки обмениваются сообщениями.
  UART: Простой последовательный порт — два провода TX и RX, уровни 3,3 или 5 В. Через него говорят консоли роутеров и модули ESP.
  RS-232: Старый последовательный порт с уровнями от ±5 до ±15 В. Напрямую с UART соединять нельзя — сгорит.
  Modbus RTU: Протокол промышленных приборов (терморегуляторы, датчики) по шине RS-485. В Дирижёре — навык modbus_rtu.
  мультиметр: Прибор, который меряет напряжение (V), сопротивление (Ω) и «прозванивает» соединения.
  прозвонка: Проверка, есть ли соединение между двумя точками. Мультиметр пищит, если есть.
  флюс: Паста или жидкость для пайки. Очищает металл и помогает припою растекаться.
  сплав Розе: Легкоплавкий припой — плавится около 95–100 °C. Смешивается с обычным припоем на ножках, и чип снимается без перегрева платы.
  донор: Неисправная или ненужная плата, на которой не жалко учиться — роутер, плата ТВ, старая материнская плата.
  binwalk: Программа, которая показывает, что лежит внутри дампа — загрузчик, ядро, файловая система.
  логический анализатор: «Осциллограф для цифры» — записывает, какие нули и единицы бегут по проводам. В Дирижёре — «замер».
  PWA: Сайт, установленный на телефон как приложение — со значком и без адресной строки.
  Termux: Терминал Linux на Android. В нём можно запустить Python и Дирижёр в учебном режиме.
  Raspberry Pi: Маленький компьютер на Linux размером с ладонь. Основной «дом» Дирижёра.
  udev: Часть Linux, которая решает, кто может пользоваться USB-устройством. Правило udev даёт доступ к CH341A без sudo.

tracks:
  # =====================================================================
  - id: start
    icon: "🎓"
    title: Как думает Дирижёр
    tagline: без железа — демо или учебный режим, 7 шагов сеанса, копии, эталон, «ДА»
    level: 0
    minutes: 30
    needs:
      - телефон, iPad или ПК с браузером
    learn:
      - зачем копия «до» и почему чип читается дважды
      - что такое эталон и уникальные данные платы
      - когда Дирижёр запрещает запись и как вернуть всё как было
    next: [first_chip, meter, phone]
    steps:
      - title: Прошивка — это память устройства
        text: |-
          Внутри почти любой электроники — роутера, телевизора, ноутбука, блока управления машины — есть [[прошивка]]: программа, которая оживляет «железо». Она лежит в маленькой микросхеме памяти, чаще всего в восьминогой [[SPI-флешка|SPI-флешке]].

          Если прошивка повреждена — оборвалось обновление, пропало питание, — устройство не включается или зависает на логотипе. Его можно оживить, записав в память правильное содержимое.

          Но запись — самое опасное действие. Записали не то — и вернуть уже нечего. Поэтому главное правило Дирижёра: **сначала копия, потом всё остальное**.
        quiz:
          ask: Что опаснее всего при ремонте прошивки?
          options:
            - text: Прочитать память два раза подряд
              say: Чтение ничего не меняет. Дирижёр специально читает минимум дважды — чтобы убедиться в контакте.
            - text: Записать файл, не сняв копию того, что было
              ok: true
              say: Именно. Без копии «до» ошибку не исправить — старое содержимое потеряно навсегда.
            - text: Разглядывать маркировку чипа
              say: Смотреть можно сколько угодно — это ничего не меняет.

      - title: Дирижёр — прораб, а не рабочий
        text: |-
          Сам Дирижёр в микросхему не лезет. Читают и пишут проверенные программы с открытым кодом — [[движок|движки]]: flashrom, probe-rs, avrdude, esptool и другие.

          Дирижёр вызывает их через [[лезвие|лезвия]] и следит за порядком: копия → проверка → план → ваше «ДА» → запись → сверка. Ошибка программы не роняет Дирижёр: каждая запускается отдельно, с ограничением по времени и записью в журнал.

          Знания о чипах и платах лежат в [[профиль|профилях]] — обычных текстовых файлах. Новый чип — новый профиль, новый инструмент — новое лезвие. [[ядро|Ядро]] при этом не меняется.
        dirizher: Вкладка «Справочник» → «Движки» — кто написал каждую программу, как она работает сама и что добавляет Дирижёр. В терминале — `python3 -m dirizher catalog flashrom`.
        quiz:
          ask: Кто на самом деле читает SPI-флешку, когда вы нажимаете «Узнать, что за микросхема»?
          options:
            - text: Ядро Дирижёра
              say: Ядро не знает ни одного чипа — оно только задаёт порядок и защиту.
            - text: Программа flashrom, которую запускает лезвие flashrom_spi
              ok: true
              say: Верно. Лезвие запускает flashrom отдельным процессом, разбирает ответ и отдаёт ядру.
            - text: Профиль winbond_w25q64
              say: Профиль — описание «что это и как лечить». Сам он ничего не читает.

      - title: Где тренироваться без железа
        text: |-
          У Дирижёра есть [[учебный режим]] — виртуальная микросхема W25Q64 на 8 МБ с «прошивкой» учебной платы. Её можно ломать как угодно: настоящее железо не используется, учебные копии хранятся отдельно.

          Три способа:
          - **Демо в браузере** — ничего не ставить: avtorhanov.github.io/Conductor. Ходы записаны настоящим ядром.
          - **На приборе или ПК** — `python3 -m dirizher web`, переключатель «учебный режим» вверху справа.
          - **В терминале** — команды ниже.
        code: |-
          python3 -m dirizher sim reset        # исправная прошивка
          python3 -m dirizher --sim run        # полный сеанс ремонта
          python3 -m dirizher sim corrupt      # «оборвалось обновление»
          python3 -m dirizher sim flaky        # «плохой контакт прищепки»
          python3 -m dirizher sim steady       # контакт снова хороший
        dirizher: "[[Штурман]] → «Потренироваться без железа» — те же поломки кнопками."
        tick:
          - Открыл демо или учебный режим
          - Нашёл, где переключается режим «учебный / железо»

      - title: Сеанс из 7 шагов
        text: |-
          Любой ремонт в Дирижёре идёт одинаково. Это и есть защита: порядок не зависит от спешки и настроения.

          - **1. Подготовка** — напоминание: обесточено, прищепка ровно, напряжение сверено.
          - **2. Опознание** — инструмент читает только «паспорт» чипа ([[JEDEC ID]]), подбирается профиль.
          - **3. Напряжение** — чип и программатор должны работать на одном напряжении.
          - **4. Копия «до»** — память читается минимум дважды, чтения сравниваются.
          - **5. Диагностика** — не пусто ли, не одни ли нули, совпадает ли с [[эталон|эталоном]].
          - **6. План** — что и откуда записать, сколько [[сектор|секторов]] изменится, что сохранится с платы.
          - **7. Запись** — только после вашего слова «ДА». Затем чтение обратно и [[сверка]].
        quiz:
          ask: На каком шаге в микросхему впервые может что-то записаться?
          options:
            - text: На 2-м — при опознании
              say: Опознание только читает идентификатор. Это правило для каждого лезвия.
            - text: На 4-м — когда снимается копия
              say: Копия — это чтение. Запись появляется позже.
            - text: На 7-м — после слова «ДА»
              ok: true
              say: Да. И только если выполнены все 7 условий записи.

      - title: "Сеанс вживую: выберите ситуацию"
        text: |-
          Ниже — настоящие протоколы ядра на учебной микросхеме, чуть сокращённые. Выберите ситуацию и посмотрите, что скажет Дирижёр. Обратите внимание на значки: ✔ — хорошо, ⚠ — замечание, ✖ — стоп.
        console:
          ask: Что подключено?
          cases:
            - label: Исправное устройство, эталона ещё нет
              check: healthy_new
              lines:
                - "══ Сеанс №1 — симулятор ══"
                - "[2/7] Опознание (только чтение идентификаторов)"
                - "✔ Winbond W25Q64, 8 МБ SPI NOR (виртуальная)"
                - "✔ профиль: Winbond W25Q64 (8 МБ, SPI NOR, 3.3 В)"
                - "[3/7] Совместимость по напряжению"
                - "✔ напряжение совместимо: чип 3.3 В, адаптер 3.3 В"
                - "[4/7] Резервная копия «до» (чтение с повторной сверкой)"
                - "чтение 1 из 2…"
                - "чтение 2 из 2…"
                - "✔ копия сохранена: f63ccfa95dcd… (8388608 байт)"
                - "✔ по содержимому узнана плата: Учебная плата (симулятор) на W25Q64"
                - "[5/7] Диагностика"
                - "✔ stable_read: повторные чтения совпали — контакт надёжный"
                - "✔ not_zero: данные не нулевые"
                - "✔ not_blank: память не пустая"
                - "compare_reference: эталона пока нет. Когда убедитесь, что устройство исправно, сохраните этот дамп как эталон — система предложит."
                - "[6/7] План ремонта"
                - "✔ неисправностей в прошивке не найдено"
                - "? Эталона «example_sim_board» ещё нет. Устройство сейчас исправно работает? Если да — сохраню этот дамп как эталон."
                - "> да"
                - "✔ эталон «example_sim_board» сохранён — с ним будут сравниваться такие же устройства"
                - "Сеанс №1: неисправностей не найдено. …"
              result: Записи не было — ремонтировать нечего. Зато появился эталон, с которым теперь будут сравниваться такие же платы.
            - label: Сбой обновления, эталон есть
              check: corrupt_ref
              lines:
                - "══ Сеанс №2 — симулятор ══"
                - "[2/7] Опознание (только чтение идентификаторов)"
                - "✔ Winbond W25Q64, 8 МБ SPI NOR (виртуальная)"
                - "[3/7] Совместимость по напряжению"
                - "✔ напряжение совместимо: чип 3.3 В, адаптер 3.3 В"
                - "[4/7] Резервная копия «до» (чтение с повторной сверкой)"
                - "✔ копия сохранена: 2c22c3d8f1bd… (8388608 байт)"
                - "✔ по содержимому узнана плата: Учебная плата (симулятор) на W25Q64"
                - "[5/7] Диагностика"
                - "✔ stable_read: повторные чтения совпали — контакт надёжный"
                - "✖ compare_reference: отличается 157 из 2048 секторов по 4 КБ от эталона «example_sim_board» (уникальные области платы не учитываются). По разделам: «Прошивка» — 157 секторов. …"
                - "✔ layout: разделов в карте: 5, загрузчик на месте"
                - "[6/7] План ремонта"
                - "? Что сделать? (выше — способы, которые чаще помогали)"
                - "> 1 — весь эталон (второй способ берёт из эталона только испорченные разделы)"
                - "способ: Записать эталонную прошивку (MAC и серийник сохраняются) — ещё не применялся"
                - "изменится секторов по 4 КБ: 157 из 2048"
                - "• сохраняю с текущего чипа: MAC-адрес и серийный номер платы (0x7FF000+0x1000)"
                - "[7/7] Подтверждение, запись и сверка"
                - "! Записать эталон «example_sim_board» в «Winbond W25Q64, 8 МБ SPI NOR (виртуальная)»? Копия «до» сохранена: 2c22c3d8f1bd…"
                - "> ДА"
                - "сверка: читаю обратно…"
                - "✔ записано и сверено, копия «после»: f63ccfa95dcd…"
                - "? Устройство заработало?"
                - "> да"
                - "✔ записал успех — этот способ будет предлагаться первым"
                - "Сеанс №2: отремонтировано"
              result: Отремонтировано. Записаны только нужные данные из эталона, а MAC и серийник этой платы остались свои. Копия «до» хранится — можно вернуть.
            - label: Плохой контакт прищепки
              check: flaky
              lines:
                - "[4/7] Резервная копия «до» (чтение с повторной сверкой)"
                - "чтение 1 из 2…"
                - "чтение 2 из 2…"
                - "⚠ чтения не совпали — пробую ещё раз…"
                - "⚠ копия сохранена: 9bb2e2682f16… (8388608 байт) — НЕ подтверждена"
                - "[5/7] Диагностика"
                - "✖ stable_read: повторные чтения НЕ совпадают: плохой контакт прищепки, питание или помехи. Запись заблокирована, пока чтение не станет стабильным."
                - "✖ compare_reference: отличается 166 из 2048 секторов по 4 КБ от эталона «example_sim_board» …"
                - "[6/7] План ремонта"
                - "✖ • копия «до» не подтверждена повторным чтением — добейтесь стабильного чтения"
                - "Сеанс №3: запись заблокирована правилами безопасности. …"
              result: Стоп. Чтения расходятся — значит, неизвестно, что на самом деле на чипе. Поправьте прищепку (или выпаяйте чип) и запустите снова.
            - label: Чип на 1,8 В, а программатор на 3,3 В
              check: voltage
              lines:
                - "[2/7] Опознание (только чтение идентификаторов)"
                - "~✔ Winbond W25Q64.W, 8192 КБ (SPI)"
                - "~✔ профиль: Winbond W25Q64FW (8 МБ, SPI NOR, 1.8 В)"
                - "[3/7] Совместимость по напряжению"
                - "✖ чип рассчитан на 1.8 В, а адаптер — на 3.3 В. Работа остановлена, чтобы не повредить чип: нужен переходник на 1.8 В (и смените programmer_voltage в config.yaml — общий или у плагина)."
                - "Сеанс №5: остановлено: несовместимое или непроверенное напряжение. …"
              result: "Остановлено ещё до чтения. Чип цел. Нужен переходник 1,8 В и настройка programmer_voltage: 1.8."
            - label: Сначала план, без записи (--dry-run)
              check: dry
              lines:
                - "══ Сеанс №6 — ПРОБНЫЙ РЕЖИМ, запись отключена — симулятор ══"
                - "[5/7] Диагностика"
                - "✖ compare_reference: отличается 157 из 2048 секторов по 4 КБ от эталона «example_sim_board» …"
                - "[6/7] План ремонта"
                - "изменится секторов по 4 КБ: 157 из 2048"
                - "• пробный режим (--dry-run): запись отключена"
                - "✔ пробный режим: план показан, ничего не записано. Уберите --dry-run, чтобы выполнить."
              result: Вы увидели план и масштаб ремонта, ничего не тронув. Так стоит начинать с любым новым устройством.
        dirizher: То же самое на приборе — Штурман → «Потренироваться без железа» → поломка → «Починить».

      - title: "Копия «до»: почему чип читается дважды"
        text: |-
          [[прищепка|Прищепка]] на чипе — это 8 пружинящих контактов. Один чуть отошёл — и часть байтов читается неправильно, а программа об этом не узнает. Если такую «кривую» копию потом записать обратно, устройство испорчено окончательно.

          Поэтому Дирижёр читает память минимум два раза и сравнивает [[SHA-256|отпечатки]] чтений. Совпали — контакт надёжный. Не совпали — копия всё равно сохраняется (вдруг пригодится), но **запись запрещена**, пока чтение не станет стабильным.

          Каждая копия хранится под именем, равным её отпечатку, только для чтения, и никогда не удаляется. Можно включить второе место хранения (`mirror_dir`) — на флешку или другой диск.
        dirizher: После неудачи — «Записать, что помогло». Одна фраза, например «переставил прищепку — вывод 1 был не там». В следующий раз Дирижёр покажет её первой.
        quiz:
          ask: Два чтения не совпали. Что сделает Дирижёр?
          options:
            - text: Запишет эталон, чтобы исправить разницу
              say: Наоборот — при нестабильном чтении запись запрещена. Неизвестно, что на самом деле на чипе.
            - text: Сохранит копию, покажет stable_read и заблокирует запись
              ok: true
              say: Так и есть. Поправьте прищепку или выпаяйте чип и запустите заново.
            - text: Удалит неудачную копию
              say: Дирижёр никогда не удаляет копии — даже неудачные.

      - title: "Эталон: с чем сравнивать"
        text: |-
          [[эталон|Эталон]] — копия памяти с исправного устройства такой же модели. С ним Дирижёр сравнивает всё, что читает, по секторам по 4 КБ и показывает, сколько отличается.

          Где взять эталон:
          - снять с исправного устройства — Штурман → «Снять копию с исправного устройства»;
          - Дирижёр сам предложит, если диагностика ничего не нашла, а вы подтвердили, что устройство работает.

          Подписывайте эталоны меткой — так не перепутать разные платы на одинаковых чипах.
        code: python3 -m dirizher --sim run --label "учебная-плата"
        quiz:
          ask: Чип сломанного роутера прочитан. Эталона нет, файла прошивки нет. Что будет?
          options:
            - text: Дирижёр всё равно что-нибудь запишет
              say: Без эталона и образа записывать нечего — Дирижёр так и скажет.
            - text: "Будут копия «до» и диагностика, а записи не будет: «нужен эталон или образ»"
              ok: true
              say: Верно. Копия уже ценна — с ней можно разбираться, и всегда можно вернуть как было.

      - title: Уникальные данные платы
        text: |-
          Две одинаковые платы отличаются не только наклейкой. В памяти у каждой свой [[MAC-адрес]], серийный номер, калибровки радио. Запишете в роутер дамп соседского — получите чужие MAC и серийник.

          Профиль платы перечисляет такие места в разделе [[preserve]]. При ремонте Дирижёр берёт их с **текущего** чипа, а остальное — из эталона. Если на чипе эти места пустые, он честно предупредит: данные из эталона окажутся чужими.
        dirizher: В протоколе учебной платы это строка «сохраняю с текущего чипа — MAC-адрес и серийный номер платы».
        quiz:
          ask: Зачем профилю платы раздел preserve?
          options:
            - text: Чтобы не затереть MAC, серийник и калибровки этой платы
              ok: true
              say: Да. Всё остальное приходит из эталона, а уникальное остаётся своим.
            - text: Чтобы запись шла быстрее
              say: Скорость тут ни при чём — речь о сохранности уникальных данных.
            - text: Чтобы спрятать данные от пользователя
              say: Ничего не прячется — наоборот, Дирижёр пишет в протоколе, что именно сохранил.

      - title: "Слово «ДА», откат и обучение"
        text: |-
          Запись начнётся, только если выполнены все 7 условий:
          - есть копия «до», подтверждённая повторным чтением;
          - нет блокирующих находок диагностики;
          - напряжение чипа совместимо с программатором;
          - размер образа равен размеру чипа;
          - профиль разрешает запись;
          - не включён пробный режим;
          - вы сами ввели слово «ДА». Кнопкой его не заменить.

          После записи — чтение обратно, сверка и [[копия «после»]]. Затем вопрос «Устройство заработало?». Это и есть обучение: удачные способы ремонта поднимаются в списке.

          Не помогло — [[откат]] вернёт копию «до».
        code: |-
          python3 -m dirizher --sim history       # номера сеансов
          python3 -m dirizher --sim rollback 2    # вернуть копию «до» из сеанса №2
        quiz:
          ask: Ремонт не помог. Как вернуть всё как было?
          options:
            - text: Откат — rollback с номером сеанса (в Штурмане «Вернуть как было»)
              ok: true
              say: Да. Перед откатом Дирижёр снимет копию текущего состояния — откат тоже можно отменить.
            - text: Записать наугад что-нибудь другое
              say: Наугад — ровно то, от чего защищает Дирижёр.
            - text: Никак — копия «до» пропала после записи
              say: Копии никогда не удаляются. Копия «до» лежит в хранилище, пока вы сами её не тронете.

  # =====================================================================
  - id: phone
    icon: "📱"
    title: Телефон Xiaomi Redmi
    tagline: пульт и экран Дирижёра, приложение на экране, ядро в Termux, камера-лупа
    level: 0
    minutes: 40
    needs:
      - телефон с Chrome
      - Wi-Fi или мобильный интернет для первого открытия
    learn:
      - как управлять прибором с телефона
      - как поставить Дирижёр значком на экран
      - как фотографировать маркировку чипов
    next: [ipad, start, car]
    steps:
      - title: Роль телефона
        text: |-
          Телефон — пульт, экран и лупа Дирижёра. С него удобно отвечать на вопросы сеанса, вводить «ДА», смотреть справочник и журнал.

          В его собственную прошивку мы не лезем. Это ваш рабочий телефон, память там — [[eMMC]] или UFS (Дирижёр их не обслуживает), а загрузчик защищён производителем.
        quiz:
          ask: Можно ли Дирижёром перепрошить сам Redmi?
          options:
            - text: Да, через CH341A
              say: Нет — в телефоне не SPI-флешка, а eMMC/UFS, и это вообще другой мир.
            - text: Нет — другая память, защищённый загрузчик и рабочий телефон
              ok: true
              say: Верно. Телефон в этой площадке — инструмент, а не мишень.

      - title: Демо без установки
        text: |-
          Откройте в Chrome avtorhanov.github.io/Conductor. Это та же страница, что на приборе, только ответы записаны заранее настоящим ядром на учебной микросхеме.

          Пройдите учебный ремонт дважды — с эталоном и без. Нарочно введите неверное слово вместо «ДА» и ответьте «нет» на «Заработало?» — посмотрите, как Дирижёр себя защищает.
        tick:
          - Прошёл ремонт до «отремонтировано»
          - Ввёл неверное слово — запись отменилась
          - Ответил «нет» — Дирижёр предложил откат

      - title: Дирижёр значком на экране
        text: |-
          Страницу можно поставить на телефон как приложение ([[PWA]]) — со значком и без адресной строки. Это пункт проверки из STATUS.md, и его можно закрыть прямо сейчас.

          Демо → Chrome → ⋮ → «Установить приложение» (или «Добавить на главный экран»).
        tick:
          - Значок появился и не обрезан лаунчером Xiaomi
          - Открывается без адресной строки
          - Открывается в режиме полёта после первого запуска
        dirizher: Результат запишите в STATUS.md — пункт «PWA на телефоне». Если что-то не так — скриншот для следующей сессии.

      - title: Настоящее ядро на телефоне (Termux)
        text: |-
          Если Raspberry Pi ещё нет, ядро можно запустить прямо на телефоне в [[Termux]] — в учебном режиме. Работает всё, кроме настоящего железа: USB-программатор из Android так просто не достать.

          Плюс по сравнению с демо — можно попробовать то, чего в демо нет: «что помогло», самопроверку, настройку параметров учебной платы, откат.
        code: |-
          pkg install python git
          pip install pyyaml
          git clone https://github.com/Avtorhanov/Conductor
          cd Conductor
          python -m dirizher sim reset
          python -m dirizher --sim run
          python -m dirizher web          # затем открыть адрес из консоли в Chrome
        verify: Запуск в Termux не проверялся. Если тесты (python -m unittest) проходят и там — это новая проверенная площадка, запишите в STATUS.md.

      - title: Пульт для Raspberry Pi
        text: |-
          Когда появится Pi: запустите на нём `python3 -m dirizher web`. В консоли будут адрес и код доступа.

          Телефон и Pi должны быть в одной сети: общий роутер, точка доступа телефона — или Pi сам раздаёт сеть DIRIZHER (MANUAL, раздел 1.5).
        quiz:
          ask: Телефон не открывает адрес прибора. Что проверить первым?
          options:
            - text: Что телефон и Pi в одной сети, и адрес с портом 8080 набран верно
              ok: true
              say: Да. Чаще всего телефон сидит на мобильном интернете, а не на Wi-Fi с прибором.
            - text: Переустановить Дирижёр
              say: Рано. Сначала сеть и адрес.
            - text: Отключить код доступа насовсем
              say: Код защищает прибор от чужих — он тут ни при чём.

      - title: Камера-лупа
        text: |-
          Маркировка на чипе мелкая и бледная. Телефон легко её прочитает:
          - зум 2× и фонарик под углом — буквы становятся контрастными;
          - снимок крупно, потом увеличить пальцами;
          - точка или скос на корпусе — это [[вывод 1]].

          При разборке — фото каждого шага и винтов, разложенных на листе бумаги. Собирать будет проще.
        quiz:
          ask: Как на фото найти вывод 1?
          options:
            - text: По точке или скосу на корпусе
              ok: true
              say: Да. От вывода 1 остальные считаются против часовой стрелки, если смотреть сверху.
            - text: Это всегда левая верхняя ножка
              say: Зависит от того, как лежит плата. Ориентир — только точка или скос.

