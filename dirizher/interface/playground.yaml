  - id: meter
    icon: "📏"
    title: Мультиметр
    tagline: шаг «замер» — питание чипа, прозвонка прищепки, линии CH341A, машина
    level: 1
    minutes: 40
    needs:
      - мультиметр
      - батарейка, старый USB-кабель
    learn:
      - мерить напряжение и прозванивать без риска
      - понимать, какой переходник нужен чипу
      - находить плохой контакт до того, как он испортит копию
    next: [solder, first_chip]
    steps:
      - title: Что умеет мультиметр
        text: |-
          [[мультиметр|Мультиметр]] — это шаг «замер», который Дирижёр сам сделать не может. По нему вы отвечаете на вопрос о напряжении на 3-м шаге сеанса.

          Три режима, которые нужны:
          - **V⎓** — постоянное напряжение (чип, USB, аккумулятор);
          - **Ω** — сопротивление;
          - **[[прозвонка]]** (значок динамика) — пищит, если есть соединение.
        warn: Напряжение меряем только в режиме V и с красным щупом в гнезде V. Щуп в гнезде 10A или режим тока на аккумуляторе — это короткое замыкание.
        quiz:
          ask: Красный щуп в гнезде 10A. Вы хотите измерить аккумулятор машины. Что делаете?
          options:
            - text: Меряю — прибор разберётся сам
              say: Нет! В гнезде 10A мультиметр — почти перемычка. Будет короткое замыкание.
            - text: Переставляю щуп в гнездо V и выбираю режим V⎓
              ok: true
              say: Правильно. Это привычка на всю жизнь — смотреть на гнездо перед замером.

      - title: Первое знакомство
        text: |-
          Потренируйтесь на безопасном:
          - сомкните щупы в режиме прозвонки — писк и почти 0 Ом;
          - батарейка 1,5 В — свежая показывает чуть больше 1,5;
          - USB-зарядка — около 5 В (через USB-тестер или старый разрезанный кабель: красный +, чёрный −).
        tick:
          - Прозвонка пищит
          - Батарейка измерена
          - USB измерен

      - title: Прозвонка прищепки SOIC-8
        text: |-
          Прищепка — главный источник проблем. Прозвоните каждый из 8 контактов от «зуба» прищепки до гребёнки переходника и запишите таблицу «вывод → вывод».

          Потом проверьте, что соседние контакты **не** звонятся между собой.
        why: Именно плохой контакт даёт находку stable_read «чтения не совпали» и блокирует запись. Найти его мультиметром быстрее, чем гадать.
        tick:
          - Все 8 контактов звонятся до гребёнки
          - Соседние не замкнуты

      - title: Напряжение на линиях CH341A
        text: |-
          У «чёрного» [[CH341A]] известна особенность: на линиях данных может быть больше 3,3 В даже в режиме 3,3 В. Проверим ваш экземпляр.
          - CH341A в USB, панелька пустая, перемычка — 3,3 В.
          - Чёрный щуп — вывод 4 (GND) секции «25xx», красный — вывод 8 (VCC), потом вывод 1 (CS).
          - Запишите оба числа.
        verify: Это пункт STATUS «напряжение на линиях чёрного CH341A» — результат внесите в карточку CH341A в «Справочнике» через [[капот]].
        quiz:
          ask: На выводе CS при перемычке 3,3 В вы намерили 4,8 В. Что делаете?
          options:
            - text: Подключаю чип — Дирижёр сам проверит напряжение
              say: Дирижёр сверяет то, что записано в настройках и профиле, а не реальные вольты на проводах. Замер — ваша часть работы.
            - text: С нежными чипами такой программатор не использую без доработки, 1,8-вольтовые — только через переходник 1,8 В
              ok: true
              say: Верно. Запишите результат в карточку — следующему человеку не придётся гадать.

      - title: Питание чипа на плате
        text: |-
          Главный замер перед первым подключением к плате — [[напряжение чипа]], то есть сколько вольт на выводе 8 у SPI-флешки: около 3,3 или около 1,8.

          Шаг ножек SOIC-8 — 1,27 мм. Соскользнувший щуп замкнёт соседние выводы на работающей плате. Мерьте тонкими иглами или на конденсаторе рядом с чипом.

          Сверьте число с [[даташит|даташитом]] по маркировке. Не сходится — стоп, разбираемся.
        quiz:
          ask: На выводе 8 — 1,82 В. Что нужно?
          options:
            - text: Переходник 1,8 В и programmer_voltage 1.8 в config.yaml
              ok: true
              say: Да. Тогда Дирижёр пропустит шаг 3, а чип не получит лишних вольт.
            - text: Ничего — CH341A работает на 3,3 В, это почти то же
              say: Нет. 3,3 В на чипе, рассчитанном на 1,8, — почти вдвое больше. Его можно сжечь.

      - title: Машина — аккумулятор и разъём OBD
        text: |-
          - Аккумулятор: в покое обычно около 12,4–12,7 В, на работающем двигателе — около 14 В. Точную норму смотрите в руководстве к машине.
          - Разъём [[OBD-II]]: вывод 16 — питание (+), 4 и 5 — масса, 7 — K-Line.
          - Перед тем как вставить адаптер, измерьте 16 относительно 4.
        quiz:
          ask: Где «плюс» в разъёме OBD-II?
          options:
            - text: Вывод 16
              ok: true
              say: Верно. 4 и 5 — масса.
            - text: Вывод 1
              say: Вывод 1 у разных производителей занят по-разному. Питание — 16.

      - title: Привычка
        text: |-
          Замер записывается **до** подключения, а не по памяти после. Если потом что-то пойдёт не так, запись подскажет причину — и её можно будет внести в «что помогло».

  # =====================================================================
  - id: solder
    icon: "🔥"
    title: Паяльник
    tagline: переходники, вечная учебная флешка, выпаивание чипа на доноре
    level: 1
    minutes: 60
    needs:
      - паяльник с подставкой
      - флюс, припой, оплётка, пинцет
      - сплав Розе или Вуда — для выпаивания
      - донор (старый роутер или плата ТВ)
    learn:
      - паять гребёнки и чип на переходник
      - снимать SOIC-8 без перегрева платы
      - понимать, почему чтение на плате и снятого чипа отличается
    next: [first_chip, tv]
    steps:
      - title: Безопасность и рабочее место
        text: |-
          - Паяем только обесточенную плату. У ноутбука первым делом отключаем разъём аккумулятора.
          - Паяльник — всегда в подставке. Под рукой ничего горючего.
          - Дым [[флюс|флюса]] — в сторону: проветривание или вентилятор. Защитные очки.
          - Руки мыть после работы с припоем.
        quiz:
          ask: Нужно выпаять чип на плате ноутбука. Что первым делом?
          options:
            - text: Отключить разъём аккумулятора и блок питания
              ok: true
              say: Да. Литиевый аккумулятор, замкнутый жалом, может загореться.
            - text: Нагреть паяльник посильнее
              say: Сначала безопасность. И сильнее — не значит лучше.

      - title: Как получается хорошая пайка
        text: |-
          - Жало чистое и залуженное (покрыто тонким слоем припоя). Около 300–350 °C для обычного оловянно-свинцового припоя.
          - Флюс на место пайки.
          - Сначала прогрейте контакт и площадку, потом подайте припой — он сам растечётся.
          - Хорошая пайка блестит и похожа на маленький вулкан. Серый шарик — плохой контакт.

      - title: Гребёнки на переходник
        text: |-
          В наборах CH341A платы SOIC-8→DIP-8 часто идут без припаянных гребёнок. Это лучшее первое упражнение.

          Секрет: вставьте гребёнку в саму панельку программатора и паяйте прямо на ней — выводы встанут ровно.
        tick:
          - Гребёнки припаяны
          - Каждый вывод звонится до площадки
          - Соседние не замкнуты

      - title: Вечная учебная флешка
        text: |-
          Новую W25Q64 в корпусе [[SOIC-8]] припаяйте на переходник SOIC-8→DIP-8:
          - флюс на площадки;
          - припаять один угловой вывод, выровнять чип;
          - пропаять остальные, проверить, что нет перемычек.

          Точка на корпусе — [[вывод 1]] — со стороны метки на переходнике.

          Теперь у вас есть чип, который можно стирать и «ломать» сколько угодно, — идеальная мишень для первого настоящего сеанса.
        quiz:
          ask: Как не перепутать ориентацию чипа на переходнике?
          options:
            - text: Точка на корпусе (вывод 1) — к метке «1» на переходнике
              ok: true
              say: Да. Перевёрнутый чип не опознается, а при подаче питания может пострадать.
            - text: Надписью вверх, остальное неважно
              say: Надпись бывает с любой стороны. Ориентир — только вывод 1.

      - title: Выпаивание SOIC-8 на доноре
        text: |-
          [[донор|Донор]] — плата, которую не жалко.

          1. Сначала прочитайте чип прищепкой прямо на плате — это сеанс 1 в Дирижёре.
          2. Много флюса и капля [[сплав Розе|сплава Розе]] на оба ряда ножек. Сплав смешается с припоем и сделает его легкоплавким.
          3. Греть ряды по очереди, чип поддеть пинцетом, когда отпустит.
          4. Площадки очистить оплёткой.
          5. Прочитать снятый чип в панельке — сеанс 2.
        quiz:
          ask: Чип не отходит. Что делать?
          options:
            - text: Тянуть сильнее
              say: Сорвёте площадки — плата станет непригодной.
            - text: Добавить флюса и сплава, греть оба ряда по очереди
              ok: true
              say: Да. Чип отпустит сам, когда оба ряда расплавлены.

      - title: Чтение на плате и снятого чипа
        text: |-
          Сравните в «Журнале» отпечатки копий сеанса 1 (на плате) и сеанса 2 (снятый чип).
          - **Совпали** — на этой плате можно читать прищепкой.
          - **Не совпали** — программатор питал всю плату, и процессор мешал чтению. На таких платах чип выпаивают.
        dirizher: Результат — в «Записать, что помогло» и в STATUS.md, пункт «чтение чипа на плате».

  # =====================================================================
  - id: first_chip
    icon: "💾"
    title: Первая настоящая флешка
    tagline: "связка: Pi + CH341A + учебная W25Q64 — главная веха, «сломать и починить»"
    level: 2
    minutes: 90
    needs:
      - Raspberry Pi или ПК с Linux
      - CH341A, учебная W25Q64 на переходнике
      - мультиметр
    learn:
      - установить flashrom и дать доступ к CH341A
      - пройти настоящий сеанс от опознания до сверки
      - сломать чип и починить его эталоном
    next: [laptop, combos, tv]
    steps:
      - title: Что понадобится и зачем
        text: |-
          Это главная веха: первый сеанс на настоящем железе. Ошибиться не страшно — учебную флешку не жалко.
          - [[Raspberry Pi]] или любой ПК с Linux — здесь работает Дирижёр;
          - [[CH341A]] — программатор;
          - учебная W25Q64 на переходнике (из маршрута «Паяльник») или новая в DIP-корпусе;
          - мультиметр — замер перед подключением.
        why: Этот маршрут закрывает самые важные пункты STATUS.md — разбор вывода flashrom, JEDEC ID и время чтения 8 МБ.

      - title: Установка
        text: |-
          [[flashrom]] — движок. Правило [[udev]] даёт доступ к CH341A без sudo. После usermod нужно выйти из системы и войти снова.

          `lsusb` должен показать устройство `1a86:5512` — это CH341A.
        code: |-
          sudo apt install flashrom
          sudo cp system/99-dirizher.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -aG plugdev $USER
          lsusb | grep 1a86
          python3 -m dirizher plugins       # flashrom_spi — включён и доступен
        tick:
          - flashrom установлен
          - lsusb видит 1a86:5512
          - plugins показывает flashrom_spi

      - title: Замер и чип в панельку
        text: |-
          - Мультиметр: напряжение на выводе 8 секции «25xx» CH341A (маршрут «Мультиметр»).
          - Чип — в секцию для 25xx, [[вывод 1]] — как нарисовано на плате программатора.
          - Рычаг панельки зажат.
        verify: Положение вывода 1 в панельке — по рисунку на вашем экземпляре CH341A.

      - title: Опознание
        text: |-
          Штурман → «Узнать, что за микросхема» или команда ниже. Это только чтение.

          Ожидаемо: [[JEDEC ID]] EF4017 и профиль winbond_w25q64. Если «ничего не опознано» — проверьте ориентацию, контакт и `lsusb`.
        code: python3 -m dirizher detect
        verify: Формат вывода flashrom с настоящим чипом проверен только на подставной программе. Если JEDEC не распознался — сохраните журнал сеанса (data/logs/) и приложите к следующей сессии разработки.
        quiz:
          ask: detect пишет «ничего не опознано». Что делаете?
          options:
            - text: Проверяю вывод 1, рычаг панельки и lsusb
              ok: true
              say: Да. Это три самые частые причины.
            - text: Запускаю запись — вдруг заработает
              say: Без опознания Дирижёр запись и не начнёт. И правильно.

      - title: Новый чип — пустой
        text: |-
          Новая флешка с завода обычно стёрта — во всех байтах 0xFF. Дирижёр так и скажет. Это не поломка.
        console:
          ask: Что покажет первый run на новом чипе?
          cases:
            - label: Новая W25Q64, эталона нет
              check: blank
              lines:
                - "[2/7] Опознание (только чтение идентификаторов)"
                - "~✔ Winbond W25Q64.V, 8192 КБ (SPI)"
                - "✔ профиль: Winbond W25Q64 (8 МБ, SPI NOR, 3.3 В)"
                - "[5/7] Диагностика"
                - "✔ stable_read: повторные чтения совпали — контакт надёжный"
                - "⚠ not_blank: память пустая (стёрта). Если устройство не стартует — прошивку нужно восстановить."
                - "[6/7] План ремонта"
                - "• восстановить из эталона нельзя — эталона для этого устройства ещё нет"
                - "• можно записать официальный образ: запустите с --image путь/к/файлу.bin"
                - "⚠ есть замечания, но подходящего способа ремонта сейчас нет"
              result: Всё верно — чип пустой, и записывать в него пока нечего. Следующий шаг даст ему «прошивку».
        quiz:
          ask: Дирижёр пишет «память пустая (стёрта)» про новый чип. Это поломка?
          options:
            - text: Нет — новые флешки обычно приходят стёртыми
              ok: true
              say: Да. А вот на работавшем устройстве такая находка — серьёзный повод для ремонта.
            - text: Да, чип бракованный
              say: Не спешите — пустой не значит неисправный.

      - title: Учебная прошивка — на настоящий чип
        text: |-
          Возьмём «прошивку» учебной платы из симулятора и запишем её на настоящий чип. Размер совпадает — 8 МБ. Команды запускаются из папки проекта.
          1. В учебном режиме снимите исправную копию и выгрузите её файлом (N — номер сеанса из history).
          2. Запишите файл на настоящий чип через `--image`. Дирижёр снимет копию «до», покажет план и спросит «ДА».
          3. На «Устройство заработало?» ответьте «позже» — это не устройство, а учебный чип.
          4. Новый run: по содержимому Дирижёр узнает «Учебную плату» и предложит сохранить эталон — ответьте «да».
        code: |-
          python3 -m dirizher sim reset
          python3 -m dirizher --sim run
          python3 -m dirizher --sim history
          python3 -m dirizher --sim export N --kind before --to ~/uchebnaya.bin
          python3 -m dirizher run --image ~/uchebnaya.bin --label "учебная-W25Q64"
          python3 -m dirizher run --label "учебная-W25Q64"
        tick:
          - Запись прошла сверку
          - Дирижёр узнал «Учебную плату» по содержимому
          - Эталон сохранён

      - title: Сломать и починить
        text: |-
          Теперь главное упражнение — как в симуляторе, но вживую.
          1. Сделайте «сломанный» образ: 16 секторов затёрты — как при оборванном обновлении.
          2. Запишите его через `--image`. План скажет «изменится секторов: 16».
          3. Запустите run без образа. Диагностика найдёт 16 отличий от эталона и предложит «Записать эталонную прошивку».
          4. «ДА» → сверка → починено. В «Журнале» видны все копии «до» и «после».
        code: |-
          python3 -c "import pathlib; h=pathlib.Path.home(); d=bytearray((h/'uchebnaya.bin').read_bytes()); d[0x40000:0x50000]=b'\xff'*0x10000; (h/'broken.bin').write_bytes(d)"
          python3 -m dirizher run --image ~/broken.bin
          python3 -m dirizher run --label "учебная-W25Q64"
        warn: Это упражнение — только на учебном чипе. На устройстве, которое вам нужно, образы руками не правят.
        quiz:
          ask: После шага 3 Дирижёр пишет «отличается 16 из 2048 секторов». Что он предложит?
          options:
            - text: Записать эталонную прошивку — изменится 16 секторов
              ok: true
              say: Да. Эталон снят с этого же чипа, когда он был исправен.
            - text: Стереть чип целиком
              say: Стирания «на всякий случай» в Дирижёре нет — только запись нужного образа после «ДА».

      - title: Время, журнал и пункты STATUS
        text: |-
          В журнале каждого сеанса записаны команды flashrom, их вывод и время. Это и есть данные для проверки на железе.
          - `history` — список сеансов; `show N` — подробности с командами.
          - Сколько секунд заняло чтение 8 МБ? Хватает ли таймаутов (read_timeout 900 с, write_timeout 1800 с)?
          - JEDEC ID распознан? Название чипа?
        code: |-
          python3 -m dirizher history
          python3 -m dirizher show N
        dirizher: Отметьте в STATUS.md пункты «Разбор вывода flashrom» и «Время чтения и записи 8 МБ через CH341A». Расхождения — сначала тест, потом исправление (MANUAL 2.6).

