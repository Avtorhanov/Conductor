# Настройки «Дирижёра». Относительные пути — от папки, где лежит этот файл.

# Память, резервные копии, эталоны, журналы.
# Удобно держать на отдельной флешке/SSD, чтобы знания переносились между приборами:
#   data_dir: /media/pi/DIRIZHER/data
data_dir: ./data

# Второе место для копий дампов (необязательно). Пусто — выключено.
#   mirror_dir: /media/pi/BACKUP/dirizher
mirror_dir: ""

# База знаний: профили чипов и плат.
profiles_dir: ./profiles

safety:
  # Напряжение логики вашего адаптера. CH341A обычно 3.3 В.
  # Для 1.8-вольтовых чипов: поставьте переходник 1.8 В и поменяйте здесь на 1.8.
  programmer_voltage: 3.3
  voltage_tolerance: 0.3
  # Сколько раз читать чип для резервной копии (минимум 2: чтения сверяются).
  read_passes: 2
  # Слово для подтверждения записи (также принимается YES).
  confirm_word: "ДА"
  # Ниже этой уверенности опознания система спросит вас (0..1).
  confidence_threshold: 0.6

plugins:
  # Симулятор включается только флагом --sim, здесь его включать не нужно.
  simulator:
    enabled: false
  flashrom_spi:
    enabled: true
    programmer: "ch341a_spi"    # или: "buspirate_spi:dev=/dev/ttyACM0", "linux_spi:dev=/dev/spidev0.0,spispeed=8000"
    probe_timeout: 120
    read_timeout: 900
    write_timeout: 1800
