# Демо интерфейса «Дирижёра» на GitHub Pages: тесты → сборка демо (tools/build_pages.py) → публикация.
# Один раз включите: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Адрес демо: https://<владелец>.github.io/<репозиторий>/
name: Демо на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python и PyYAML (как на Raspberry Pi OS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          python3 --version
      - name: Тесты без железа
        run: python3 -m unittest
      - name: Сборка демо (настоящее ядро на учебной микросхеме)
        run: python3 tools/build_pages.py --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
